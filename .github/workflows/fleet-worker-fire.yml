name: Fire fleet worker

# Starts the two scheduled tasks that docs/routines/fleet-worker.md describes:
# the Fleet worker (general maintenance) and the Loop worker (the continuous
# improvement system's work), on separate cadences so their costs are
# measured separately (ADR 0046). The claude.ai Routines page offers hourly or
# daily, nothing between, and hourly cost about $150-215 a week in sessions
# that mostly found nothing to do (2026-11-08 measurement), so the schedule
# lives here and each task keeps only its API trigger.
#
# * schedule and workflow_dispatch only. No pull_request or push, so no path
#   filter and not a required check. scheduled-run-health.yml reports failed
#   scheduled runs.
# * One matrix job fires both tasks, so the gating below is written once. Each
#   matrix entry names its own variables and secret, and the step reads them
#   by name (`vars[matrix.url_var]`), so an unset one can never fall through
#   to the other task's value. fail-fast is off, and each entry has its own
#   concurrency group, so a failed or slow fire of one never cancels or
#   queues behind the other.
# * Configuration lives in one place each, with no default: a task's fire URL
#   is a repository variable, its fire bearer an Actions secret. A missing
#   one fails that fire naming it, so a missed fire shows red. Fleet worker:
#   FLEET_WORKER_FIRE_URL and FLEET_WORKER_FIRE_BEARER. Loop worker:
#   LOOP_WORKER_FIRE_URL and LOOP_WORKER_FIRE_BEARER.
# * Nothing from the event is interpolated into a `run:` block; the only
#   `${{ }}` uses are the `env:` that hands the URL, bearer and cadence to
#   the step.
# * The bearer reaches curl on stdin through --config -, never argv, and the
#   response body is never printed.
# * No `uses:` step, so actions.lock lists this file with no actions.
# * A repository variable per task (FLEET_WORKER_EVERY_HOURS and
#   LOOP_WORKER_EVERY_HOURS; 3, 6, 12, 24 or 168) thins that task's schedule
#   for a smaller Claude plan. Each cron line below names the longest cadence
#   its slots belong to, and a scheduled run fires a task only when its line
#   (github.event.schedule, read from the event file) is on that task's
#   cadence. For the Fleet worker the variable is optional: unset, every
#   scheduled run fires (every 3 hours). For the Loop worker it is required,
#   with no default, because the loop's spend must fit the weekly eval cap:
#   unset fails the fire naming it. A dispatch fires both tasks regardless of
#   cadence. 168 fires weekly, on the Tuesday 00:20 UTC line. Any other value
#   fails the fire naming the variable (acsi-kit#29). The cadence never comes
#   from the clock: GitHub starts scheduled runs one to two hours late, so the
#   earlier "UTC hour is a multiple" test skipped every fire from 2026-11-10
#   to 2026-11-12 once the variable was 6.

on:
  schedule:
    - cron: '20 0 * * 2'
    - cron: '20 0 * * 0,1,3-6'
    - cron: '20 12 * * *'
    - cron: '20 6,18 * * *'
    - cron: '20 3,9,15,21 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  fire:
    name: Fire the ${{ matrix.worker }} worker routine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Per-entry groups, never a workflow-level one: the two fires must neither
    # cancel nor wait on each other, and a fire still running when the next
    # slot starts queues behind its own task only (cancel-in-progress false).
    concurrency:
      group: ${{ matrix.concurrency }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: fleet
            concurrency: fleet-worker-fire
            url_var: FLEET_WORKER_FIRE_URL
            bearer_var: FLEET_WORKER_FIRE_BEARER
            every_var: FLEET_WORKER_EVERY_HOURS
            every_required: 'false'
            text: Scheduled fire from fleet-worker-fire.yml
          - worker: loop
            concurrency: loop-worker-fire
            url_var: LOOP_WORKER_FIRE_URL
            bearer_var: LOOP_WORKER_FIRE_BEARER
            every_var: LOOP_WORKER_EVERY_HOURS
            every_required: 'true'
            text: Scheduled fire of the loop worker from fleet-worker-fire.yml
    steps:
      - name: Fire the ${{ matrix.worker }} worker routine
        env:
          FIRE_URL: ${{ vars[matrix.url_var] }}
          FIRE_BEARER: ${{ secrets[matrix.bearer_var] }}
          EVERY_HOURS: ${{ vars[matrix.every_var] }}
          WORKER: ${{ matrix.worker }}
          URL_VAR: ${{ matrix.url_var }}
          BEARER_VAR: ${{ matrix.bearer_var }}
          EVERY_VAR: ${{ matrix.every_var }}
          EVERY_REQUIRED: ${{ matrix.every_required }}
          FIRE_TEXT: ${{ matrix.text }}
        run: |
          set -euo pipefail
          if [[ "$EVERY_REQUIRED" == true && -z "${EVERY_HOURS:-}" ]]; then
            echo "::error::not configured: variable $EVERY_VAR (3, 6, 12, 24 or 168). It has no default; set it in this repository's Actions settings."
            exit 1
          fi
          case "${EVERY_HOURS:-}" in
            ""|3|6|12|24|168) ;;
            *) echo "::error::variable $EVERY_VAR must be 3, 6, 12, 24 or 168$([[ "$EVERY_REQUIRED" == true ]] || echo ", or unset")"; exit 1 ;;
          esac
          if [[ -n "${EVERY_HOURS:-}" && "${GITHUB_EVENT_NAME:-}" == schedule ]]; then
            line=$(jq -r '.schedule // ""' "$GITHUB_EVENT_PATH")
            case "$line" in
              '20 0 * * 2') slot=168 ;;
              '20 0 * * 0,1,3-6') slot=24 ;;
              '20 12 * * *') slot=12 ;;
              '20 6,18 * * *') slot=6 ;;
              '20 3,9,15,21 * * *') slot=3 ;;
              *) echo "::error::unknown schedule line: $line"; exit 1 ;;
            esac
            if (( slot < EVERY_HOURS )); then
              echo "::notice::skipped: $EVERY_VAR is $EVERY_HOURS and the cron line '$line' is on the $slot-hour cadence"
              exit 0
            fi
          fi
          missing=()
          [[ -n "$FIRE_URL" ]] || missing+=("variable $URL_VAR")
          [[ -n "$FIRE_BEARER" ]] || missing+=("secret $BEARER_VAR")
          if (( ${#missing[@]} )); then
            echo "::error::not configured: ${missing[*]}. Set them in this repository's Actions settings; the task's API trigger on claude.ai gives both."
            exit 1
          fi

          body=$(jq -n --arg t "$FIRE_TEXT" '{text: $t}')
          response=$(mktemp)
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$FIRE_BEARER" |
            curl -sS --config - -o "$response" -w '%{http_code}' -X POST \
              "$FIRE_URL" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              -d "$body") || code="curl-error"
          rm -f "$response"

          if [[ "$code" != 200 ]]; then
            echo "::error::fire failed (HTTP $code)"
            exit 1
          fi
          echo "::notice::$WORKER worker fired"
