# Dependabot for this repo.
#
# Previously this repo pinned third-party GitHub Actions to commit SHAs (per
# the account-wide SHA-pinning convention) but had no dependabot.yml at all,
# so those pins had no bump path — they'd sit until someone noticed. This
# onboards the github-actions ecosystem so pins get proposed weekly, landed
# unattended by .github/workflows/dependabot-auto-merge.yml once CI is
# green (see that file for why this repo needs a scheduled sweep, not just
# native auto-merge, to actually land them).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # MINIMUM PACKAGE AGE ("cooldown") — how long a release must exist before
    # Dependabot will even OPEN the PR. Version updates ONLY: security
    # updates bypass cooldown by GitHub's spec, so an advisory still opens
    # (and auto-merges) immediately. GitHub's own default is an implicit
    # 3-day minimum age, so `default-days: 7` here is a deliberate RAISE, not
    # a floor from zero — it mechanises this account's standing 7-day
    # cooling-off convention for third-party action SHAs (see
    # cms-platform/AGENTS.md, "SHA-pin every workflow `uses:`"), matching
    # cms-platform's own .github/dependabot.yml.
    #
    # NO semver-major-days (and no semver-minor-days / semver-patch-days
    # either): GitHub's Dependabot options reference supports only
    # `default-days` for the github-actions ecosystem, not per-SemVer-tier
    # cooldown. Every actions bump, majors included, waits the flat 7 days
    # above. Adding any `semver-*-days` key here is a schema validation
    # error, not a key Dependabot quietly ignores: GitHub rejects the file
    # and no update runs. This file shipped with `semver-major-days: 30` on
    # 2026-08-10. GitHub's `dependabot` check on that commit failed with "The
    # property '#/updates/0/cooldown/semver-major-days' is not supported for
    # the package ecosystem 'github-actions'"
    # (https://github.com/Adam-S-Daniel/_agent-guidance/runs/93574456014), and
    # no update job ran until the key was removed
    # (https://github.com/Adam-S-Daniel/claude-memory-map/issues/31). That
    # check runs only once the file is on main, so a PR never shows it
    # (https://github.com/Adam-S-Daniel/cms-platform/issues/429).
    # dependabot/dependabot-core#14628 is the open upstream request to add
    # the support.
    cooldown:
      default-days: 7

    # cms-platform's version is NOT Dependabot's to move. The
    # scheduled-run-health thin caller carries that version TWICE — the
    # reusable's `uses:@<tag>` and the `platform_ref:` input that pins the
    # audit script the reusable sparse-checks-out. The github-actions
    # ecosystem can see only the `uses:` half, so an unignored bump moves the
    # workflow and leaves the script pin behind: exactly the two-halves skew
    # cms-platform#244 was filed for, after ONE platform release produced
    # fifteen piecemeal bump PRs in jodidaniel.com (#8-#22). The ignore is
    # deliberately UNSCOPED — an `update-types`/`versions`-scoped one would
    # not have stopped that incident. Both CMS consumers carry this identical
    # rule; here the two halves are bumped by hand (this repo has no
    # platform-bump.yml, so there is no automation to conflict with either).
    ignore:
      - dependency-name: "Adam-S-Daniel/cms-platform/*"
