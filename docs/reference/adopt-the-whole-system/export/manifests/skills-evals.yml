                fi
    new: |2
                  echo "::error::repository secret EVAL_ROUTINE_FIRE_BEARER is not set"
                  exit 1
                fi
                # C7: the trigger id is a variable, so it is checked before it
                # becomes part of a URL: trig_ and 1-64 letters or digits.
                if ! [[ "${ROUTINE_TRIGGER_ID:-}" =~ ^trig_[A-Za-z0-9]{1,64}$ ]]; then
                  echo "::error::the routine-fire variable ROUTINE_TRIGGER_ID is not set or is not a trig_ id"
                  exit 1
                fi
                FIRE_URL="https://api.anthropic.com/v1/claude_code/routines/${ROUTINE_TRIGGER_ID}/fire"
    why: C7. Validates the variable and builds the fire URL from it, before any payload work or API call.
