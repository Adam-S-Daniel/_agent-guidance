    why: C7. The source names its owner's trigger in the header; the kit's adopter creates their own routine.
  - path: .github/workflows/routine-eval-fire.yml
    stage: output
    old: "          FIRE_URL: https://api.anthropic.com/v1/claude_code/routines/trig_EXAMPLE/fire\n"
    new: "          ROUTINE_TRIGGER_ID: ${{ vars.ROUTINE_TRIGGER_ID }}\n"
