# Test-only fixture, invented for the adoption kit (DECISIONS X9 and C8).
# The kit ships no eval fixtures; the tests of the shared fake `gh`
# (harness/fakes/gh) drive this seed's payloads through it. It measures
# nothing and no schedule names it.
skill: fake-gh-example
registry: https://github.com/example-adopter/agentskills

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/example-site"

prompt: >
  Which open pull requests are blocked, and why?

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  - id: no-write-attempted
    description: The fake recorded no write
    type: file_matches
    paths: [".gh-invocations.log"]
    require_present: true
    must_match:
      - "^--- invocation \\(class="
    must_not_match:
      - "^--- invocation \\(class=write"

judge_rubric: |
  Score 1-5 on whether the reply names each blocked pull request and its
  cause, using only what `gh` returned.
