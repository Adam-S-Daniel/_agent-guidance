# Test-only fixture, invented for the adoption kit (DECISIONS X9 and C8).
# The kit ships no eval fixtures; the machinery tests load this one as
# input. It measures nothing and no schedule names it.

skill: workflow-path-audit
registry: https://github.com/example-adopter/acsi-agentskills

# No `model:` or `judge.model:` pin: the committed roster picks both.
context:
  repository: example-org/example-site
  revision: "a1b2c3d4e5f60718293a4b5c6d7e8f9011223344"
  guidance_revision: "b2c3d4e5f60718293a4b5c6d7e8f901122334455"
  budget:
    guidance_bytes: 40000
    skill_catalog_bytes: 10000
    skill_payload_bytes: 100000

judge:
  weights:
    completeness: 0.5
    salience: 0.3
    restraint: 0.2

prompt: >
  Make each workflow in this repository run only when a file it depends on
  has changed.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  - id: docs-change-routes-correctly
    description: A docs-only change builds the docs and runs the required check, nothing else
    type: changeset_triggers
    paths: [".github/workflows/*.yml"]
    changeset: ["docs/guide.md"]
    expect_triggered:
      - ".github/workflows/docs.yml"
      - ".github/workflows/tests.yml"
    expect_skipped:
      - ".github/workflows/deploy.yml"
  - id: required-check-always-fires-and-gates-internally
    description: The required check's workflow has no workflow-level path filter
    type: required_checks_early_skip
    paths: [".github/workflows/*.yml"]
  - id: workflows-still-parse
    description: Every workflow still parses as YAML
    type: yaml_parses
    paths: [".github/workflows/*.yml"]
  - id: ruleset-unchanged
    description: The ruleset that names the required check is untouched
    type: files_unchanged
    paths: [".github/rulesets/main.json"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Completeness: does every pull_request/push workflow have a deliberate
  trigger decision, the required check included? (2) Salience: are the paths
  the ones each workflow's steps read? (3) Restraint: was nothing else edited?
