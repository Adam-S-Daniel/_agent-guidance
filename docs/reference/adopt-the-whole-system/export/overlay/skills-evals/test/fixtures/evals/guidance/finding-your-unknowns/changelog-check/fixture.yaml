# Test-only fixture, invented for the adoption kit (DECISIONS X9 and C8).
# The kit ships no eval fixtures; the machinery tests load this one as
# input. It measures nothing and no schedule names it.

subject: guidance
section: finding-your-unknowns

timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  Write NOTES.md on what this change leaves unknown. STATUS.json has the state of things.

arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: pull-request-linked
    description: The pull request carries its full URL
    type: file_matches
    paths: ["*.md"]
    must_match: ["https://github\\.com/example-org/widgets/pull/44\\b"]
    require_present: true

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Links: does every item the note names carry its URL? (2) Accuracy: does
  the note match STATUS.json?
