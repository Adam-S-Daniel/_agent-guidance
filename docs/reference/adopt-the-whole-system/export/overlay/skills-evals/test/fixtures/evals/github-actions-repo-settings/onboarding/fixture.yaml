# Test-only fixture, invented for the adoption kit (DECISIONS X9 and C8).
# The kit ships no eval fixtures; the machinery tests load this one as
# input. It measures nothing and no schedule names it.

skill: github-actions-repo-settings
registry: https://github.com/example-adopter/acsi-agentskills

prompt: >
  Tidy the README of this example service.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  - id: readme-kept
    description: The README still exists
    type: file_matches
    paths: ["README.md"]
    must_match: ['example-service']

judge_rubric: >
  Score 0-10: is the README tidier and still accurate?
