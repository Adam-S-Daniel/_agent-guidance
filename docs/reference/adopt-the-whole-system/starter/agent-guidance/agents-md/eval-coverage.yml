# Section manifest for the fleet guidance — one row per `##` heading in
# agents-md/base.md and one per file under agents-md/sections/ (each of those
# is a single `##`). `### ` subsections are never rows of their own; their
# parent heading's fixture is expected to cover them too.
#
# This file is the join between two things that otherwise have no shared key:
# a heading in base.md, which gets reworded on its own schedule (#116 did it
# the week this file was added), and an eval fixture in skills-evals, which is
# named by path. `id` is that shared key — kebab-case, assigned once, and
# NEVER renamed when the heading text changes. `heading` is the volatile half:
# the exact current heading text (no leading "## "), checked byte-for-byte by
# scripts/check-guidance-coverage.js against the real file on every CI run. A
# heading edit that forgets to update the matching row's `heading` here is
# reported as a stale row, not a missing one, with the nearest current heading
# offered as the likely rename target.
#
# status:
#   gap      — tracked, no fixture yet.
#   covered  — `fixture` (a path under skills-evals, e.g.
#              evals/guidance/<id>/) names the eval that exercises it.
#   skipped  — deliberately not covered; `reason` and `since` are required.
#
# `bytes` is generated — the section's byte extent from its heading through
# the line before the next `##` heading (or end of file). Regenerate with
# `node scripts/check-guidance-coverage.js --write-bytes`; CI runs
# `--check-bytes` so a stale value fails the build. It is the per-session
# context cost the eval harness's ablation arm and the retirement gate weigh,
# and this repo is the one that knows each section's extent.
#
# Do not put these ids into base.md itself — an HTML comment there would be
# delivered into every session by the fleet-memory hook and cost tokens
# forever. This manifest is the only place they live.

