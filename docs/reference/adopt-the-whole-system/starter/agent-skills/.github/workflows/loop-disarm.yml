name: loop-disarm
# Lives in the TARGET repo (agent-skills), the repo the improve, draft and
# removal lanes open their pull requests in. pull_request_target runs this
# file from the default branch, so a pushed branch cannot change it. Any push
# to a loop pull request's head branch turns its auto-merge off; the gate that
# opened the PR (or you) turns it on again after the new head is validated.
# Scaffold pull requests land in skills-evals, whose scaffold-disarm.yml does
# the same for eval-scaffold/.
on:
  pull_request_target:
    types: [synchronize]
permissions:
  pull-requests: write
jobs:
  disarm:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'eval-improve/') ||
      startsWith(github.event.pull_request.head.ref, 'eval-draft/') ||
      startsWith(github.event.pull_request.head.ref, 'retire-skill/')
    runs-on: ubuntu-latest
    steps:
      - name: Turn auto-merge off
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge --disable-auto "$PR" --repo "$REPO"
