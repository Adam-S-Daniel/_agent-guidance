# Test-only fixture, invented for the adoption kit (DECISIONS X9 and C8).
# The kit ships no eval fixtures; the machinery tests load this one as
# input. It measures nothing and no schedule names it.

subject: any
draft: true
strip_agent_context: true
deps:
  - manager: npm
    dir: .
  - manager: bundler
    dir: site

prompt: |
  Example task text for the dependency-directory tests.

objective_checks:
  - id: hidden-tests
    type: repo_tests
    description: The pull request's own test, hidden from the agent
    overlay: checker
    argv: [node, --test]
    fail_to_pass:
      - [test/example.test.js]
