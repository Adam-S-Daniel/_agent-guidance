# Test-only fixture, invented for the adoption kit (DECISIONS X9 and C8).
# The kit ships no eval fixtures; the machinery tests load this one as
# input. It measures nothing and no schedule names it.

skill: writing-adrs
registry: https://github.com/example-adopter/acsi-agentskills

context:
  repository: example-org/example-site
  revision: "a1b2c3d4e5f60718293a4b5c6d7e8f9011223344"
  guidance_revision: "b2c3d4e5f60718293a4b5c6d7e8f901122334455"
  budget:
    guidance_bytes: 40000
    skill_catalog_bytes: 10000
    skill_payload_bytes: 100000

judge:
  weights:
    decision-recorded: 0.5
    title-is-a-decision: 0.3
    restraint: 0.2

prompt: >
  Record the retry-policy decision properly.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  - id: adr-written
    description: A numbered decision record exists under docs/decisions/
    type: file_matches
    paths: ["docs/decisions/0*.md"]
    must_match: ['(?m)^## Decision\b']
  - id: readme-untouched
    description: The README is left alone
    type: files_unchanged
    paths: ["README.md"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Is the decision recorded with its context and consequences? (2) Is the
  title a decision statement? (3) Was nothing else edited?
