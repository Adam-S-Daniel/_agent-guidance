# PLACEHOLDER fixture for the example-skill template. Copy this directory to
# evals/<your-skill>/<scenario>/ and replace each marked part.

# REPLACE: the skill's directory name under plugins/*/skills/.
skill: example-skill
# REPLACE: <owner>/<registry repo> that holds the skill.
registry: <you>/agent-skills
# REPLACE: the task an agent is given, written the way a person would ask,
# without naming the skill. Must not start with "-" or whitespace.
prompt: >
  PLACEHOLDER PROMPT, replace me. The script greet.py prints the wrong
  greeting. Fix it so it prints "Hello, world!" and change nothing else.
arms:
  with_skill: { install: copy }
  without_skill: { install: none }
# REPLACE: the rubric dimensions a judge scores, weights summing to 1.
judge:
  weights: { correctness: 0.7, restraint: 0.3 }
# REPLACE: two or more objective checks. Types: yaml_parses (paths),
# command_succeeds (command, run in the workspace with checks/ copied in),
# file_unchanged (paths, compared with the seed commit).
objective_checks:
  # Behavior check: must fail on seed/ and pass once solution/ is applied.
  - id: greeting-is-correct
    type: command_succeeds
    command: python3 checks/check_greeting.py
  # Guard check: the agent must not touch files outside the task.
  - id: readme-untouched
    type: file_unchanged
    paths: ["README.md"]
