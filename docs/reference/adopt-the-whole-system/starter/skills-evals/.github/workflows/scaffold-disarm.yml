name: scaffold-disarm
# The scaffold gate opens its pull requests in this repo (eval-scaffold/<run
# id>), so the disarm for that lane lives here; agent-skills' loop-disarm.yml
# covers the lanes that target the registry. pull_request_target runs this
# file from the default branch: a push to the PR's branch cannot change it,
# and turns the PR's auto-merge off until the gate passes again.
on:
  pull_request_target:
    types: [synchronize]
permissions:
  pull-requests: write
jobs:
  disarm:
    if: startsWith(github.event.pull_request.head.ref, 'eval-scaffold/')
    runs-on: ubuntu-latest
    steps:
      - name: Turn auto-merge off
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge --disable-auto "$PR" --repo "$REPO"
