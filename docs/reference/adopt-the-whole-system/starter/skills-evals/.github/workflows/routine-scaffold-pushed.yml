name: routine-scaffold-pushed
# Exists only so the gate (routine-scaffold-gate.yml) has an event to follow.
# No permissions, no secrets, and it runs nothing from the branch.
# The paths filter is this lane's own directory (each scaffold branch adds
# eval-scaffold/<run id>/source.json), so no other lane's push can trigger it.
on:
  push:
    branches: ['claude/eval-scaffold-*']
    paths: ['eval-scaffold/**']
permissions: {}
jobs:
  pushed:
    runs-on: ubuntu-latest
    steps:
      - run: echo "scaffold branch pushed"
