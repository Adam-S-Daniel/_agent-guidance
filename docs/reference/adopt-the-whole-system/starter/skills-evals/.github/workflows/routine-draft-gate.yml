name: routine-draft-gate
# Runs the DEFAULT branch's copy of this file (workflow_run). It validates the
# routine's draft branch as data (scripts/draft_gate.py: one new skill whose
# SKILL.md frontmatter names its directory, no shell-command lines, a name no
# plugin has; or a hook proposal alone), builds the registry commit (skill
# directory, plugin_layout.json, version, skill-impact entry) with no write
# credential, and only then writes with a loop-writer token minted for one
# repo: a DRAFT pull request in the registry for a skill, or an issue in the
# guidance repo for a hook proposal (hook-first, guide 10.4).
# Reads: variables REGISTRY_REPO and GUIDANCE_REPO; loop-writer environment
# variable LOOP_WRITER_CLIENT_ID and secret LOOP_WRITER_PEM.
on:
  workflow_run:
    workflows: [routine-draft-pushed]
    types: [completed]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: privacy          # holds PRIVACY_DENYLIST only; default branch only
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the branch's commit as data
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha"; exit 1; }
          [[ "$HEAD_BRANCH" =~ ^claude/eval-draft-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$ ]] || { echo "bad branch"; exit 1; }
          git fetch --no-tags origin "$HEAD_SHA"
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          repository: ${{ vars.REGISTRY_REPO }}   # public; no token needed
          path: registry
          fetch-depth: 0
          persist-credentials: false
      - name: Install the gate's one dependency
        run: python3 -m pip install --user 'pyyaml==6.0.3'
      - name: Validate, then prepare (no write credential here)
        env:
          DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist"
          export PRIVACY_DENYLIST_FILE="$RUNNER_TEMP/denylist"
          base=$(git -C registry rev-parse HEAD)
          git -C registry config user.name "loop-writer[bot]"
          git -C registry config user.email "loop-writer@users.noreply.github.com"
          python3 scripts/draft_gate.py prepare --repo . --sha "$HEAD_SHA" --head-branch "$HEAD_BRANCH" \
            --registry-dir registry --base "origin/$DEFAULT_BRANCH" --out out
          if [ "$(jq -er .kind out/result.json)" = skill ]; then
            branch=$(jq -er .branch out/result.json)
            [[ "$branch" =~ ^eval-draft/[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$ ]]
            git -C registry bundle create ../out/loop.bundle "$base..$branch"
          fi
      - uses: actions/upload-artifact@<sha-of-the-v-tag-you-chose>
        with:
          name: draft-result
          path: out/
          retention-days: 3
  write:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: loop-writer      # App key lives here; default branch only
    concurrency:
      group: loop-open-pr         # every lane that opens a loop PR; not a required check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          persist-credentials: false
      - uses: actions/download-artifact@<sha-of-the-v-tag-you-chose>
        with:
          name: draft-result
          path: out
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          repository: ${{ vars.REGISTRY_REPO }}
          path: registry
          fetch-depth: 0
          persist-credentials: false
      - name: Load the result
        id: pre
        env:
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
          GUIDANCE_REPO: ${{ vars.GUIDANCE_REPO }}
        run: |
          set -euo pipefail
          kind=$(jq -er .kind out/result.json)
          case $kind in
            skill)
              branch=$(jq -er .branch out/result.json)
              [[ "$branch" =~ ^eval-draft/[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$ ]]
              git -C registry fetch ../out/loop.bundle "refs/heads/$branch:refs/heads/$branch"
              echo "branch=$branch" >> "$GITHUB_OUTPUT"
              target=$REGISTRY_REPO ;;
            hook) target=$GUIDANCE_REPO ;;
            *) echo "unknown kind"; exit 1 ;;
          esac
          [[ "$target" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::REGISTRY_REPO or GUIDANCE_REPO is not set"; exit 1; }
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "target_name=${target#*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@<sha-of-the-v-tag-you-chose>
        id: app
        with:
          client-id: ${{ vars.LOOP_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.LOOP_WRITER_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pre.outputs.target_name }}
      - name: Open the draft pull request, or file the hook proposal
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KIND: ${{ steps.pre.outputs.kind }}
          TARGET: ${{ steps.pre.outputs.target }}
          BRANCH: ${{ steps.pre.outputs.branch }}
        run: |
          set -euo pipefail
          title=$(jq -er .title out/result.json)
          if [ "$KIND" = skill ]; then
            bash scripts/open_loop_pr.sh --repo "$TARGET" --dir registry --branch "$BRANCH" \
              --title "$title" --body-file out/pr-body.md --draft true
          else
            gh label create agent-authored --repo "$TARGET" --force >/dev/null
            gh issue create --repo "$TARGET" --title "$title" --label agent-authored --body-file out/issue.md
          fi
