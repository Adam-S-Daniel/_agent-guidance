name: compute-gates
# Daily retirement verdicts (guide 10.3). compute_gates.py reads
# persistent/eval-results and the gate roster (scripts/loop_state.py cells),
# and the result is written back to that branch as gates/status.json with the
# loop-writer token. On a retire verdict, retire_skill.py builds the removal
# commit in a registry checkout with no credential; then a loop-writer token
# minted for the registry alone opens the removal pull request there
# (scripts/open_loop_pr.sh). Without the loop-writer App credentials it files
# an issue in this repo instead, with this run's own token.
#
# A removal is a draft when the plugin runs code or improve_merge_mode is not
# auto (evals/improve-policy.yml); otherwise it auto-merges once checks pass.
# Reads: variable REGISTRY_REPO; loop-writer environment variable
# LOOP_WRITER_CLIENT_ID and secret LOOP_WRITER_PEM.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compute-gates
  cancel-in-progress: false
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: loop-writer        # App key lives here; default branch only
    outputs:
      retire: ${{ steps.verdict.outputs.retire }}
    steps:
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          persist-credentials: false
      - uses: actions/setup-python@<sha-of-the-v-tag-you-chose>
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python3 -m pip install --quiet -r requirements.txt
      # The results branch may not exist before the first ingest.
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        continue-on-error: true
        with:
          ref: persistent/eval-results
          path: results
          persist-credentials: false
      - name: Compute the verdicts
        id: verdict
        env:
          HAS_APP: ${{ vars.LOOP_WRITER_CLIENT_ID != '' && secrets.LOOP_WRITER_PEM != '' }}
        run: |
          set -euo pipefail
          mkdir -p results out
          python3 scripts/loop_state.py cells > out/roster.json
          python3 scripts/compute_gates.py --results results --roster out/roster.json > out/status.json
          skill=$(python3 scripts/loop_state.py retire-candidate --status out/status.json)
          echo "retire=$skill" >> "$GITHUB_OUTPUT"
          echo "app=$HAS_APP" >> "$GITHUB_OUTPUT"
          echo "retire candidate: ${skill:-none}"
          [ "$HAS_APP" = true ] || echo "::warning::no loop-writer App credentials: gates/status.json is not written back"
      - uses: actions/upload-artifact@<sha-of-the-v-tag-you-chose>
        with:
          name: gate-status
          path: out/
          retention-days: 7
      - uses: actions/create-github-app-token@<sha-of-the-v-tag-you-chose>
        id: app
        if: steps.verdict.outputs.app == 'true'
        with:
          client-id: ${{ vars.LOOP_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.LOOP_WRITER_PEM }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Write gates/status.json to persistent/eval-results
        if: steps.verdict.outputs.app == 'true'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          g() { git -c http.extraheader="AUTHORIZATION: basic $auth" "$@"; }
          if g ls-remote --exit-code --heads "$url" persistent/eval-results >/dev/null 2>&1; then
            g clone --quiet --depth 1 --branch persistent/eval-results "$url" write
          else
            git init --quiet write
            git -C write checkout --quiet -b persistent/eval-results
          fi
          mkdir -p write/gates
          cp out/status.json write/gates/status.json
          git -C write add gates/status.json
          if git -C write diff --cached --quiet; then echo "gates/status.json unchanged"; exit 0; fi
          git -C write -c user.name="loop-writer[bot]" -c user.email="loop-writer@users.noreply.github.com" \
            commit --quiet -m "Update gate verdicts"
          sha=$(git -C write rev-parse HEAD)
          g -C write push --quiet "$url" HEAD:refs/heads/persistent/eval-results
          g -C write fetch --quiet "$url" persistent/eval-results
          git -C write merge-base --is-ancestor "$sha" FETCH_HEAD
          echo "wrote gates/status.json"
  retire:
    needs: gates
    if: needs.gates.outputs.retire != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: loop-writer
    concurrency:
      group: loop-open-pr           # every lane that opens a loop PR; not a required check
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write                 # the fallback issue, in this repo only
    steps:
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          persist-credentials: false
      - uses: actions/setup-python@<sha-of-the-v-tag-you-chose>
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python3 -m pip install --quiet -r requirements.txt
      - uses: actions/download-artifact@<sha-of-the-v-tag-you-chose>
        with:
          name: gate-status
          path: out
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          repository: ${{ vars.REGISTRY_REPO }}   # public; no token needed
          path: registry
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the removal commit (no write credential here)
        id: pre
        env:
          SKILL: ${{ needs.gates.outputs.retire }}
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
          HAS_APP: ${{ vars.LOOP_WRITER_CLIENT_ID != '' && secrets.LOOP_WRITER_PEM != '' }}
        run: |
          set -euo pipefail
          [[ "$SKILL" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || { echo "bad skill name"; exit 1; }
          [[ "$REGISTRY_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::REGISTRY_REPO is not set"; exit 1; }
          git -C registry config user.name "loop-writer[bot]"
          git -C registry config user.email "loop-writer@users.noreply.github.com"
          python3 scripts/retire_skill.py --registry registry --skill "$SKILL" --verdict out/status.json > out/retire.json
          draft=$(jq -er .draft out/retire.json)
          [ "$(python3 scripts/loop_state.py merge-mode)" = auto ] || draft=true
          jq -r '"Remove `\(.skill)` from `\(.plugin)`: every eval cell is no-benefit (gates/status.json on persistent/eval-results).\n\nPlugin version \(.version.from) -> \(.version.to).\n\n\(.impact_entry)\n\nOpened by compute-gates.yml."' \
            out/retire.json > out/pr-body.md
          {
            echo "branch=$(jq -er .branch out/retire.json)"
            echo "draft=$draft"
            echo "repo_name=${REGISTRY_REPO#*/}"
            echo "app=$HAS_APP"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@<sha-of-the-v-tag-you-chose>
        id: app
        if: steps.pre.outputs.app == 'true'
        with:
          client-id: ${{ vars.LOOP_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.LOOP_WRITER_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.pre.outputs.repo_name }}
      - name: Open the removal pull request in the registry
        if: steps.pre.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
          BRANCH: ${{ steps.pre.outputs.branch }}
          DRAFT: ${{ steps.pre.outputs.draft }}
          SKILL: ${{ needs.gates.outputs.retire }}
        run: |
          bash scripts/open_loop_pr.sh --repo "$REGISTRY_REPO" --dir registry --branch "$BRANCH" \
            --title "Remove $SKILL: no benefit in evals" --body-file out/pr-body.md --draft "$DRAFT"
      - name: File a retirement issue instead (no loop-writer App)
        if: steps.pre.outputs.app != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL: ${{ needs.gates.outputs.retire }}
        run: |
          set -euo pipefail
          title="Retire $SKILL: no benefit in evals"
          have=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $SKILL" \
            --json title | jq --arg t "$title" '[.[] | select(.title == $t)] | length')
          if [ "$have" != 0 ]; then echo "the retirement issue is already open"; exit 0; fi
          gh label create agent-authored --repo "$GITHUB_REPOSITORY" --force >/dev/null
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label agent-authored \
            --body-file out/pr-body.md
