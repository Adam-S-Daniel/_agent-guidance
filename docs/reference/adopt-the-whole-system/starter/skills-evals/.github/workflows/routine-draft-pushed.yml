name: routine-draft-pushed
# Exists only so the gate (routine-draft-gate.yml) has an event to follow.
# No permissions, no secrets, and it runs nothing from the branch.
# The paths filter is this lane's own directory, so no other lane's push can
# trigger it.
on:
  push:
    branches: ['claude/eval-draft-*']
    paths: ['eval-draft/**']
permissions: {}
jobs:
  pushed:
    runs-on: ubuntu-latest
    steps:
      - run: echo "draft branch pushed"
