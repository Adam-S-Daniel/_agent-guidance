name: routine-scaffold-gate
# Runs the DEFAULT branch's copy of this file (workflow_run). It validates the
# routine's scaffold branch as data (scripts/scaffold_gate.py: only one new
# evals/<skill>/<fixture>/ directory that harness/fixture.py loads, plus
# eval-scaffold/<run id>/source.json), builds the commit with no write
# credential, and only then opens the pull request here with a loop-writer
# token minted for this repo alone. A draft unless improve_merge_mode is auto;
# scaffold-disarm.yml turns auto-merge off on any later push to the branch.
on:
  workflow_run:
    workflows: [routine-scaffold-pushed]
    types: [completed]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: privacy          # holds PRIVACY_DENYLIST only; default branch only
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the branch's commit as data
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha"; exit 1; }
          [[ "$HEAD_BRANCH" =~ ^claude/eval-scaffold-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$ ]] || { echo "bad branch"; exit 1; }
          git fetch --no-tags origin "$HEAD_SHA"
      - uses: actions/setup-python@<sha-of-the-v-tag-you-chose>
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Validate, then prepare the commit (no write credential here)
        env:
          DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist"
          export PRIVACY_DENYLIST_FILE="$RUNNER_TEMP/denylist"
          # The gate's own code is copied out first: prepare switches the
          # checkout to the new branch, and nothing from the routine's commit runs.
          cp -r scripts harness evals/improve-policy.yml "$RUNNER_TEMP/"
          base=$(git rev-parse "origin/$DEFAULT_BRANCH")
          python3 "$RUNNER_TEMP/scripts/scaffold_gate.py" prepare --repo . --sha "$HEAD_SHA" \
            --head-branch "$HEAD_BRANCH" --base "$base" --policy "$RUNNER_TEMP/improve-policy.yml" \
            --out "$RUNNER_TEMP/out"
          branch=$(jq -er .branch "$RUNNER_TEMP/out/result.json")
          [[ "$branch" =~ ^eval-scaffold/[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$ ]]
          git bundle create "$RUNNER_TEMP/out/loop.bundle" "$base..$branch"
          mkdir -p out && cp "$RUNNER_TEMP"/out/* out/
      - uses: actions/upload-artifact@<sha-of-the-v-tag-you-chose>
        with:
          name: scaffold-commit
          path: out/
          retention-days: 3
  open-pr:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: loop-writer      # App key lives here; default branch only
    concurrency:
      group: loop-open-pr         # every lane that opens a loop PR; not a required check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@<sha-of-the-v-tag-you-chose>
        with:
          name: scaffold-commit
          path: out
      - name: Load the prepared commit
        id: pre
        run: |
          set -euo pipefail
          branch=$(jq -er .branch out/result.json)
          [[ "$branch" =~ ^eval-scaffold/[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$ ]]
          git fetch out/loop.bundle "refs/heads/$branch:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -er .draft out/result.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@<sha-of-the-v-tag-you-chose>
        id: app
        with:
          client-id: ${{ vars.LOOP_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.LOOP_WRITER_PEM }}
          repositories: ${{ github.event.repository.name }}
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.pre.outputs.branch }}
          DRAFT: ${{ steps.pre.outputs.draft }}
        run: |
          bash scripts/open_loop_pr.sh --repo "$GITHUB_REPOSITORY" --dir . --branch "$BRANCH" \
            --title "$(jq -er .title out/result.json)" --body-file out/pr-body.md --draft "$DRAFT"
