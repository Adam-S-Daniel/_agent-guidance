# Real (non-hermetic) eval: runs reviewed scheduled fixtures or one dispatch against
# the live Claude Code CLI + Anthropic API, regenerates the quality badge, and
# pushes the badge + run summaries to the `persistent/eval-results` branch. The hermetic
# suite stays in ci.yml — this workflow is the ONLY place real credentials
# appear. The objective checks are hermetic everywhere, here included.
#
# SECURITY POSTURE — read this before changing anything:
#
# * Triggers are `workflow_dispatch` ONLY. NEVER add pull_request
#   or pull_request_target: this workflow holds an API key, and the harness
#   runs the agent under test with `--permission-mode bypassPermissions` (the
#   explicit `--permission-mode` on the run_eval.py step below; the harness
#   default is `auto` since #71) inside a throwaway temp workspace. Key +
#   bypassPermissions must never meet untrusted fixture content. The fixtures
#   here are trusted because only maintainers can push to this repo; the only
#   prompts ever run are this repo's committed fixtures. Never accept external
#   fixture contributions into this path without dropping the key first.
#   The trust boundary equally includes the three registries checked out
#   below (agentskills, example-site-platform, example-site-a): the with_skill arm
#   installs skill content from whichever registry the fixture names, from
#   that registry's default branch, and executes it under bypassPermissions
#   with the key in env — write access to any of the three checked-out
#   registries is equivalent to key access here. All four repos (this one
#   included) are maintainer-only; keep it that way or drop the key.
#   example-site-platform and example-site-a also land commits on their default
#   branches through automated lanes — Decap CMS editorial publish loops,
#   auto-merge nudges, dependabot auto-merge — not only direct maintainer
#   pushes. A commit landed by one of those lanes is inside this trust
#   boundary just the same as a maintainer's own push: treat it as trusted,
#   or drop the key.
#
# * _agent-guidance is now inside that same boundary, and this is new with
#   the guidance subject (#97). A guidance fixture's `with` arm delivers a
#   payload assembled from that repo's agents-md/base.md into the agent's
#   user memory and then runs the agent under bypassPermissions with the key
#   in env — so the guidance content is EXECUTED here, exactly as skill
#   content from a registry is. Write access to _agent-guidance's default
#   branch is therefore equivalent to key access here. It is checked out with
#   persist-credentials: false like every other checkout, and it is NOT a
#   skill registry: it gets --guidance, never --registry.
#
# * Schedule selection comes only from committed evals/scheduled.yml, a reviewed
#   list with readiness evidence (ADR 0008). A contents: read planning job
#   emits the matrix; dispatch still takes one `fixture` input (default
#   evals/workflow-path-audit/required-check-routing), read from $GITHUB_EVENT_PATH as data, never
#   interpolated into run:. Every eval leg revalidates its own selection
#   against Git's committed evals/**/fixture.yaml set before its own exchange.
#   An untracked directory, traversal, malformed value or NUL cannot qualify.
#   fail-fast: false isolates failures; at most two eval legs run together.
#   Success artifacts have unique numeric slots and run_attempt names; failed
#   legs upload diagnostics separately. Publishers independently validate the
#   fixture/key in fresh checkouts and download only the matching success
#   artifact. They serialize writes, even when a sibling eval fails. The
#   roster/disarm/proposal/wait jobs still run once per workflow run.
#
# * Auth: GitHub OIDC → Anthropic Workload Identity Federation. No stored
#   Anthropic secret exists (the one stored secret in this workflow is the
#   roster App's key, confined to the `roster-pr` job). The Claude Code CLI does not resolve the
#   ANTHROPIC_FEDERATION_* env vars (it hangs credential-less — verified
#   2026-07-17), so this workflow performs the RFC 7523 jwt-bearer exchange
#   explicitly rather than delegating it to the CLI. The "Mint OIDC token
#   and exchange for Anthropic access token" step exchanges the runner's
#   ACTIONS_ID_TOKEN_REQUEST_TOKEN for a GitHub-issued OIDC token (sub
#   pinned to repo:example-adopter/skills-evals:ref:refs/heads/main, audience
#   https://api.anthropic.com, single-use JTI), then POSTs that assertion
#   to https://api.anthropic.com/v1/oauth/token against the federation
#   rule, organization and service account in the repository variables
#   ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID and
#   ANTHROPIC_SERVICE_ACCOUNT_ID, with the exchange body pinned to the
#   workspace in ANTHROPIC_WORKSPACE_ID (a spend-capped workspace)
#   explicitly, so a rule-binding change can never
#   silently rescope the token and binding failures surface as named errors
#   instead of opaque 401s. The resulting sk-ant-oat01 access
#   token (≤1h, workspace-scoped, spend-capped) is masked via
#   ::add-mask::, stored only in $RUNNER_TEMP/anthropic-bearer, and
#   exported step-locally as ANTHROPIC_AUTH_TOKEN in each step that calls
#   claude — never top-level env. Each leg has its own exchange, satisfying the
#   issuer's single-use JTI enforcement (one exchange, all four claude
#   calls share the token). Dispatches from non-main refs get no
#   credential — the rule's sub claim matches ref:refs/heads/main only —
#   which also supersedes the old maintainer-branch trust widening
#   caveat. Cost depends on the fixture: a skill A/B is 2 agent arms +
#   2 judge calls; a guidance dispatch is one agent call AND one tool-free
#   guard probe per declared arm, which is 5 + 5 for the delivery canary. The
#   report's cost column counts the SCORED leg only — the guard probes are
#   real calls and are not in it. The fixture
#   may pin its models or use the committed roster. The existing estimate is
#   ~$0.30–0.90 per skill fixture: the four-entry schedule is approximately
#   $1.20–3.60/run, or $6–18 for five weekly runs. These are estimates rather
#   than a cap; actual model choice and judging affect cost. Per-fixture spend is
#   bounded by the harness timeouts
#   (600s per arm, 120s per judge call); the workspace spend limit, not
#   this workflow, is the hard ceiling.
#
# * The model roster step (#67) adds ONE more caller of that same bearer: a
#   `GET /v1/models` read from scripts/refresh_models.py, exported
#   step-locally exactly like the claude calls and never at top level. It
#   introduces NO new credential shape — no stored secret, no new federation
#   binding — and it is a read of the model catalogue, not of usage or
#   billing. The one thing it would use if it existed is ANTHROPIC_ADMIN_KEY,
#   for the optional org-wide usage report; that variable is deliberately NOT
#   provisioned, and its absence prints a `::notice::` naming it rather than
#   failing the run. Do not create it to silence the notice — provision it
#   only if the org-wide report is actually wanted. Because the WIF rule's sub
#   claim matches `ref:refs/heads/main` only, a dispatch from any other ref
#   gets no bearer and dies at the exchange step above, before this one. That
#   read is also the FIRST use of this bearer in the job, ahead of the
#   preflight — which is a reason for it to be non-fatal, not a reason to put
#   it later: it is a free extra signal about the credential, and the
#   preflight remains the step that decides whether the bearer works.
#
#   The Admin API usage report, if it is ever provisioned, is BILLING data.
#   It is written to $RUNNER_TEMP/admin-usage.json, deliberately NOT into
#   $RUNNER_TEMP/roster/ — that directory is the one the published roster is
#   taken from, and it holds the published roster and nothing else so that a
#   future directory copy cannot publish billing data to a public branch.
#
#   The roster step's ::warning:: carries an HTTP status code or an exception
#   class name, and refresh_models.py is written to produce nothing else. The
#   token-exchange failure output below is a separate pre-existing path.
#
# * All five checkouts (distinct repositories) use `persist-credentials: false`;
#   the plan and publisher repeat this repo on fresh runners. Write auth is
#   injected only in the steps that write — the `roster` job's
#   roster-proposal step (its tracking issue only; since round 7 it pushes
#   nothing), the `disarm`, `roster-pr` and `roster-wait` jobs' `gh` calls,
#   and the `publish` job's commit step — and only in their own `env:`. The one
#   stored credential in this workflow, the roster App's private key
#   (secrets.ROSTER_APP_PRIVATE_KEY), is read by exactly one step, in the
#   `roster-pr` job, which runs no agent and no CLI; see that job. B1 (round
#   4 on #209, blocker): the `eval` job itself holds no GitHub write credential of
#   any kind, at any point, on any runner — not even step-scoped and not
#   even after the bypassPermissions agent finishes, because a later step OF
#   THE SAME JOB is not a credential boundary against whatever that agent
#   planted; no long-lived secret exists on any of them either. Every job
#   that writes anything (`roster`, `disarm`, `roster-pr`, `roster-wait`,
#   `publish`) gets its own fresh `${{ github.token }}`, scoped to that
#   job's own `permissions:` block and never shared with `eval`'s. Matrix
#   legs use separate runners; no agent shares a runner with a writer. What IS in reach differs by
#   subject, because the two arms are built differently:
#
#     - a SKILL arm's agent gets an ALLOWLIST too, since #81 (harness/
#       run_eval.py's `_ALLOWED_ENV` + `_ALLOWED_ENV_PREFIXES`): PATH, HOME,
#       USER, LOGNAME, SHELL, TERM, LANG, LANGUAGE, TZ, TMPDIR, TMP, TEMP,
#       the proxy names HTTP_PROXY, HTTPS_PROXY, NO_PROXY, ALL_PROXY and
#       their lower-case twins http_proxy, https_proxy, no_proxy, all_proxy,
#       the CA-bundle names SSL_CERT_FILE, SSL_CERT_DIR, NODE_EXTRA_CA_CERTS,
#       REQUESTS_CA_BUNDLE, CURL_CA_BUNDLE, and every variable whose name
#       begins ANTHROPIC_, CLAUDE_, LC_ or XDG_ — plus the harness's own
#       WORKSPACE and GH_CONFIG_DIR, the deliberately EMPTIED GH_TOKEN and
#       GITHUB_TOKEN, and last the fixture's own `env:` block. It used to be
#       `dict(os.environ)`, which also handed the agent
#       ACTIONS_ID_TOKEN_REQUEST_TOKEN and ACTIONS_ID_TOKEN_REQUEST_URL —
#       which mint a GitHub OIDC assertion for any audience while
#       `id-token: write` is granted — and ACTIONS_RUNTIME_TOKEN, which
#       writes this run's artifacts and cache. None of those three is in
#       reach for either arm now.
#     - a GUIDANCE arm's agent gets an ALLOWLIST built from nothing
#       (harness/guidance.py's `agent_env`): PATH, LANG, LC_ALL, SHELL, USER,
#       NODE_PATH, plus the HOME, TMPDIR, CLAUDE_CONFIG_DIR and WORKSPACE the
#       harness sets, every ANTHROPIC_* variable and, only inside a hosted
#       Claude Code session, its CLAUDE_CODE_REMOTE mode flag (no credential;
#       never set on this runner), and on top of all of
#       that the fixture's own `env:` block, which may add any name except
#       those three isolation variables (HOME, TMPDIR, CLAUDE_CONFIG_DIR are
#       refused by name, because the block is applied after they are set, so
#       a fixture allowed to name one could point an arm at the real config
#       dir). The three GitHub runner tokens above are NOT in that set
#       either.
#
#   The two allowlists are deliberately DIFFERENT and neither derives from
#   the other: the guidance one is the narrower, because a guidance arm is
#   handed HOME, TMPDIR and CLAUDE_CONFIG_DIR by the harness and must not
#   inherit the operator's. What they share is the predicate that refuses a
#   name or value the OS itself will not take (`guidance.check_env_block`),
#   which bounds what a fixture may SPELL rather than what is inherited.
#
# * The weekly badge commit doubles as cron keep-alive: GitHub disables
#   scheduled workflows after ~60 days without repo activity, and each run
#   commits fresh results, so the schedule keeps itself alive.
#
# * Results + badge live on the `persistent/eval-results` branch, not main: main's
#   branch-protection ruleset requires changes go through a pull request
#   (this repo's fleet repo-settings baseline), so a bot direct-pushing
#   straight to main would be rejected — as it was in run 29620223686. The
#   `publish` job's commit step fetches/builds on `persistent/eval-results` (creating it on the first
#   run) and pushes there directly; nobody hand-commits to that branch and
#   the `real-eval` concurrency lane serializes runs, so a rejected push
#   fails the job loudly rather than retrying. The README badge URL consumes
#   raw content from `persistent/eval-results` accordingly.
#
# * All actions are named by an exact release tag and locked to a full commit
#   SHA in .github/workflows/actions.lock (ADR 0024 in _agent-guidance); the
#   runner runs the locked commit, and ci.yml's "Verify action lockfile" step
#   fails on a missing, stale or moved pin. No trailing version/date comment:
#   one went stale silently and then lied, so the tag and its lockfile entry
#   are the only claims made. An actions.lock diff is reviewed like a SHA pin.

name: Real eval

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: >-
          Fixture directory to run, e.g. evals/workflow-path-audit/required-check-routing or
          evals/guidance/_delivery. Validated against the committed
          evals/**/fixture.yaml set before any credential is minted.
        required: false
        default: evals/workflow-path-audit/required-check-routing
      roster_only:
        description: >-
          Refresh the model roster and file its proposal, then stop: skip the
          WIF preflight, the eval and the badge, so nothing is spent on a
          model beyond the Models API read. A roster_only run publishes
          nothing to `persistent/eval-results`; its only outputs are the
          `roster/proposal` branch and the tracking issue.
        type: boolean
        required: false
        default: false

# SEVEN jobs, each least-privileged at JOB level (B1, adversarial round 4 on
# #209, blocker; B1 round 3; F2, round 1; ADR 0004 added `roster-wait`). Workflow-level permissions is `{}`
# deliberately: the `eval` job runs the bypass-permissions agent, and
# giving it write scopes for the whole job would hand those scopes to that
# agent too, not just to a later step that happens to need them. Each job
# below declares its own set instead.
#
# `roster` (contents: read, id-token: write, issues: write): computes,
# renders and admits the roster proposal — EVERYTHING that decides a roster
# change — in a job that NEVER runs the agent and NEVER checks out the four
# fixture/registry repositories. Round 7 (ADR 0003, "the App publishes the
# proposal branch"): it no longer pushes; it hands the rendered file (the
# exact bytes, base64) and the sha it rendered against to `roster-pr` as
# job outputs, and `roster-pr` publishes `roster/proposal` with the roster
# App's token, so a ruleset can confine that ref to the App. `contents:
# write` went with the push — which also takes the one write scope off the
# runner the npm-latest CLI installs on (ADR 0003, N3). `contents: read` is
# its checkout; `id-token: write` is its own WIF mint for the Models API
# bearer; `issues: write` is #147's roster-proposal tracking issue (this job
# still owns the "same"/frozen-same cases directly — see its own steps'
# comments). This job MUST NOT
# `needs: eval` — the whole point is that it runs on a runner the agent
# never touches, before, after or alongside that job, never depending on
# its outcome or its workspace.
#
# `disarm` (pull-requests: write, contents: read): B1 (round 4 on #209,
# blocker). `needs: roster` only — it runs BEFORE the `eval` job's agent
# ever starts, never after. It finds whatever pull request is currently open
# from `roster/proposal` (the SAME validated, owner-filtered lookup
# `roster-pr` uses below) and unconditionally disables its auto-merge. A
# failed lookup or a failed `gh pr merge --disable-auto` is a fixed
# `::warning::`, exit 0 — this job must never fail the run, and its own
# outcome must never block `eval` (see `eval`'s `if:` below). It performs no
# checkout at all: every value it needs (the repository name, the write
# token) arrives through `env:`. `if: github.ref == 'refs/heads/main'`,
# matching `roster-pr`'s own main-only gate, since only a run on `main` has
# a `$GITHUB_SHA` worth trusting as the committed policy and this job exists
# only to protect that run's auto-merge surface. This is what closes ADR
# 0003's "cancellation window": an EARLIER run's still-armed auto-merge is
# turned off before this run's agent so much as starts, rather than only
# after `eval` finishes — the window that is left is this job's own run,
# not the whole `eval` job's duration (round 7: no job pushes
# `roster/proposal` before this one any more; `roster-pr` publishes it
# after). `roster-pr` still re-arms auto-merge afterward, but only once
# ITS OWN independent verification (B1.1-B1.3 below) passes for the commit
# it just published. ADR 0004: `roster-pr` now `needs:` this job, so
# `disarm` can never turn off the arming `roster-pr` does in the same run;
# `roster-wait`'s own `always()` disarm step is what clears THIS run's
# arming, when it did not merge, before the agent starts.
#
# `eval` (contents: read, id-token: write): runs the fixture (including the
# bypass-permissions agent) and uploads its results as a build artifact.
# ADR 0004: its first step after the checkout takes `evals/roster.yml` —
# that one file, never the rest of a newer `main` — from the merge
# `roster-wait` verified, after re-verifying it locally; with no verified
# merge it runs on the committed roster and says why in the step summary.
# B1 (round 4 on #209, blocker): this job no longer holds `contents: write`
# and no longer commits or pushes anything — the agent it runs can plant
# code (a git hook, an edited repo script, a background daemon, a `/proc`
# read) that a LATER STEP OF THE SAME JOB would then execute with whatever
# credential that step holds, so no write credential of any kind may exist
# on this job's runner at all, ever. `needs: [roster, disarm, roster-pr,
# roster-wait, plan]` — NOT the other way: `disarm` and `roster-wait` must finish
# before this job's agent starts. `if:` is `!cancelled()`, not
# `roster_only`, AND (S1, fail closed) `roster-wait` either skipped (off
# `main`) or reporting `cleared == 'true'` — so no armed auto-merge, an
# earlier run's or this run's, is left standing for the length of this job.
# Neither the roster step's own failures nor a failed/warned `disarm` is
# fatal to the eval (a stale/unreachable census, or a `disarm` that could
# not reach the API, are not this job's problem: `roster-wait`'s sweep is
# the confirmation that counts), and a `roster_only` dispatch skips this
# job entirely.
# `id-token: write` is this job's OWN, separate WIF mint (never shared with
# `roster`'s bearer — different runners, different jobs, no credential in
# common) for the preflight and the eval run. Nothing in this job ever
# calls `gh pr`, `gh issue`, `gh workflow run`, or touches `persistent/eval-results`.
#
# Ordering (ADR 0004, 2026-09-30; it replaces round 5's "roster-pr runs
# last"): roster -> disarm -> roster-pr -> roster-wait -> eval -> publish.
# The scheduled eval runs on the roster its own run just merged: `roster-pr`
# publishes and arms the proposal BEFORE the eval, `roster-wait` waits
# (bounded) for the merge and verifies it, and `eval` overlays the one
# merged file. Auto-merge is armed with `--match-head-commit`, which GitHub
# checks only at enable time, so a write-credential job still running after
# the arming could move `roster/proposal` under an armed PR unnoticed. So:
# `roster` and `disarm` have finished before `roster-pr` arms (it needs
# both); `roster-wait` holds only `pull-requests: write` and runs no code
# that could move a branch; and `eval` and `publish` (`contents: write`)
# are gated on `roster-wait`'s `cleared` output (S1, fail closed): they run
# only when its `always()` sweep step CONFIRMED, by re-reading the pull
# request after turning its auto-merge off, that no roster pull request is
# left armed (or when `roster-wait` was skipped, off `main`). A sweep that
# cannot confirm it fails `roster-wait` (exit 1: a red run, with a warning
# and a summary line), and it, or a `roster-wait` that never got that far,
# means no eval and no publish this run. Within an eval run, then, no job
# holding a write credential runs while the PR is armed, and the eval and
# `publish` do not run unless the arming is confirmed cleared. A
# `roster_only` dispatch has no wait and no eval: its arming stands, as
# before, with nothing after it.
# What this workflow cannot control: between arming and the merge any
# other write-access actor that pushes `roster/proposal` retargets the
# armed PR — see ADR 0003.
# Round 7 moved the only push this workflow makes to that branch onto the
# roster App's token (`roster-pr`), so a ruleset that lets only the App
# (and repository admins) create, update or delete `roster/proposal`
# closes that gap once it is live; until then it stands.
#
# `plan` (contents: read) admits the event/list into a fixture/key/slot matrix.
# `publish` (contents: write) uses that same matrix on fresh runners with no
# agent. It requires the confirmed-clear gate, no cancellation, and an eval
# matrix that finished (success OR failure). Each leg reads only its unique
# success payload. Missing payload skips that leg after an eval failure; a
# missing payload after aggregate success is an infrastructure error. Matrix
# max-parallel: 1 and the run concurrency lane serialize results-branch writes.
# The badge script comes from the fresh committed checkout, never the artifact;
# it builds this fixture's badge only after loading accumulated results history.
# The roster exhibit remains needs.roster.outputs.roster_latest_json, an exhibit
# read by no roster decision (ADR 0001 decision 3).
#
# `roster-pr` (pull-requests: write, issues: write, contents: read, plus
# the roster App's installation token): publishes the proposal the `roster`
# job rendered to `roster/proposal` (round 7: with the App's token only,
# through the git-data REST API, as one commit on live `main`, in every
# `roster_mode`), and everything that touches its pull request —
# find/create/edit/close/reopen/merge it (the owner's decisions of 2026-09-28 and 2026-09-29,
# docs/decisions/0003-roster-merges-automatically.md). Round 6: under
# `roster_mode: auto`, a verified proposal's PR is opened (or, if one is
# already open, closed and reopened) and armed by a dedicated GitHub App
# (vars.ROSTER_APP_CLIENT_ID / secrets.ROSTER_APP_PRIVATE_KEY, installed on
# skills-evals only, Contents + Pull requests R/W, not a ruleset bypass
# actor), so the PR's own `pull_request` run of `test` — the required
# check — is the App's and needs no approval. GITHUB_TOKEN no longer
# dispatches `ci.yml` (a dispatched run never satisfied the PR's required
# check: run 36509251840 / PR #214) and no longer arms anything; it keeps
# the disable/close/issue paths every mode reaches. No App token under
# `auto` means no PR is opened or armed at all — the tracking issue says
# the proposal is on `roster/proposal` for a human. `needs: [roster,
# disarm]` (ADR 0004; it used to be `[roster, eval, publish]`): it runs
# BEFORE the eval so the eval can run on the roster it merges, and hands
# `roster-wait` what it armed (`armed`, `pr_number`, `pushed_sha`). It
# independently re-verifies what it published (B1.1-B1.3 below), and it no
# longer reads `needs.eval.result`: its tracking-issue sentence about the
# eval says what WILL happen and points at the run summary. It re-arms
# auto-merge that `disarm` above unconditionally turned off, but only for
# a proposal this job's own checks (below) admit. It also carries `issues: write`: the tracking
# issue's final wording depends on what this job did to the PR (opened it,
# could not enable auto-merge, turned auto-merge off, …), so this job
# edits/creates the SAME issue the `roster` job's propose step found or
# left neutral, rather than splitting one issue's text across two writers
# with no shared view of the outcome. `contents: write` (S2, round 2,
# spec-roster-mode-r2.md) for `enablePullRequestAutoMerge`/an immediate
# merge now lives on the App token, not GITHUB_TOKEN; this job performs no
# checkout and runs no repository code — it only calls `gh`. This job runs
# on EVERY run on `main`, `roster_mode: proposal` included (F3) and
# `roster_only` included: a stale `roster/proposal` PR's auto-merge must
# come off even when this run's proposal never reached the auto path, or
# when the `eval` job does not run at all this dispatch.
#
# `roster-wait` (pull-requests: write, contents: read): ADR 0004. After
# `roster-pr`, before `eval`, main-only, skipped on `roster_only`. When
# `roster-pr` armed this run's PR it polls it, read-only and bounded (30
# minutes by default), verifies a merge (the merged head is the armed
# commit; the PR touches exactly `evals/roster.yml`; that file at the merge
# commit is this run's proposal byte for byte; the merge commit is on
# `main`) and hands `eval` the merge commit. On a timeout it asks for
# auto-merge off and reads the PR once more, using a merge that landed in
# between if it verifies. Its second step runs `always()`, turns auto-merge
# off on any still-open roster PR (and on the PR `roster-pr` armed) and
# re-reads it; only a confirmed-clear answer sets `cleared=true`, which
# `eval` and `publish` require — anything else fails the job. No checkout,
# no App token, no CLI, no agent.
permissions: {}

# Never let two runs (e.g. a manual dispatch during the weekly run) race the
# badge commit; queue instead of cancelling so results are never half-written.
concurrency:
  group: real-eval
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@v7.0.1
        with:
          path: skills-evals
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install planning dependency
        run: pip install pyyaml==6.0.3
      - name: Plan reviewed fixtures
        id: plan
        working-directory: skills-evals
        run: python3 scripts/plan_scheduled_evals.py

  roster:
    runs-on: ubuntu-latest
    # B1 (round 3 on #209): computes, renders, admits and pushes the
    # roster proposal. NEVER runs the agent, NEVER checks out the fixture
    # registries, and NEVER `needs: eval` — see the header comment above.
    permissions:
      contents: read
      id-token: write
      issues: write
    timeout-minutes: 20
    # Consumed by the `roster-pr` job (`needs: [roster, disarm]`) — see that
    # job's own comment for what each carries and how it is validated
    # before use. Every one of these is written by the "Propose a roster
    # change" step (id: propose); a value it never reaches stays the empty
    # string, which `roster-pr` treats as "no action for this run" rather
    # than an error. `roster_latest_json` is consumed by the `publish` job's
    # commit step instead (an EXHIBIT copy only, ADR 0001 decision 3).
    outputs:
      roster_mode: ${{ steps.propose.outputs.roster_mode }}
      status: ${{ steps.propose.outputs.status }}
      probe_clean: ${{ steps.propose.outputs.probe_clean }}
      issue_number: ${{ steps.propose.outputs.issue_number }}
      proposed_roster_b64: ${{ steps.propose.outputs.proposed_roster_b64 }}
      base_sha: ${{ steps.propose.outputs.base_sha }}
      rejected: ${{ steps.propose.outputs.rejected }}
      rejection_reason: ${{ steps.propose.outputs.rejection_reason }}
      rendered_identical: ${{ steps.propose.outputs.rendered_identical }}
      probe_note: ${{ steps.propose.outputs.probe_note }}
      roster_summary: ${{ steps.propose.outputs.roster_summary }}
      roster_latest_json: ${{ steps.propose.outputs.roster_latest_json }}
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@v7.0.1
        with:
          path: skills-evals
          # Full history; this repo is small. (Round 7: this job no longer
          # pushes, so nothing here needs the history for a lease or rebase.)
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install Claude Code CLI
        # NOT PINNED, and ALWAYS THE LATEST (the owner's decisions of
        # 2026-09-27, #202, and 2026-09-28, #203): every run installs the
        # newest Claude Code release npm reports, never reusing one already
        # on the runner, and fails if another `claude` on PATH shadows it.
        # scripts/probe_model_defaults.py reads the vendor's alias defaults
        # off this very CLI, so an older one would report older defaults.
        # The pin existed because this step feeds the key-bearing eval step
        # and an install is a supply-chain vector into whatever credential
        # the job later holds. What still bounds that: this step runs BEFORE
        # the OIDC mint / token exchange below, so nothing it installs runs
        # with a credential in the environment at install time (the step
        # order is asserted by test/issues/test_issue_202_harness.py). What
        # replaces the pin's audit trail: the version actually used is
        # recorded per run — here in the step summary, and in every arm's
        # summary.json (`harness.version`) by harness/run_eval.py.
        #
        # `claude --version` is captured whole and cut to its first line in
        # the shell, not piped through `head`: under pipefail a `head` that
        # exits first can fail the step on the CLI's SIGPIPE. A failing or
        # empty version, an unusable npm answer, or a shadowing CLI fails the
        # step by name.
        run: |
          set -euo pipefail
          latest="$(npm view @anthropic-ai/claude-code version)" || { echo "::error::could not resolve the latest Claude Code version"; exit 1; }
          # A plain MAJOR.MINOR.PATCH and nothing else: a prerelease, an error
          # page, an empty answer or two lines is refused, never stripped
          # into something that looks like a version.
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::npm reported no usable latest Claude Code version"; exit 1; }
          npm install -g "@anthropic-ai/claude-code@${latest}"
          version="$(timeout -k 10 60 claude --version)" || { echo "::error::claude --version failed"; exit 1; }
          # First line only, and only characters a version string needs: this
          # lands in a markdown code span in the step summary.
          version="${version%%$'\n'*}"
          version="${version:0:80}"
          version="${version//[^A-Za-z0-9._() -]/}"
          [[ -n "$version" ]] || { echo "::error::claude --version printed no version"; exit 1; }
          # A different claude earlier on PATH would shadow the one just
          # installed. Exact on the first token: a prefix match would pass a
          # stale 2.1.30 for a latest of 2.1.3.
          [[ "${version%% *}" == "$latest" ]] || { echo "::error::claude on PATH is not the npm latest just installed"; exit 1; }
          echo "harness: Claude Code ${version} (npm latest)"
          { echo "### Harness"; echo "Claude Code \`${version}\` (npm latest)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        # markdown-it-py is pinned exact, per this repo's cooling-off
        # convention: harness/guidance.py locates a section's extent with a
        # real markdown parse, and a floating parser version could silently
        # change what a `section` arm delivers.
        run: pip install pyyaml==6.0.3 markdown-it-py==4.2.0 tree-sitter==0.26.0 tree-sitter-bash==0.25.1

      # This singleton reads the model catalogue, not an eval fixture.
      # The read-only plan and each eval leg validate committed selections;
      # no fixture-controlled input is consumed by this exchange.
      - name: Mint OIDC token and exchange for Anthropic access token
        id: federation
        env:
          # The workload identity federation set-up (docs/evals-and-loop.md,
          # "Workload identity federation"); set by bootstrap from fleet.env.
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          # Optional: with all four variables empty, no token is minted, the
          # roster step below publishes no roster, and the job stays green
          # (roster-refresh.yml dispatches it weekly). A partial or
          # malformed set still fails on the checks that follow.
          if [ -z "${FEDERATION_RULE_ID}${ORGANIZATION_ID}${SERVICE_ACCOUNT_ID}${WORKSPACE_ID}" ]; then
            echo "::notice::Anthropic workload identity federation is not configured (repository variables ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID and ANTHROPIC_WORKSPACE_ID are unset): no token is minted and the model roster is not refreshed this run"
            echo "federation=off" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$FEDERATION_RULE_ID" =~ ^fdrl_[A-Za-z0-9]{8,64}$ ]] || { echo "::error::repository variable ANTHROPIC_FEDERATION_RULE_ID is unset or not an fdrl_ id"; exit 1; }
          [[ "$ORGANIZATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::repository variable ANTHROPIC_ORGANIZATION_ID is unset or not an organization uuid"; exit 1; }
          [[ "$SERVICE_ACCOUNT_ID" =~ ^svac_[A-Za-z0-9]{8,64}$ ]] || { echo "::error::repository variable ANTHROPIC_SERVICE_ACCOUNT_ID is unset or not an svac_ id"; exit 1; }
          [[ "$WORKSPACE_ID" =~ ^wrkspc_[A-Za-z0-9]{8,64}$ ]] || { echo "::error::repository variable ANTHROPIC_WORKSPACE_ID is unset or not a wrkspc_ id"; exit 1; }
          resp=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.anthropic.com")
          jq -r .value <<<"$resp" > "$RUNNER_TEMP/anthropic-oidc.jwt"
          test -s "$RUNNER_TEMP/anthropic-oidc.jwt"
          body=$(jq -n --rawfile jwt "$RUNNER_TEMP/anthropic-oidc.jwt" \
            --arg rule "$FEDERATION_RULE_ID" --arg org "$ORGANIZATION_ID" \
            --arg svac "$SERVICE_ACCOUNT_ID" --arg wrkspc "$WORKSPACE_ID" '{
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
            assertion: ($jwt | rtrimstr("\n")),
            federation_rule_id: $rule,
            organization_id: $org,
            service_account_id: $svac,
            workspace_id: $wrkspc
          }')
          xresp="$RUNNER_TEMP/exchange-resp.json"
          code=$(curl -sS -o "$xresp" -w "%{http_code}" -X POST https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" -d "$body")
          if [ "$code" != "200" ]; then
            # The status and the error type only: the body is not logged.
            etype=$(jq -r '(.error.type? // .error? // empty) | strings' < "$xresp" 2>/dev/null) || etype=""
            [[ "$etype" =~ ^[A-Za-z0-9_.-]{1,64}$ ]] || etype=unknown
            rm -f "$xresp"
            echo "token exchange failed: HTTP $code, error type $etype"
            exit 1
          fi
          tok=$(jq -re .access_token < "$xresp")
          rm -f "$xresp"
          echo "::add-mask::$tok"
          printf '%s' "$tok" > "$RUNNER_TEMP/anthropic-bearer"
          echo "federation=on" >> "$GITHUB_OUTPUT"

      # Model roster (#67, redesigned in #147). Recomputes which models this
      # harness SHOULD be running against — arms, judge, preflight — from
      # what the Models API says is AVAILABLE and what the published usage
      # census says is USED, and publishes it with the run.
      #
      # IT COMPUTES A PROPOSAL, NOT THE RUNNING SET (ADR 0001). The models
      # the eval below actually runs come from the committed
      # `evals/roster.yml` and from nothing else; this step's `--previous`
      # is that same committed file, and its output goes to `persistent/eval-results`
      # as an exhibit plus, when it differs, to the bot-owned
      # `roster/proposal` branch and one tracking issue for a human to
      # merge. Nothing here sets $EVAL_ROSTER, and nothing materialises a
      # roster off `persistent/eval-results` for selection — that is what let one line
      # on an unprotected branch pick every unpinned fixture's models.
      # Amended by ADR 0004: when this run's proposal is merged within the
      # run's bounded wait, the eval runs on that MERGED `evals/roster.yml`
      # — still a reviewed-by-CI commit on `main`, never this computed file.
      #
      # No new credential. The Models API call reuses the same WIF-derived
      # bearer minted above; ANTHROPIC_ADMIN_KEY is optional and its absence
      # produces a ::notice::, never a failure.
      #
      # Vendor defaults (#202, ADR 0002; #203): which model each family alias
      # resolves to, asked of the Claude Code CLI the install step above just
      # put on the runner at the npm latest, by scripts/probe_model_defaults.py.
      # It runs before the bearer is exported, and it scrubs the CLI's
      # environment itself (PATH, a fresh temporary HOME, LANG=C and two fixed
      # traffic switches), so no credential exists in the probe's environment:
      # the CLI's own unauthenticated connections can bill nothing and leak
      # nothing, and alias resolution is built into the binary, not fetched.
      # It reads the init event and kills the CLI's process group. It never
      # fails the step. A family the probe FAILED for (an error recorded for
      # its alias, an answer in the wrong tier or family, or no usable
      # document) is FROZEN for this run by roster.py — its seats held, none
      # retired except models gone from the Models API, none added unless the
      # family holds no seat the Models API still lists. A default the probe
      # answered but this run's catalogue does not match FREEZES its family
      # too, through the identical rule (#203 probe round 7) — only the
      # wording says a mismatch rather than a failure, and the summary says
      # so. On a freeze the proposal step below warns
      # and keeps the tracking issue open; that step runs unless the workflow
      # is cancelled, so it fires even when the eval step failed. Nothing is
      # carried to the next run.
      #
      # NOT FATAL TO THE EVAL. The Models API read is still fatal to the
      # ROSTER — a half-read API is indistinguishable from a model retiring,
      # and publishing that quietly is the failure mode this feature exists to
      # remove — but the eval and the badge never depended on the roster, and
      # this step sits ahead of both. So a failure here prints a ::warning::
      # naming the failure class, publishes NO roster (never a partial one),
      # and lets the eval run on the fixture pins. This also matters because
      # the WIF bearer against GET /v1/models is an auth path exercised for
      # the very first time on the first dispatch after merge.
      #
      # A failed `git fetch` is NOT a first run. `|| true` conflated the two,
      # and the roster then asserted "no fresh census (none published)" about
      # a branch it simply could not read; `ls-remote` tells them apart.
      #
      # Everything lands in $RUNNER_TEMP, not the working tree: roster/ is
      # tracked on persistent/eval-results and untracked on main, so a copy in the
      # working tree would make the commit step's `git checkout -B
      # persistent/eval-results` refuse. The commit step restores it after the switch,
      # exactly as it already does for results/. $RUNNER_TEMP/roster holds the
      # published roster AND NOTHING ELSE — the working inputs live in
      # roster-inputs/ and the Admin API usage report (billing data) at
      # $RUNNER_TEMP/admin-usage.json — so that a future directory copy of
      # that path can only ever publish the roster.
      - name: Refresh the model roster
        working-directory: skills-evals
        env:
          FEDERATION: ${{ steps.federation.outputs.federation }}
        run: |
          set -uo pipefail
          # Federation not configured (the mint step above said so): there is
          # no token for the Models API, so no roster is computed or proposed.
          if [ "${FEDERATION:-}" = off ]; then
            echo "::notice::model roster not refreshed: Anthropic workload identity federation is not configured"
            {
              echo "### Model roster"
              echo
              echo "**The roster was not refreshed this run:** Anthropic workload identity federation is not configured, so there is no token for the Models API. No roster is published and no proposal is made."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pub="$RUNNER_TEMP/roster"
          work="$RUNNER_TEMP/roster-inputs"
          rm -rf "$pub" "$work"; mkdir -p "$pub" "$work"
          reason=""
          # The reason a failed script's stderr becomes a ::warning::/step-
          # summary line. Prefers the FIRST non-empty line that is neither a
          # `roster: `-prefixed warn() line (compute_roster's own warnings,
          # chronologically first) nor an indented line (a roster.py
          # "  <id>: <reason>" per-model detail, or an indented traceback
          # frame) nor the traceback's own header — the single least useful
          # line a traceback has. That headline is what roster.py's fatal
          # "refusing to publish a roster with no arms" path prints FIRST,
          # ahead of one indented line per excluded/unranked model, so the
          # old `tail -n 1` here surfaced a random model's detail instead of
          # the headline. Falls back to the plain last non-empty line only
          # when nothing clears that bar (an uncaught exception, where the
          # exception's own message is the last line and the traceback's
          # header and frames are the only other candidates).
          extract_reason() {
            local line
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                'roster: '*) continue ;;
                ' '*|$'\t'*) continue ;;
                'Traceback (most recent call last):') continue ;;
              esac
              printf '%s\n' "$line"
              return 0
            done < "$1"
            grep -v '^$' "$1" | tail -n 1
          }
          # The `roster: `-prefixed warn() lines carry the actual diagnosis
          # (a stale/unreadable census, skipped bad rows, ...). A census
          # that is stale/unreadable/carries skipped rows can print these
          # and STILL let the run succeed overall (a graceful fallback), so
          # this runs on both the success and failure paths — it used to
          # run only on failure, reaching only the raw job log on success,
          # never the step summary — the surface most people actually read
          # first.
          emit_roster_warnings() {
            local file="$1" warnings
            [ -f "$file" ] || return 0
            warnings=$(grep '^roster: ' "$file" || true)
            [ -n "$warnings" ] || return 0
            {
              echo
              echo "<details><summary>roster warnings</summary>"
              echo
              echo '```'
              printf '%s\n' "$warnings"
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          refresh() {
            # Vendor model defaults (#202, #203): which model each family
            # alias resolves to, read off the installed CLI's init event with
            # no credential. Run BEFORE the bearer is exported so it never
            # sits in this process's environment (the probe scrubs the CLI's
            # environment regardless), and it cannot fail the step: a failed
            # probe records its error classes and roster.py freezes those
            # families for this run. A probe that exits non-zero writes no
            # document, so a stand-in naming that is written in its place —
            # read as its own class, `probe-exited` (every family frozen),
            # never as "no probe at all" nor as a probe that ran and
            # resolved nothing (`{}`, `no-defaults`).
            python3 scripts/probe_model_defaults.py --out "$work/defaults.json" || printf '{"probe_exit": "nonzero"}\n' > "$work/defaults.json" || true
            ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/anthropic-bearer")"
            export ANTHROPIC_AUTH_TOKEN
            # The published census comes off persistent/eval-results WITHOUT checking it
            # out; the previous roster is the committed evals/roster.yml.
            # The branch switch belongs to the commit step, and an absent
            # census remains an ordinary fallback case.
            if ! git fetch origin persistent/eval-results 2>/dev/null; then
              # `git ls-remote | grep -q` discards ls-remote's OWN exit status
              # under `pipefail`: on a correlated outage (fetch AND ls-remote
              # both unreachable) grep sees empty stdin, "no match" is exit 1,
              # and pipefail reports the pipeline's status as grep's 1 rather
              # than ls-remote's 128 — reading a network outage as a genuine
              # first run. Capture ls-remote's own output and exit status via
              # command substitution instead, and match on the captured text
              # with a here-string so nothing is piped into grep (the fleet's
              # SIGPIPE rule) and ls-remote's failure cannot be swallowed by
              # what comes after it.
              ls_out=$(git ls-remote --heads origin persistent/eval-results 2>/dev/null) || {
                reason="roster inputs unavailable: could not reach origin"
                return 1
              }
              if grep -qF -- 'refs/heads/persistent/eval-results' <<<"$ls_out"; then
                reason="roster inputs unavailable: persistent/eval-results exists but could not be fetched"
                return 1
              fi
            fi
            # THE CENSUS ONLY. The previous roster is the COMMITTED
            # evals/roster.yml now (ADR 0001) — it is not materialised
            # from this branch at all, because a document read off an
            # unprotected branch cannot be the harness's record of what
            # it has observed (#147).
            if git rev-parse -q --verify origin/persistent/eval-results >/dev/null 2>&1; then
              git show origin/persistent/eval-results:usage/latest.json > "$work/census.json" 2>/dev/null || true
            fi
            # stderr is captured, not swallowed: it is echoed back to the log
            # either way, and on failure extract_reason picks the
            # ::warning::. Both scripts are written to keep that line to a
            # status code or an exception class — never a response body.
            if ! python3 scripts/refresh_models.py \
                 --out "$work/models.json" \
                 --admin-report "$RUNNER_TEMP/admin-usage.json" 2> "$work/refresh.err"; then
              cat "$work/refresh.err" >&2
              reason="$(extract_reason "$work/refresh.err")"
              return 1
            fi
            cat "$work/refresh.err" >&2
            if ! python3 harness/roster.py \
                 --models "$work/models.json" \
                 --policy evals/roster-policy.yml \
                 --census "$work/census.json" \
                 --admin-report "$RUNNER_TEMP/admin-usage.json" \
                 --previous evals/roster.yml \
                 --defaults "$work/defaults.json" \
                 --out "$pub/latest.json" > "$work/summary.md" 2> "$work/roster.err"; then
              cat "$work/roster.err" >&2
              reason="$(extract_reason "$work/roster.err")"
              return 1
            fi
            cat "$work/roster.err" >&2
            cat "$work/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
            emit_roster_warnings "$work/roster.err"
            return 0
          }
          if ! refresh; then
            rm -f "$pub/latest.json" "$pub"/*.partial
            echo "::warning::model roster NOT refreshed: ${reason:-unknown failure}"
            {
              echo "### Model roster"
              echo
              echo "**The roster was not refreshed this run.** ${reason:-unknown failure}"
              echo
              echo "No roster is published and no proposal is made; the eval below"
              echo "will run on the committed evals/roster.yml, as it always does."
            } >> "$GITHUB_STEP_SUMMARY"
            emit_roster_warnings "$work/roster.err"
          fi

      # THE PROPOSAL (#147, ADR 0001 decision 2). The roster step above
      # computed what the roster SHOULD be; this step is what a human ever
      # sees of it. When it differs from the committed `evals/roster.yml`
      # it renders and admits the proposed file and hands it to `roster-pr`
      # (round 7), which publishes it as ONE commit on the bot-owned branch
      # `roster/proposal` with the roster App's token and upserts ONE
      # tracking issue carrying the rendered summary and the compare link.
      # When it does not differ this step closes that issue, so a stale one
      # never sits open claiming a change that has already landed or gone
      # away.
      #
      # WHY A BRANCH AND AN ISSUE, AND NOT A PULL REQUEST. GitHub can create
      # approval-required runs for pull_request opened, synchronized, or
      # reopened by `GITHUB_TOKEN`. This design still has a human open the PR
      # from the branch so the reviewer owns that route and its admission
      # state before merging after CI. This is the fleet's sanctioned bot-write path:
      # a branch and a pull request a person merges, never a direct push to
      # a protected branch and never a ruleset bypass actor.
      #
      # `roster/proposal` IS BOT-OWNED AND IS NEVER SHARED. It is recreated
      # on live `main` every run and force-updated (round 7: by `roster-pr`,
      # with the roster App's token, through the git-data REST API); nobody
      # commits to it by hand and nothing else reads it. That is the one
      # sanctioned exception to the fleet's "do not force-push a shared
      # branch" rule, and it is sanctioned because the branch is not
      # shared: a proposal computed against last week's `main` is not a
      # thing to preserve, it is a thing to replace. What keeps that honest
      # since round 7 is a ruleset (added in repo-settings) that lets only
      # the roster App and repository admins create, update or delete the
      # ref, so nothing else can write to it at all.
      #
      # IT RUNS IN ITS OWN JOB, deliberately (B1, rounds 3 and 4 on #209).
      # The eval must run with no GitHub write
      # credential anywhere on ITS runner (the security header's fourth
      # rule); this step holds one (`issues: write`), so it lives in the
      # `roster` job, which never runs the agent and never `needs: eval`, on
      # a runner the agent never touches. It does no git writes at all.
      #
      # Nothing here interpolates a GitHub Actions expression into the
      # shell. The run id and the repository arrive through `env:` and are
      # read as variables.
      - name: Propose a roster change
        # Unless the workflow is cancelled (#203 probe round 2): the proposal
        # and a failed probe's warning and tracking issue are the loud
        # channels, so a failed eval step must not silence them. An
        # expression in `if:`, never interpolated into a run: body.
        if: ${{ !cancelled() }}
        id: propose
        working-directory: skills-evals
        env:
          # The tracking issue's `gh issue` calls (`issues: write`) are the
          # only writes this step makes; round 7 took the branch push, and
          # with it `contents: write`, off this job entirely.
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GITHUB_OUTPUT always exists on a real runner; this default only
          # protects a test harness that runs the script without it
          # (`set -u` would otherwise turn every `emit`/`emit_ml` call
          # below into an "unbound variable" failure) — output goes nowhere
          # rather than the step dying on a harness gap unrelated to what
          # it is testing.
          : "${GITHUB_OUTPUT:=/dev/null}"
          # `emit`/`emit_ml` write this step's job outputs, consumed by the
          # `roster-pr` job (F2, adversarial round 1 on #209). `emit_ml`'s
          # delimiter is RANDOM per call, never fixed: `roster_summary` below
          # is harness/roster.py's own rendered text, shaped partly by the
          # untrusted census (ADR 0003's own Consequences section), and a
          # fixed `key<<EOF` delimiter could be spoofed by that text to
          # smuggle extra `key=value` lines into $GITHUB_OUTPUT. Every OTHER
          # value this step emits is either one of a small set of fixed
          # literals this step itself chose (never the raw computed value)
          # or digit/hex-validated before emit — see each call site below.
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          emit_ml() {
            # `content="$(cat)"` strips any trailing newline stdin has (or
            # doesn't have) and the `printf '%s\n'` below always puts exactly
            # one back — the delimiter line must never land glued onto the
            # content's last line, whether or not the caller's own value
            # ended with one.
            local key="$1" delim content
            delim="ghaout_$$_${RANDOM}${RANDOM}${RANDOM}"
            content="$(cat)"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$content"
              printf '%s\n' "$delim"
            } >> "$GITHUB_OUTPUT"
          }
          marker='<!-- skills-evals:roster-proposal -->'
          computed="$RUNNER_TEMP/roster/latest.json"
          if [ ! -f "$computed" ]; then
            echo "::notice::no roster was computed this run, so there is nothing to propose"
            exit 0
          fi
          # B1 (round 3 on #209): this run's computed roster, published as an
          # OUTPUT so the `publish` job (round 4: relocated off `eval`) can
          # commit an EXHIBIT copy to `persistent/eval-results` without the `roster`
          # job depending on `eval` or `publish` (ADR 0001, decision 3:
          # `roster/latest.json` is read by no decision) and without either
          # of those jobs needing any git access to this job's own runner.
          emit_ml roster_latest_json < "$computed"
          # Should-fix 1 (round 3 on #209): `summary.md` is rendered by
          # harness/roster.py, shaped in part by the untrusted census —
          # neutralised IN PLACE, once, here, before ANYTHING below reads
          # it, so both this step's own direct issue-body embed (the
          # "same"/frozen-same branches) and the `roster_summary` output
          # the `roster-pr` job later embeds in a PR/issue body are already
          # safe. A zero-width space after `@` and before a `#`-digit
          # sequence breaks a GitHub `@mention` or `Fixes #N` closing
          # keyword without changing what a human reads.
          if [ -f "$RUNNER_TEMP/roster-inputs/summary.md" ]; then
            python3 -c '
          import re
          import sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              text = handle.read()
          text = text.replace("@", "@​")
          text = re.sub(r"#(\d)", "#​\\1", text)
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(text)
          ' "$RUNNER_TEMP/roster-inputs/summary.md"
          fi
          status=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(((d.get("proposal") or {}).get("status")) or "")' "$computed")
          echo "proposal status: ${status:-unknown}"
          # `status` is not emitted yet — only once the tracker lookup below
          # has actually resolved one issue (or confirmed there is none): if
          # that lookup fails or is ambiguous, the roster-pr job must see an
          # unknown/empty status (its disable-only path), exactly like today,
          # never a "differs" it would then act on with no tracking issue to
          # write to.

          # >>> roster-mode
          # `roster_mode` in `evals/roster-policy.yml` (the owner's decision of
          # 2026-09-28, docs/decisions/0003-roster-merges-automatically.md)
          # selects `auto` (merge the roster proposal automatically via PR +
          # auto-merge) or `proposal` (today's flow: a human opens and merges
          # the PR). Read from THIS working directory, which is the trusted
          # `main` checkout (never the `roster/proposal` branch, and never
          # the untrusted census). A missing key is a genuine "not set yet"
          # and falls back to `proposal` silently; a present-but-unreadable
          # file behaves the same (the `except` below). Any other value is a
          # fixed warning, since it is a typo or drift rather than a
          # deliberate absence. roster.py itself never reads this key.
          #
          # `find_roster_pr` — used to live here too, but every `gh pr` call
          # moved to the `roster-pr` job (F2, adversarial round 1 on #209):
          # this job no longer looks the pull request up at all.
          roster_mode=$(python3 -c '
          import sys
          import yaml
          try:
              with open("evals/roster-policy.yml", encoding="utf-8") as handle:
                  doc = yaml.safe_load(handle)
          except Exception:
              doc = None
          value = doc.get("roster_mode") if isinstance(doc, dict) else None
          print(value if isinstance(value, str) else "")
          ' 2>/dev/null) || roster_mode=""
          case "$roster_mode" in
            auto|proposal) : ;;
            "") roster_mode="proposal" ;;
            *)
              echo "::warning::roster_mode is not auto or proposal; using proposal"
              roster_mode="proposal"
              ;;
          esac
          echo "roster_mode: $roster_mode"
          emit roster_mode "$roster_mode"
          # <<< roster-mode

          # >>> roster-only note
          # B1 (round 3 on #209): this job (`roster`) must never depend on
          # `eval` (so the two can run in parallel, and so the `eval` job's
          # bypass-permissions agent never shares a runner with this job's
          # write credential) — so it cannot read the `eval` job's outcome
          # at all, only whether an eval runs THIS DISPATCH, from the event
          # payload alone (never interpolated into this block: a dispatch
          # sends the boolean input as a boolean or as the string "true",
          # and a scheduled run has no inputs at all). This local
          # `eval_note` is used only by the "same"/frozen-same bodies THIS
          # step writes directly, below; the `roster-pr` job computes its
          # OWN sentence for the "differs"/"rejected" bodies it writes
          # (ADR 0004: it runs before the eval too now, so that sentence
          # says the eval follows, on the merged or the committed roster).
          roster_only=false
          if [ -f "${GITHUB_EVENT_PATH:-}" ] && jq -e '(.inputs.roster_only // false) | . == true or . == "true"' "$GITHUB_EVENT_PATH" > /dev/null 2>&1; then
            roster_only=true
          fi
          if [ "$roster_only" = true ]; then
            eval_note="This was a \`roster_only\` dispatch: no eval ran, and nothing from this run is published to \`persistent/eval-results\`. Its only outputs are the \`roster/proposal\` branch and this issue; where the summary below says the eval runs on the committed roster, no eval ran at all."
          else
            # S3 (round 4 on #209): "runs", not "ran" — this step writes
            # this sentence in the `roster` job, which never `needs:
            # eval` and so cannot know whether the `eval` job (in a
            # separate job after this one) has even started yet, let
            # alone finished.
            eval_note="The paid eval runs, in a separate job after this one, on the committed \`evals/roster.yml\`; that job's own result says whether it succeeded and what it published to \`persistent/eval-results\`."
          fi
          # <<< roster-only note

          # >>> defaults-failed note
          # A vendor-default probe that failed FROZE its families for this run
          # (#203 probe round 1): their seats were held, so the proposal can
          # read "same" for a reason a reviewer must see. The count is read
          # from the computed roster by python at run time, never
          # interpolated, and validated as digits; the warning's text is
          # otherwise fixed.
          defaults_failed=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); f=d.get("defaults_failed") if isinstance(d,dict) else None; print(len(f) if isinstance(f,dict) else 0)' "$computed" 2>/dev/null) || defaults_failed=0
          case "$defaults_failed" in ''|*[!0-9]*) defaults_failed=0 ;; esac
          # Also read `defaults_mismatched` (#203 probe round 8, R8-1): a
          # catalogue mismatch freezes its family exactly like a probe
          # failure (see harness/roster.py's compute_roster), so it must be
          # just as loud here — its own fixed warning, its own probe-note
          # sentence, and it keeps the tracking issue open on "same" too.
          defaults_mismatched=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); f=d.get("defaults_mismatched") if isinstance(d,dict) else None; print(len(f) if isinstance(f,dict) else 0)' "$computed" 2>/dev/null) || defaults_mismatched=0
          case "$defaults_mismatched" in ''|*[!0-9]*) defaults_mismatched=0 ;; esac
          probe_note=""
          failed_note=""
          if [ "$defaults_failed" -gt 0 ]; then
            failed_word="families"; [ "$defaults_failed" -eq 1 ] && failed_word="family"
            echo "::warning::vendor-default probe failed for $defaults_failed $failed_word; their seats were held"
            failed_note="**The vendor-default probe failed for $defaults_failed $failed_word this run.** Their seats were held and none retired except models gone from the Models API; a family of theirs gained a seat only if it held none the Models API still lists. The summary below names each family and its error class. Nothing is carried over: the next run's probe decides afresh."
          fi
          mismatch_note=""
          if [ "$defaults_mismatched" -gt 0 ]; then
            mismatched_word="families"; [ "$defaults_mismatched" -eq 1 ] && mismatched_word="family"
            echo "::warning::vendor default not matched by this run's catalogue for $defaults_mismatched $mismatched_word; their seats were held"
            mismatch_note="**A vendor default did not match this run's catalogue for $defaults_mismatched $mismatched_word this run.** Their seats were held and none retired except models gone from the Models API; a family of theirs gained a seat only if it held none the Models API still lists. The summary below names each family and its mismatch class. Nothing is carried over: the next run's probe decides afresh."
          fi
          if [ -n "$failed_note" ] && [ -n "$mismatch_note" ]; then
            probe_note=$(printf '%s\n\n%s' "$failed_note" "$mismatch_note")
          elif [ -n "$failed_note" ]; then
            probe_note="$failed_note"
          elif [ -n "$mismatch_note" ]; then
            probe_note="$mismatch_note"
          fi
          if [ "$defaults_failed" -eq 0 ] && [ "$defaults_mismatched" -eq 0 ]; then
            emit probe_clean true
          else
            emit probe_clean false
          fi
          printf '%s' "$probe_note" | emit_ml probe_note
          emit_ml roster_summary < "$RUNNER_TEMP/roster-inputs/summary.md"
          # <<< defaults-failed note

          # The open tracking issue is owned by this workflow's bot account,
          # not by whoever copied a public marker into an issue body. Query
          # every page with GitHub's creator filter, then verify the creator
          # again locally before a number can reach an edit or close command.
          # `--slurp` preserves page boundaries, so malformed or incomplete
          # listings fail closed rather than looking like no tracker.
          issues="$RUNNER_TEMP/roster-issues.json"
          tracker_creator='github-actions[bot]'
          if ! gh api --paginate --slurp "repos/$REPO/issues?state=open&per_page=100&creator=github-actions%5Bbot%5D" > "$issues"; then
            echo "::warning::could not list issues; the roster proposal was not filed"
            exit 0
          fi
          if ! issue=$(python3 - "$issues" "$marker" "$tracker_creator" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              pages = json.load(handle)
          if not isinstance(pages, list) or not pages or not all(isinstance(page, list) for page in pages):
              raise SystemExit("tracker listing was not a complete paginated response")
          rows = [row for page in pages for row in page]
          for row in rows:
              if (not isinstance(row, dict)
                      or not isinstance(row.get("number"), int)
                      or isinstance(row.get("number"), bool)
                      or row["number"] <= 0):
                  raise SystemExit("tracker listing contained a malformed issue")
              user = row.get("user")
              if (not isinstance(user, dict)
                      or not isinstance(user.get("login"), str)
                      or not user["login"].strip()
                      or not isinstance(user.get("type"), str)
                      or not user["type"].strip()):
                  raise SystemExit("tracker listing contained a malformed issue")
              if "body" not in row or not isinstance(row["body"], (str, type(None))):
                  raise SystemExit("tracker listing contained a malformed issue")
          hits = [row for row in rows
                  if "pull_request" not in row
                  and row.get("user", {}).get("login") == sys.argv[3]
                  and row.get("user", {}).get("type") == "Bot"
                  and sys.argv[2] in (row.get("body") or "")]
          if len(hits) > 1:
              raise SystemExit("multiple bot-owned roster tracking issues are open")
          print(hits[0]["number"] if hits else "")
          PY
          ); then
            echo "::warning::could not identify one bot-owned roster tracking issue; the roster proposal was not filed"
            exit 0
          fi
          case "$issue" in
            ''|*[!0-9]*) : ;;
            *) emit issue_number "$issue" ;;
          esac
          # Forwarded as one of these two fixed literals ONLY, never the raw
          # value read above: `status` is partly shaped by the untrusted
          # census, and the roster-pr job's shell reads this output straight
          # into a variable it compares and interpolates.
          case "$status" in
            same) emit status same ;;
            differs) emit status differs ;;
            *) : ;;
          esac

          # A failed probe, or a catalogue mismatch, keeps the tracking
          # issue OPEN even on "same" (#203 probe round 8, R8-1 folded the
          # mismatch case in): the roster did not move because the probe
          # could not say whether it should, or could not corroborate the
          # catalogue, and closing the issue would hide either one. The
          # title and first line are chosen BY CLASS so a mismatch-only run
          # never says "probe failed", and a run with both says both.
          #
          # F3 (adversarial round 1 on #209): this "same" branch — frozen or
          # not — never touches the roster pull request any more; the
          # `roster-pr` job does that unconditionally from the `status`
          # output above, whether or not the probe was clean, so an open
          # automatic PR is closed here too even when the probe froze.
          if [ "$status" = "same" ] && { [ "$defaults_failed" -gt 0 ] || [ "$defaults_mismatched" -gt 0 ]; }; then
            if [ "$defaults_failed" -gt 0 ] && [ "$defaults_mismatched" -gt 0 ]; then
              issue_title="Model roster: the vendor-default probe failed and a default did not match the catalogue"
              first_line="This run proposes no change to the committed \`evals/roster.yml\`, but the vendor-default probe failed and a vendor default did not match this run's catalogue, so this issue stays open until a run probes cleanly with a matching catalogue."
            elif [ "$defaults_failed" -gt 0 ]; then
              issue_title="Model roster: the vendor-default probe failed"
              first_line="This run proposes no change to the committed \`evals/roster.yml\`, but the vendor-default probe failed, so this issue stays open until a run probes cleanly."
            else
              issue_title="Model roster: a vendor default did not match this run's catalogue"
              first_line="This run proposes no change to the committed \`evals/roster.yml\`, but a vendor default did not match this run's catalogue, so this issue stays open until a run's catalogue matches."
            fi
            body="$RUNNER_TEMP/proposal-body.md"
            {
              printf '%s\n\n' "$marker"
              echo "$first_line"
              echo
              echo "$probe_note"
              echo
              echo "$eval_note"
              echo
              cat "$RUNNER_TEMP/roster-inputs/summary.md"
            } > "$body"
            # A failed gh write warns and never fails the job (#203 probe
            # rounds 2 and 3): the roster and the eval are already done.
            if [ -n "$issue" ]; then
              if gh issue edit "$issue" --repo "$REPO" \
                --title "$issue_title" --body-file "$body"; then
                echo "updated the roster tracking issue #$issue"
              else
                echo "::warning::could not update the roster tracking issue"
              fi
            else
              gh issue create --repo "$REPO" \
                --title "$issue_title" --body-file "$body" \
                || echo "::warning::could not create the roster tracking issue"
            fi
            exit 0
          fi
          if [ "$status" = "same" ]; then
            if [ -n "$issue" ]; then
              if gh issue close "$issue" --repo "$REPO" \
                --comment "This run proposes no change to the model roster (routine observation-date refreshes are not proposed). Closing until something changes."; then
                echo "closed the stale proposal issue #$issue"
              else
                echo "::warning::could not close the roster tracking issue"
              fi
            else
              echo "nothing to propose and no open proposal issue"
            fi
            exit 0
          fi
          if [ "$status" != "differs" ]; then
            echo "::warning::the computed roster has an unknown proposal status; it was not filed"
            exit 0
          fi

          # The persistent/eval-results commit the census came from, recorded in the
          # rendered file's provenance so a merged proposal says which
          # untrusted document shaped it.
          census_commit=$(git rev-parse origin/persistent/eval-results 2>/dev/null) || census_commit="none"
          # A computed roster may legitimately have no non-arm judge when
          # every available model is seated. Preserve that observation in the
          # published eval result, but do not publish a branch a reviewer
          # cannot merge under the committed-roster contract.
          rejection=""
          if ! python3 scripts/render_roster_yaml.py \
            --roster "$computed" \
            --out "$RUNNER_TEMP/proposed-roster.yml" \
            --run-id "$RUN_ID" \
            --eval-results-commit "$census_commit" \
            > "$RUNNER_TEMP/proposal-render.err" 2>&1; then
            rejection="Rendering was rejected because the computed proposal could not be rendered safely."
          elif ! python3 - "$RUNNER_TEMP/proposed-roster.yml" > "$RUNNER_TEMP/proposal-admission.err" 2>&1 <<'PY'
          import sys

          import yaml

          sys.path.insert(0, "harness")
          import roster

          with open(sys.argv[1], encoding="utf-8") as handle:
              problems = roster.committed_roster_problems(yaml.safe_load(handle))
          if problems:
              print("\n".join(f"- {problem}" for problem in problems))
              raise SystemExit(1)
          PY
          then
            rejection="Admission was rejected because the rendered proposal does not meet the committed-roster contract."
          fi
          if [ -n "$rejection" ]; then
            # F2 (adversarial round 1 on #209): this run's proposal never
            # reached publication, so there is no branch for the `roster-pr`
            # job to act on either — but an EARLIER run's PR may still be
            # open, and that job disables its auto-merge unconditionally
            # whenever this run did not (re-)enable one, from the `rejected`
            # output alone. Nothing about any existing PR is decided here.
            # `$rejection` is one of exactly two fixed sentences (never a
            # rendered/admission tool's own untrusted stderr — those are
            # captured to $RUNNER_TEMP files and never echoed), so it is
            # safe as an ordinary single-line output.
            emit rejected true
            emit rejection_reason "$rejection"
            echo "::notice::this run's roster proposal was rejected before publication: $rejection"
            exit 0
          fi

          # >>> proposal-handoff
          # Round 7 (ADR 0003, "the App publishes the proposal branch"):
          # this job no longer commits or pushes anything. It hands the
          # rendered, admitted file to `roster-pr` as a job output — the
          # EXACT bytes, base64 — plus the sha it was rendered against, and
          # `roster-pr` publishes the commit to `roster/proposal` with the
          # roster App's token through the git-data REST API. That is what
          # lets a ruleset confine updates of `refs/heads/roster/proposal`
          # to the App: `GITHUB_TOKEN` here is the same `github-actions`
          # identity as dependabot-auto-merge.yml's persisted checkout
          # credential, so it could never be the ruleset's bypass actor
          # without letting that job retarget an armed PR too.
          #
          # Byte-identical to the committed file: nothing to publish. The
          # comparison is against THIS checkout (the run's own `main` sha),
          # the same base the old worktree diff used.
          if cmp -s "$RUNNER_TEMP/proposed-roster.yml" evals/roster.yml; then
            echo "::notice::the proposal renders byte-identically to the committed roster; nothing to publish"
            emit rendered_identical true
            exit 0
          fi
          # Validated as a bare 40-hex sha before it becomes an output;
          # `roster-pr` re-validates it at its own job boundary.
          base=$(git rev-parse HEAD) || base=""
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::could not resolve this run's checkout sha; the roster proposal was not handed on"
            exit 0
          fi
          # A size cap far below the 1 MB job-outputs limit (the file is a
          # few KB) and below GitHub's 65536-character issue body, which
          # the tracking issue may inline it into. Over the cap is "no
          # proposal": nothing is handed on, and `roster-pr` reports the
          # proposal as not published rather than publishing a truncation.
          max_roster_bytes=32768
          size=$(wc -c < "$RUNNER_TEMP/proposed-roster.yml" | tr -d '[:space:]') || size=""
          case "$size" in ''|*[!0-9]*) size=$((max_roster_bytes + 1)) ;; esac
          if [ "$size" -eq 0 ] || [ "$size" -gt "$max_roster_bytes" ]; then
            echo "::warning::the rendered roster is empty or larger than $max_roster_bytes bytes; the roster proposal was not handed on"
            exit 0
          fi
          emit base_sha "$base"
          emit proposed_roster_b64 "$(base64 -w0 < "$RUNNER_TEMP/proposed-roster.yml")"
          # <<< proposal-handoff

  # B1 (round 4 on #209, blocker): disarms any EARLIER run's still-armed
  # `roster/proposal` auto-merge before the `eval` job's agent starts —
  # see the header comment above for why this closes ADR 0003's
  # cancellation window instead of merely narrowing it after the fact.
  # `needs: roster` only, deliberately never `eval`: this job must complete
  # (or fail loudly-but-harmlessly) before the agent runs, not after.
  disarm:
    needs: roster
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read
    steps:
      # The SAME validated, owner-filtered lookup `roster-pr`'s
      # `find_roster_pr` uses (server-side `head=` filter, re-asserted
      # client-side by both the exact repo full name and the exact branch
      # name, digits-only on the number) — duplicated here rather than
      # shared, since this job performs no checkout and the two jobs run on
      # separate runners with nothing in common to source a shared script
      # from. Nothing here interpolates a GitHub Actions expression into
      # the shell; `REPO` and the token arrive through `env:`.
      #
      # Round 2 of the ADR 0004 review (nit 3): it reads the PR first and
      # leaves one with no auto-merge alone (an unarmed proposal-mode PR
      # gets no `--disable-auto` and so no warning). Otherwise it stays
      # FAIL-OPEN on purpose — a failed read still attempts the disable, and
      # every failure is a `::warning::`, exit 0 — because this job is about
      # an EARLIER run's arming; `roster-wait`'s sweep step is the
      # fail-closed gate on this run's eval and `publish`.
      - name: Disarm any armed roster pull request before the agent runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          find_roster_pr() {
            local raw
            if ! raw=$(gh api "repos/$REPO/pulls?state=open&base=main&head=${REPO%%/*}:roster/proposal" \
                        --jq '[.[] | select(.head.repo.full_name == env.REPO and .head.ref == "roster/proposal")] | .[0].number // empty' \
                        2>/dev/null); then
              return 1
            fi
            case "$raw" in
              ''|*[!0-9]*) printf '' ;;
              *) printf '%s' "$raw" ;;
            esac
          }
          if pr_number=$(find_roster_pr); then
            if [ -n "$pr_number" ]; then
              # The sweep's own read; a failed read is not "clear", so the
              # disable is attempted as before.
              state=$(gh api "repos/$REPO/pulls/$pr_number" \
                        --jq 'if (.state != "open") or (.auto_merge == null) then "clear" else "armed" end' \
                        2>/dev/null) || state=""
              if [ "$state" = clear ]; then
                echo "pull request #$pr_number is not armed; nothing to disarm"
              elif gh pr merge "$pr_number" --repo "$REPO" --disable-auto; then
                echo "disarmed pull request #$pr_number before the eval job's agent runs"
              else
                echo "::warning::could not disable auto-merge for the roster pull request before the agent ran"
              fi
            else
              echo "no open roster pull request to disarm"
            fi
          else
            echo "::warning::could not find the roster pull request to disarm"
          fi
          exit 0

  eval:
    # ADR 0004: `roster-pr` (publish + arm) and `roster-wait` (bounded wait,
    # verify, disarm unless merged) run BEFORE this job, so the agent starts
    # only once no roster pull request is left armed, and this job can run
    # on the roster its own run just merged. `disarm` stays listed: it is
    # what clears an EARLIER run's stale arming before anything else.
    needs: [plan, roster, disarm, roster-pr, roster-wait]
    # S1 (fail closed): runs only when `roster-wait` CONFIRMED no roster
    # pull request is left armed (`cleared == 'true'`), or when it was
    # skipped altogether (a dispatch off `main`, where nothing is armed by
    # this workflow — today's behavior there). A `roster-wait` that failed,
    # timed out, was cancelled or never started leaves `cleared` empty, so
    # this job, and `publish` after it, do not run; the sweep step's
    # warning and summary say so when it got that far, and the failed
    # `roster-wait` job itself is the signal when it did not.
    # NOT fatal on a `roster` failure (its own steps are already designed
    # to warn and continue rather than fail the job on an ordinary
    # refresh/publish problem; this `if:` covers the job dying outright,
    # e.g. a broken WIF mint) — the eval must still run on the committed
    # roster either way. Likewise never fatal on a failed/warned `disarm` —
    # that job's own job-level `::warning::`s are its loud channel, and
    # this job must still run on the committed roster regardless (B1, round
    # 4 on #209). A failed or skipped `roster-pr` likewise just means no
    # arming and the committed roster. But a `roster-wait` that did not
    # CONFIRM the arming cleared keeps this job from running at all (S1,
    # the clause below). Skipped entirely for a `roster_only` dispatch.
    if: ${{ !cancelled() && needs.plan.result == 'success' && !inputs.roster_only && (needs.roster-wait.result == 'skipped' || needs.roster-wait.outputs.cleared == 'true') }}
    runs-on: ubuntu-latest
    # Job-level, not workflow-level (F2). B1 (round 4 on #209, blocker):
    # `contents: write` is GONE — this job runs the bypass-permissions
    # agent and must hold no write scope of any kind; `contents: read` is
    # only for the checkout steps below (a private-repo clone needs a
    # read-scoped token), and `id-token: write` is this job's own WIF mint.
    # Everything that used to need `contents: write` here (the badge
    # commit/push) moved to the `publish` job, which the agent never
    # shares a runner with.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # 45 min covers the widest committed shape, not just the 2-arm skill
    # A/B: a guidance fixture spends (agent budget + guard budget) per
    # DECLARED arm, and the delivery canary declares five at 120 + 120 s. A
    # five-arm fixture that inherited the defaults instead (600 + 300 s)
    # would need 75 min and not fit. A fixture's `followups:` each run a
    # whole agent budget more per arm.
    # test_every_fixture_fits_inside_the_workflow_job_timeout is what
    # catches both, over every skill and guidance fixture under evals/.
    timeout-minutes: 45
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@v7.0.1
        with:
          path: skills-evals
          # Full history so the push-race rebase below always has the commits
          # it needs; this repo is small.
          fetch-depth: 0
          persist-credentials: false

      # ADR 0004: the roster DATA may come from the merge this run's
      # `roster-wait` job verified; the CODE never does. Exactly one file,
      # `evals/roster.yml`, is taken from the merge commit and written over
      # this checkout's copy — never a checkout of the newer `main`, which
      # may have moved for other reasons too. The merge commit is fetched
      # by sha with no credential (this checkout persists none; the
      # repository is public) and re-verified HERE, at the job that uses it,
      # independently of `roster-wait`'s API checks: it must descend from
      # this run's own commit, change exactly `evals/roster.yml` against its
      # first parent, and carry the proposal the `roster` job rendered, byte
      # for byte. Anything else — or any source but `merged` — leaves the
      # committed file in place and says why in the step summary; a merge
      # that fails a check here is also a fixed `::warning::`. Before the
      # preflight and the eval, which both read `evals/roster.yml`, and
      # before any credential exists on this runner. Nothing here
      # interpolates an expression into the shell; every value arrives
      # through `env:` and is re-validated.
      - name: Use the roster this run merged, or the committed one
        working-directory: skills-evals
        env:
          ROSTER_SOURCE: ${{ needs.roster-wait.outputs.roster_source }}
          ROSTER_REASON: ${{ needs.roster-wait.outputs.roster_reason }}
          MERGE_SHA: ${{ needs.roster-wait.outputs.merge_sha }}
          ROSTER_PR_NUMBER: ${{ needs.roster-wait.outputs.pr_number }}
          ROSTER_CLEARED: ${{ needs.roster-wait.outputs.cleared }}
          PROPOSED_ROSTER_B64: ${{ needs.roster.outputs.proposed_roster_b64 }}
        run: |
          set -uo pipefail
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"
          head=$(git rev-parse HEAD 2>/dev/null) || head=""
          pr=""
          case "${ROSTER_PR_NUMBER:-}" in ''|*[!0-9]*) : ;; *) pr="$ROSTER_PR_NUMBER" ;; esac
          merge_sha=""
          if [[ "${MERGE_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then merge_sha="$MERGE_SHA"; fi
          committed() {
            {
              echo "### Roster"
              echo
              echo "This eval runs on the committed \`evals/roster.yml\` at this run's commit \`${head:-unknown}\`: $1"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "roster: committed evals/roster.yml"
            exit 0
          }
          refuse() {
            echo "::warning::the merged roster did not verify in the eval job; the eval runs on the committed roster"
            committed "$1"
          }
          if [ "${ROSTER_SOURCE:-}" != merged ]; then
            # One fixed sentence per reason `roster-wait` can send, never
            # the raw value.
            case "${ROSTER_REASON:-}" in
              not-armed) why="no roster pull request was armed this run (see the roster tracking issue for why)." ;;
              invalid-input) why="the values the roster jobs handed on did not validate." ;;
              timeout)
                why="the armed roster pull request did not merge within this run's bounded wait."
                if [ "${ROSTER_CLEARED:-}" = true ]; then
                  why="$why \`roster-wait\` confirmed, by re-reading it, that its auto-merge is off before this job started."
                fi
                ;;
              closed) why="the armed roster pull request was closed without merging." ;;
              auto-merge-off) why="the roster pull request's auto-merge was turned off before it merged." ;;
              head-moved) why="the roster pull request's head is not the commit this run armed." ;;
              identity) why="the pull request handed on is not this repository's roster pull request." ;;
              verify-failed) why="the roster pull request merged, but the merge did not verify." ;;
              "") why="the \`roster-wait\` job did not run or reported nothing (a dispatch off \`main\`, or that job failed or timed out)." ;;
              *) why="\`roster-wait\` reported an unrecognized outcome." ;;
            esac
            committed "$why"
          fi
          [ -n "$merge_sha" ] || refuse "\`roster-wait\` reported a merge but no valid merge commit."
          [ -n "$head" ] || refuse "this checkout's own commit could not be read."
          proposal="$RUNNER_TEMP/eval-proposed-roster.yml"
          merged="$RUNNER_TEMP/eval-merged-roster.yml"
          rm -f "$proposal" "$merged"
          proposed_b64="${PROPOSED_ROSTER_B64:-}"
          [ -n "$proposed_b64" ] && [ "${#proposed_b64}" -le 43692 ] \
            && [[ "$proposed_b64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] \
            && printf '%s' "$proposed_b64" | base64 -d > "$proposal" 2>/dev/null \
            && [ -s "$proposal" ] \
            || refuse "this run's proposed roster did not decode."
          git fetch --quiet --no-tags origin "$merge_sha" 2>/dev/null \
            || refuse "the merge commit could not be fetched."
          git merge-base --is-ancestor "$head" "$merge_sha" 2>/dev/null \
            || refuse "the merge commit does not descend from this run's commit."
          changed=$(git diff --no-renames --name-only "$merge_sha^1" "$merge_sha" 2>/dev/null) \
            || refuse "the merge commit's change could not be read."
          [ "$changed" = "evals/roster.yml" ] \
            || refuse "the merge commit changes more than \`evals/roster.yml\`."
          git show "$merge_sha:evals/roster.yml" > "$merged" 2>/dev/null \
            || refuse "the merged \`evals/roster.yml\` could not be read."
          cmp -s "$merged" "$proposal" \
            || refuse "the merged \`evals/roster.yml\` is not the roster this run proposed."
          cp "$merged" evals/roster.yml || refuse "the merged roster could not be written."
          {
            echo "### Roster"
            echo
            echo "This eval runs on the roster merged by pull request #${pr:-?} (merge commit \`$merge_sha\`), verified here against this run's proposal; every other file is this run's commit \`$head\` (ADR 0004)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "roster: merged evals/roster.yml from $merge_sha"

      - name: Check out agentskills registry (side-by-side)
        uses: actions/checkout@v7.0.1
        with:
          repository: example-adopter/agentskills
          path: agentskills
          persist-credentials: false

      - name: Check out example-site-platform registry (side-by-side)
        uses: actions/checkout@v7.0.1
        with:
          repository: example-adopter/example-site-platform
          path: example-site-platform
          persist-credentials: false

      - name: Check out example-site-a registry (side-by-side)
        uses: actions/checkout@v7.0.1
        with:
          repository: example-adopter/example-site-a
          path: example-site-a
          persist-credentials: false

      - name: Check out _agent-guidance (side-by-side)
        # NOT a skill registry: this is the guidance subject's source, read by
        # harness/guidance.py through --guidance. Its content is executed
        # under bypassPermissions by a guidance fixture's `with` arm — see the
        # header's trust-boundary clause.
        uses: actions/checkout@v7.0.1
        with:
          repository: example-adopter/_agent-guidance
          path: _agent-guidance
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install Claude Code CLI
        # NOT PINNED, and ALWAYS THE LATEST (the owner's decisions of
        # 2026-09-27, #202, and 2026-09-28, #203): every run installs the
        # newest Claude Code release npm reports, never reusing one already
        # on the runner, and fails if another `claude` on PATH shadows it.
        # scripts/probe_model_defaults.py reads the vendor's alias defaults
        # off this very CLI, so an older one would report older defaults.
        # The pin existed because this step feeds the key-bearing eval step
        # and an install is a supply-chain vector into whatever credential
        # the job later holds. What still bounds that: this step runs BEFORE
        # the OIDC mint / token exchange below, so nothing it installs runs
        # with a credential in the environment at install time (the step
        # order is asserted by test/issues/test_issue_202_harness.py). What
        # replaces the pin's audit trail: the version actually used is
        # recorded per run — here in the step summary, and in every arm's
        # summary.json (`harness.version`) by harness/run_eval.py.
        #
        # `claude --version` is captured whole and cut to its first line in
        # the shell, not piped through `head`: under pipefail a `head` that
        # exits first can fail the step on the CLI's SIGPIPE. A failing or
        # empty version, an unusable npm answer, or a shadowing CLI fails the
        # step by name.
        run: |
          set -euo pipefail
          latest="$(npm view @anthropic-ai/claude-code version)" || { echo "::error::could not resolve the latest Claude Code version"; exit 1; }
          # A plain MAJOR.MINOR.PATCH and nothing else: a prerelease, an error
          # page, an empty answer or two lines is refused, never stripped
          # into something that looks like a version.
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::npm reported no usable latest Claude Code version"; exit 1; }
          npm install -g "@anthropic-ai/claude-code@${latest}"
          version="$(timeout -k 10 60 claude --version)" || { echo "::error::claude --version failed"; exit 1; }
          # First line only, and only characters a version string needs: this
          # lands in a markdown code span in the step summary.
          version="${version%%$'\n'*}"
          version="${version:0:80}"
          version="${version//[^A-Za-z0-9._() -]/}"
          [[ -n "$version" ]] || { echo "::error::claude --version printed no version"; exit 1; }
          # A different claude earlier on PATH would shadow the one just
          # installed. Exact on the first token: a prefix match would pass a
          # stale 2.1.30 for a latest of 2.1.3.
          [[ "${version%% *}" == "$latest" ]] || { echo "::error::claude on PATH is not the npm latest just installed"; exit 1; }
          echo "harness: Claude Code ${version} (npm latest)"
          { echo "### Harness"; echo "Claude Code \`${version}\` (npm latest)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        # markdown-it-py is pinned exact, per this repo's cooling-off
        # convention: harness/guidance.py locates a section's extent with a
        # real markdown parse, and a floating parser version could silently
        # change what a `section` arm delivers.
        run: pip install pyyaml==6.0.3 markdown-it-py==4.2.0 tree-sitter==0.26.0 tree-sitter-bash==0.25.1

      # Runs BEFORE the token exchange, deliberately: a dispatch naming a
      # fixture that does not exist must fail here, with no credential minted
      # and nothing spent. The value is read from the event payload as DATA
      # (jq, no `${{ }}` interpolation into this shell), checked for SHAPE,
      # and only then matched against the set of directories that actually
      # carry a committed fixture.yaml — so a traversal, an absolute path, a
      # shell metacharacter, a newline or a stale name never gets past here.
      # Git's index defines the committed set; untracked fixtures never qualify.
      - name: Select and validate the fixture to run
        # Keep a local step output for offline validation probes. Publishing
        # uses the trusted planner's matching key, revalidated on its own
        # fresh runner; matrix eval outputs are never shared across legs.
        id: select-fixture
        working-directory: skills-evals
        env:
          SCHEDULE_FIXTURE: ${{ github.event_name == 'schedule' && matrix.fixture || '' }}
          MATRIX_KEY: ${{ matrix.eval_key }}
          MATRIX_SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          # Byte semantics for the character class below, so what this gate
          # accepts does not depend on the runner's locale.
          export LC_ALL=C
          fixture="${SCHEDULE_FIXTURE:-}"
          if [ -z "$fixture" ] && [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
            # NUL FIRST, on the event file itself, before any command
            # substitution. `jq -r` emits a NUL faithfully and bash's `$( )`
            # then DROPS it ("warning: command substitution: ignored null
            # byte in input"), so every check below would be judging a string
            # the dispatcher did not send, and the step's own `fixture:` log
            # line would name something else again. Measured: a value whose
            # JSON spelling is the NUL escape followed by
            # evals/workflow-path-audit was accepted AS that fixture, rc 0.
            # It fails safe — no uncommitted fixture can be reached this way,
            # because whatever survives the substitution still has to match a
            # committed path — but the gate never sees the byte it would
            # refuse, and this workflow's header promises that it does.
            # `jq -e` exits non-zero for a non-string (a number, a list) too,
            # which simply falls through to the shape gate that already
            # refuses those. No value is echoed, same as every other
            # rejection here.
            if jq -e '(.inputs.fixture // "") | test("\u0000")' \
                 "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
              echo "eval.yml: dispatch input 'fixture' contains a NUL byte"
              exit 1
            fi
            fixture="$(jq -r '.inputs.fixture // empty' "$GITHUB_EVENT_PATH")"
          fi
          # Dispatch with no input keeps the single-fixture default.
          if [ -z "$fixture" ]; then
            fixture="evals/workflow-path-audit/required-check-routing"
          fi
          # SHAPE FIRST, before any matching. `grep -F` treats each LINE of
          # its pattern as a separate pattern, so a MULTI-LINE dispatch value
          # used to pass this gate whenever either line named a committed
          # fixture — and the whole two-line string was then written to
          # $RUNNER_TEMP/eval-fixture, so the OIDC exchange ran, a real bearer
          # was minted and the WIF preflight spent a call before the run step
          # finally failed on "no such fixture.yaml". Nothing was injectable
          # (every use is quoted) and no uncommitted fixture could run, but
          # the ordering guarantee this header makes twice was false for that
          # value. NEITHER rejection branch echoes the value back: this log
          # is public, so both messages name the rule, not the input. (The
          # "names no committed fixture" branch below used to append
          # `: $fixture` — charset-clean, but still up to 100 KB of dispatch
          # input copied into a public log, and contradicting this very
          # sentence. The dispatched value is already on the run's own inputs
          # for anyone who can read the log at all, so naming it here buys
          # nothing.)
          case "$fixture" in
            *[!A-Za-z0-9/_.-]*)
              echo "eval.yml: dispatch input 'fixture' has characters outside [A-Za-z0-9/_.-]"
              exit 1 ;;
          esac
          committed="$(python3 scripts/plan_scheduled_evals.py --committed)"
          # A here-string, never `printf ... | grep -Fxq`: piping a list into
          # an early-exit reader under `pipefail` makes the writer take
          # SIGPIPE the moment grep matches, and the step then fails CLOSED on
          # a perfectly valid fixture once the list outgrows a pipe buffer.
          # Safe at today's ~250 bytes; measured to reject valid fixtures from
          # ~66 KB of committed list upward.
          if ! grep -Fxq -- "$fixture" <<<"$committed"; then
            echo "eval.yml: dispatch input 'fixture' names no committed fixture"
            echo "Committed fixtures:"
            sed 's/^/  /' <<<"$committed"
            exit 1
          fi
          printf '%s' "$fixture" > "$RUNNER_TEMP/eval-fixture"
          # The results/badge key is the fixture path without its evals/
          # prefix: `workflow-path-audit`, or `guidance/<section id>`.
          key="${fixture#evals/}"
          if [ -n "${MATRIX_KEY:-}" ]; then
            python3 scripts/plan_scheduled_evals.py --validate "$fixture" "$MATRIX_KEY" "$MATRIX_SLOT" >/dev/null
          fi
          printf '%s' "$key" > "$RUNNER_TEMP/eval-key"
          echo "eval_key=$key" >> "$GITHUB_OUTPUT"
          echo "fixture: $fixture"

      - name: Mint OIDC token and exchange for Anthropic access token
        env:
          # The workload identity federation set-up (docs/evals-and-loop.md,
          # "Workload identity federation"); set by bootstrap from fleet.env.
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          [[ "$FEDERATION_RULE_ID" =~ ^fdrl_[A-Za-z0-9]{8,64}$ ]] || { echo "::error::repository variable ANTHROPIC_FEDERATION_RULE_ID is unset or not an fdrl_ id"; exit 1; }
          [[ "$ORGANIZATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::repository variable ANTHROPIC_ORGANIZATION_ID is unset or not an organization uuid"; exit 1; }
          [[ "$SERVICE_ACCOUNT_ID" =~ ^svac_[A-Za-z0-9]{8,64}$ ]] || { echo "::error::repository variable ANTHROPIC_SERVICE_ACCOUNT_ID is unset or not an svac_ id"; exit 1; }
          [[ "$WORKSPACE_ID" =~ ^wrkspc_[A-Za-z0-9]{8,64}$ ]] || { echo "::error::repository variable ANTHROPIC_WORKSPACE_ID is unset or not a wrkspc_ id"; exit 1; }
          resp=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.anthropic.com")
          jq -r .value <<<"$resp" > "$RUNNER_TEMP/anthropic-oidc.jwt"
          test -s "$RUNNER_TEMP/anthropic-oidc.jwt"
          body=$(jq -n --rawfile jwt "$RUNNER_TEMP/anthropic-oidc.jwt" \
            --arg rule "$FEDERATION_RULE_ID" --arg org "$ORGANIZATION_ID" \
            --arg svac "$SERVICE_ACCOUNT_ID" --arg wrkspc "$WORKSPACE_ID" '{
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
            assertion: ($jwt | rtrimstr("\n")),
            federation_rule_id: $rule,
            organization_id: $org,
            service_account_id: $svac,
            workspace_id: $wrkspc
          }')
          xresp="$RUNNER_TEMP/exchange-resp.json"
          code=$(curl -sS -o "$xresp" -w "%{http_code}" -X POST https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" -d "$body")
          if [ "$code" != "200" ]; then
            # The status and the error type only: the body is not logged.
            etype=$(jq -r '(.error.type? // .error? // empty) | strings' < "$xresp" 2>/dev/null) || etype=""
            [[ "$etype" =~ ^[A-Za-z0-9_.-]{1,64}$ ]] || etype=unknown
            rm -f "$xresp"
            echo "token exchange failed: HTTP $code, error type $etype"
            exit 1
          fi
          tok=$(jq -re .access_token < "$xresp")
          rm -f "$xresp"
          echo "::add-mask::$tok"
          printf '%s' "$tok" > "$RUNNER_TEMP/anthropic-bearer"

      # Cheap canary validating the exchanged bearer before the real spend,
      # on the model the roster names as `preflight` — the cheapest the Models
      # API still returns. That entry used to be computed and consumed by
      # nothing while this step hardcoded a model of its own.
      #
      # THE COMMITTED FILE, not the computed one (ADR 0001, #147). The
      # preflight used to read `$RUNNER_TEMP/roster/latest.json` — this
      # run's own proposal, computed partly from an untrusted census — so a
      # census plant could choose which model the job canaried its bearer
      # against. `evals/roster.yml` is on `main`, behind a commit that
      # passed the required `test` check — merged by a human under
      # `roster_mode: proposal`, but automatically, with no human review,
      # under `roster_mode: auto` (ADR 0003), and possibly by this very run
      # (ADR 0004, overlaid by the step above after it verified).
      #
      # The literal below is the documented ROSTER FALLBACK, and it is the
      # only model id in this file. It is used when the committed roster
      # cannot be read, AND as the one retry when the roster's own
      # preflight pick fails (a day-old cheapest-tier model can be past the
      # roster's cooling-off check yet still not entitled for this bearer) —
      # `test_no_model_ids_are_hardcoded_outside_fixtures` allows exactly one
      # such literal and only because the marker on its line says what it is.
      - name: WIF auth preflight
        # Skipped by a roster_only dispatch (#202). An expression in `if:`, never
        # interpolated into a run: body.
        if: ${{ !inputs.roster_only }}
        working-directory: skills-evals
        run: |
          set +e
          fallback="claude-haiku-4-5" # ROSTER FALLBACK: used when no roster, and retried once if the roster's preflight model fails
          model="$fallback"
          if [ -f evals/roster.yml ]; then
            from_roster=$(python3 -c 'import yaml,sys; d=yaml.safe_load(open(sys.argv[1])) or {}; p=(d.get("preflight") or {}).get("id"); print(p if isinstance(p, str) else "")' evals/roster.yml 2>/dev/null)
            if [ -n "$from_roster" ]; then model="$from_roster"; fi
          fi
          ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/anthropic-bearer")"
          export ANTHROPIC_AUTH_TOKEN
          echo "preflight model: $model"
          # The judge's isolation (harness/scorers/judge.py JUDGE_ISOLATION_FLAGS
          # plus auto-memory off), so the preflight proves the same launch.
          out=$(CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 timeout 120 claude -p 'Reply with exactly: ok' \
            --model "$model" --output-format json \
            --setting-sources "" --strict-mcp-config --no-session-persistence 2>&1)
          rc=$?
          echo "preflight exit: $rc"
          printf '%s\n' "$out" | tail -c 4000
          if [ "$rc" -ne 0 ] && [ "$model" != "$fallback" ]; then
            echo "::warning::preflight failed on roster model $model; retrying with the fallback"
            model="$fallback"
            echo "preflight model: $model"
            out=$(CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 timeout 120 claude -p 'Reply with exactly: ok' \
              --model "$model" --output-format json \
              --setting-sources "" --strict-mcp-config --no-session-persistence 2>&1)
            rc=$?
            echo "preflight exit: $rc"
            printf '%s\n' "$out" | tail -c 4000
          fi
          exit $rc

      # `--arm both` means "every arm this fixture declares": the two arms of
      # a skill fixture, and for a guidance fixture the arms it names (five,
      # one per delivery mode, for the delivery canary).
      - name: Run the eval (both arms, judge)
        # `id: eval` (#203 probe round 3). B1 (round 3 on #209) routed the
        # eval's outcome to the tracking-issue text through the `roster-pr`
        # job; ADR 0004 moved that job before this one, so the outcome now
        # reaches people through this run's summary and `publish` alone.
        id: eval
        # Skipped by a roster_only dispatch (#202). An expression in `if:`, never
        # interpolated into a run: body.
        if: ${{ !inputs.roster_only }}
        working-directory: skills-evals
        run: |
          ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/anthropic-bearer")"
          export ANTHROPIC_AUTH_TOKEN
          fixture="$(cat "$RUNNER_TEMP/eval-fixture")"
          # `--permission-mode bypassPermissions` keeps this paid path launching
          # its arms and judge exactly as every run before the harness default
          # became `auto` (#71), so the badge window stays like-for-like. Moving
          # it to `auto` is an owner decision, not a side effect.
          python3 harness/run_eval.py "$fixture" \
            --arm both \
            --permission-mode bypassPermissions \
            --run-billing api --run-runner actions --run-location cloud \
            --guidance ../_agent-guidance \
            --registry agentskills=../agentskills \
            --registry example-site-platform=../example-site-platform \
            --registry example-site-a=../example-site-a

      # Only successful legs provide a publishable payload. Partial output is
      # diagnostic, with a separate name publishers never download.
      #
      # Both uploads name an ALLOWLIST, never the whole results/ tree (#289):
      # this repository is public, so anyone signed in can download a workflow
      # artifact. Each arm's transcripts/raw.json is the CLI's unredacted
      # result, which the forwarded ANTHROPIC_ credential could reach, so it
      # stays on the runner. What is uploaded: summary.json (the scores and
      # every check's detail, all `publish` and make_badge.py read), the run's
      # report.md, and transcripts/tool_trace.json, which cli_json.redact
      # scrubs before it is written. All three patterns share the search root
      # skills-evals/results, so the artifact keeps the results/ layout the
      # `publish` download expects. No file the harness writes is hidden, so
      # hidden files stay excluded (the action's default).
      - name: Upload eval results
        if: ${{ success() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: eval-results-payload-${{ matrix.slot }}-${{ github.run_attempt }}
          path: |
            skills-evals/results/**/summary.json
            skills-evals/results/**/report.md
            skills-evals/results/**/transcripts/tool_trace.json
          if-no-files-found: error
          include-hidden-files: false
      - name: Upload eval diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: eval-results-diagnostics-${{ matrix.slot }}-${{ github.run_attempt }}
          path: |
            skills-evals/results/**/summary.json
            skills-evals/results/**/report.md
            skills-evals/results/**/transcripts/tool_trace.json
          if-no-files-found: ignore
          include-hidden-files: false

  # B1 (round 4 on #209, blocker): the badge/results commit-and-push,
  # relocated off the `eval` job to a runner the agent never touches. See
  # the header comment above for the full rationale.
  publish:
    # S1 (ADR 0004): gated on `roster-wait`'s confirmation exactly as
    # `eval` is — `contents: write` never runs beside an arming that was
    # not confirmed cleared, even if `eval`'s own gate ever drifted.
    # A matrix leg that exceeds `timeout-minutes` may be reported as
    # cancelled rather than failed, and a matrix with no failed leg but a
    # cancelled one aggregates to `cancelled`. `eval.result` may therefore be
    # success, failure, or cancelled when only some legs ended badly, and
    # `!cancelled()` (true unless the whole run was cancelled) is what stops
    # publication on a real cancellation. Only `skipped` keeps this job from
    # running, so one timed-out leg cannot discard its siblings' results.
    needs: [plan, roster, eval, roster-wait]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.eval.result == 'success' || needs.eval.result == 'failure' || needs.eval.result == 'cancelled') && (needs.roster-wait.result == 'skipped' || needs.roster-wait.outputs.cleared == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Fresh — never the `eval` job's checkout, which the agent shared a
      # filesystem with. `ref:` is explicit even though it matches the
      # default, so this checkout can never silently drift onto a `main`
      # that moved between this run's trigger and `publish` starting.
      - name: Check out skills-evals
        uses: actions/checkout@v7.0.1
        with:
          path: skills-evals
          ref: ${{ github.sha }}
          # Full history so the accumulated-window badge build and the
          # persistent/eval-results branch switch below always have the commits they
          # need; this repo is small.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Validate the publishing fixture and key
        id: fixture
        working-directory: skills-evals
        env:
          FIXTURE: ${{ matrix.fixture }}
          EVAL_KEY: ${{ matrix.eval_key }}
          SLOT: ${{ matrix.slot }}
        run: python3 scripts/plan_scheduled_evals.py --validate "$FIXTURE" "$EVAL_KEY" "$SLOT" >> "$GITHUB_OUTPUT"

      - name: Download eval results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: eval-results-payload-${{ matrix.slot }}-${{ github.run_attempt }}
          path: skills-evals/results

      - name: Report a missing success payload
        if: ${{ steps.download.outcome == 'failure' }}
        env:
          EVAL_RESULT: ${{ needs.eval.result }}
        run: |
          echo "This fixture has no downloadable success payload; publishing is skipped." >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVAL_RESULT" = success ]; then
            echo "::error::Successful eval matrix is missing a success payload"
            exit 1
          fi

      # Badge generation, commit and push are ONE step because the badge's
      # window can only see the accumulated history, and that history exists
      # nowhere until the `persistent/eval-results` checkout below has happened. This
      # workflow used to build the badge in a step of its own, ahead of the
      # commit step — which ran make_badge.py against the fresh workspace,
      # where results/ holds only the run that just finished. The `--window N`
      # average could therefore never draw on more than one run: the
      # aggregation was structurally inert and every published badge quietly
      # reported a single run (the `n=` marker only appears above one run, so
      # its absence was the only symptom). The ordering here is load-bearing —
      # fetch and check out `persistent/eval-results`, restore the fresh run into
      # results/, and only THEN build the badge, so the window spans the real
      # run history. Note also that the `persistent/eval-results` branch carries no
      # scripts/ directory, so the branch switch takes make_badge.py out of the
      # working tree; it is stashed in $RUNNER_TEMP beforehand and invoked
      # from there — from THIS job's own fresh checkout, never from the
      # downloaded artifact (B1, round 4 on #209): the artifact is the
      # `eval` job's raw, untrusted-exactly-like-everything-else-on-
      # persistent/eval-results output, and it must never be able to substitute its
      # own copy of the script that builds the badge. It is stdlib-only, so
      # nothing else has to travel with it.
      - name: Build the badge over the run window, commit, and push
        if: ${{ steps.download.outcome == 'success' }}
        working-directory: skills-evals
        env:
          # Push auth lives only in this step.
          GITHUB_TOKEN: ${{ github.token }}
          # B1 (round 3 on #209, carried by round 4 into this job): the
          # `roster` job's own computed roster, threaded through as a job
          # output rather than a shared file — this job has no checkout of
          # the `roster` job's runner at all. An EXHIBIT copy only (ADR
          # 0001, decision 3: `roster/latest.json` is read by no
          # decision); empty when the roster job published nothing this
          # run.
          ROSTER_LATEST_JSON: ${{ needs.roster.outputs.roster_latest_json }}
          # The fixture's results/badge key is independently validated against
          # Git's committed set in THIS job's fresh checkout, using the
          # trusted plan key, never a matrix eval job's last output.
          EVAL_KEY: ${{ steps.fixture.outputs.eval_key }}
        run: |
          set -euo pipefail
          git config user.name "skills-evals real-eval bot"
          git config user.email "skills-evals@users.noreply.github.com"
          # Stash the badge script before the branch switch drops scripts/.
          cp scripts/make_badge.py "$RUNNER_TEMP/"
          # Snapshot the downloaded results (results/ is new/untracked
          # here, and is tracked on persistent/eval-results — without this the branch
          # switch would clobber or refuse the downloaded output)
          snap="$RUNNER_TEMP/eval-outputs"
          rm -rf "$snap"; mkdir -p "$snap"
          [ -d results ] && cp -r results "$snap/results"
          # Build on the accumulated results branch (create on first run)
          git checkout -- .
          git fetch origin persistent/eval-results || true
          if git rev-parse -q --verify origin/persistent/eval-results >/dev/null; then
            git checkout -B persistent/eval-results origin/persistent/eval-results
          else
            git checkout -B persistent/eval-results
          fi
          [ -d "$snap/results" ] && { mkdir -p results; cp -r "$snap/results/." results/; }
          # The `roster` job's own computed roster (B1, round 3 on #209):
          # threaded through `needs.roster.outputs.roster_latest_json`
          # rather than a shared file, since that job runs on a separate
          # runner. Refreshing the roster is non-fatal there, so there may
          # be none — in which case nothing is committed for it and the
          # summary says why.
          if [ -n "${ROSTER_LATEST_JSON:-}" ]; then
            mkdir -p roster
            # N4 (round 4 on #209): harness/roster.py always writes this
            # file with a trailing newline; the GITHUB_OUTPUT multiline
            # round-trip (emit_ml's `content="$(cat)"`) strips it on the
            # way through, so it is put back here explicitly — `printf
            # '%s\n'`, not `'%s'` — rather than silently publishing a
            # roster/latest.json byte-different from what was computed.
            printf '%s\n' "$ROSTER_LATEST_JSON" > roster/latest.json
          else
            echo "No roster was published this run — see the roster job's warning." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          # Build this validated fixture's badge over the accumulated window.
          python3 "$RUNNER_TEMP/make_badge.py" "$EVAL_KEY"
          git add badges results
          # -f is load-bearing: .gitignore lists roster/ and usage/ so a stray
          # local copy cannot ride into a main-branch PR. They ARE tracked here
          # on persistent/eval-results, and a plain `git add` would silently skip them.
          if [ -d roster ]; then git add -f roster; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # Re-validated at this job boundary, matching the `eval` job's
          # own gate; an empty or malformed value falls back to a fixed
          # literal rather than ever reaching the commit message unchecked.
          key="unknown-fixture"
          case "${EVAL_KEY:-}" in
            ''|*[!A-Za-z0-9/_.-]*) : ;;
            *) key="$EVAL_KEY" ;;
          esac
          git commit -m "eval: $key run + badge + roster [skip ci]"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" push origin persistent/eval-results

  # F2 (adversarial round 1 on #209): everything that touches the
  # `roster/proposal` pull request — find/create/edit/close/merge it, and
  # dispatch `ci.yml` on it — lives in this job, never in `roster` or
  # `eval`, so `pull-requests: write` and `actions: write` are never in
  # reach of the `eval` job's bypass-permissions agent (B1, round 3 on
  # #209: nor of anything the `roster` job's own runner might have been
  # left carrying). Runs on EVERY run on `main` (`needs: [roster, disarm]`
  # — BEFORE the eval since ADR 0004, see the `needs:` comment below —
  # `if: !cancelled()`), `roster_mode: proposal` included and a failed "Propose
  # a roster change" step (or the whole `roster` job) included (F3): a
  # stale `roster/proposal` PR's auto-merge must come off — or the PR must
  # be closed, if the committed roster no longer differs — whether or not
  # this run's propose step reached the auto path, or reached anything at
  # all, and whether or not `eval` ran this dispatch at all (`roster_only`).
  # See the workflow-level `permissions:` comment above for the job's own
  # scope and why it also carries `issues: write`.
  roster-pr:
    # ADR 0004 (2026-09-30): BEFORE the eval, not after it. This job arms
    # auto-merge with `--match-head-commit`, which GitHub checks only when
    # auto-merge is ENABLED — so no job holding a write credential may still
    # be running once the PR is armed. Round 5 got that by running this job
    # LAST, after `publish`; now it runs after `roster` and `disarm` (both
    # finished, `disarm` so it cannot turn off the arming this job does),
    # and every job after it that holds a write credential waits for
    # `roster-wait`, which resolves the arming (merged, or auto-merge turned
    # off) before the `eval` job — and so `publish` — can start. `if:
    # !cancelled()` (below) means a failed `disarm` never blocks this job.
    needs: [roster, disarm]
    # B1.4 (round 2, spec-roster-mode-r2.md): only on `main` — a dispatch on
    # any other ref never has a `$GITHUB_SHA` worth trusting as "the
    # committed policy", so this job (and the auto-merge surface it alone
    # holds) never runs for one.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Round 6 (ADR 0003, "the roster PR is the App's"): GITHUB_TOKEN here
    # no longer opens, reopens or arms anything — the roster App's
    # installation token (the step below) does. What stays on GITHUB_TOKEN:
    # `pull-requests: write` for turning a stale PR's auto-merge OFF and for
    # closing a stale PR on "same" (both paths every mode reaches, proposal
    # included); `issues: write` for the tracking issue; `contents: read`
    # for the policy/ref/compare/tree reads (round 7: the publish's writes
    # are the App's, never GITHUB_TOKEN's). `actions: write` went with the
    # `gh workflow run ci.yml` dispatch (a dispatched `test` never satisfied
    # the PR's required check), and `contents: write` went with arming
    # auto-merge, which is the App's now.
    permissions:
      pull-requests: write
      issues: write
      contents: read
    # ADR 0004: what `roster-wait` needs to know about this job's arming.
    # Written by the manage step only once auto-merge is actually ENABLED
    # on this run's own published commit (`armed` is then the literal
    # `true`, `pr_number` digits, `pushed_sha` 40-hex); on every other path
    # they stay empty, which `roster-wait` reads as "nothing armed".
    outputs:
      armed: ${{ steps.manage.outputs.armed }}
      pr_number: ${{ steps.manage.outputs.pr_number }}
      pushed_sha: ${{ steps.manage.outputs.pushed_sha }}
    steps:
      # Pinned 3.12 like the other jobs, not the runner's system Python.
      # The manage step parses roster YAML, so PyYAML is installed here too,
      # exact: this job's next step holds the roster App token. 6.0.3 is the
      # newest release (2025-09-25), long past the 7-day cooling-off.
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install roster dependency
        run: pip install pyyaml==6.0.3
      # Round 6: a GitHub App installation token, minted ONLY in this job.
      # The App (installed on skills-evals alone: Contents R/W, Pull
      # requests R/W, NOT a bypass actor of `main`'s ruleset) is what
      # publishes `roster/proposal` (round 7; the one bypass actor, beside
      # repository admins, of the ruleset that confines that ref) and what
      # opens, closes/reopens and arms the roster PR, so the PR's own `pull_request` run
      # of `test` is triggered by the App — not by `github-actions[bot]`,
      # whose PRs' runs GitHub holds for approval (run 36509304069,
      # `action_required`). Its key must never be in a job that runs the
      # npm-latest CLI or the agent: `roster`, `disarm`, `eval` and
      # `publish` never reference it (TestRosterAppTokenIsConfined).
      # `continue-on-error`: an App that is missing, uninstalled or
      # misconfigured leaves `outputs.token` empty, and the step below then
      # publishes nothing and puts the rendered file in the tracking issue
      # for a human — it never falls back to publishing, opening or arming
      # with GITHUB_TOKEN.
      - name: Mint the roster App token
        id: roster-app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.ROSTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROSTER_APP_PRIVATE_KEY }}
          owner: example-adopter
          repositories: skills-evals
          permission-contents: write
          permission-pull-requests: write
      - name: Manage the roster pull request
        id: manage
        # Nothing here interpolates a GitHub Actions expression into the
        # shell; every `needs.roster.outputs.*` value arrives through
        # `env:` and is re-validated below before this job's own shell
        # reads it — the `roster` job already validated each before
        # emitting it, but the boundary between two jobs is exactly where
        # "validate again" earns its keep (adversarial round 1 on #209's
        # own hard constraint).
        #
        # ROUND 2 (spec-roster-mode-r2.md, B1, blocker), extended by B1
        # (round 3 on #209): the `roster` job is a TRUSTED job (no agent
        # ever runs in it; the `eval` job's bypass-permissions agent runs on
        # a SEPARATE runner this job never shares with it), so its outputs
        # are trusted-job outputs — validated at the job boundary anyway, as
        # defence in depth, never assumed clean. What this step establishes
        # from GitHub's own API and `$GITHUB_SHA` (the triggering commit on
        # `main`, never the `roster` job's checkout) is the auto decision
        # and the IDENTITY of what gets armed: `verify_publish` checks
        # identity (branch head == `$pushed_sha`, the commit this job's own
        # publish created — round 7), shape (one commit ahead of its parent,
        # live `main`, none behind, exactly `evals/roster.yml` modified), and
        # the commit's author and message — not content; content equality
        # rests on that sha identity.
        # `ROSTER_MODE` below is therefore read but never trusted for the
        # auto decision — `roster_mode` (the decision variable) comes from
        # a fresh, independent read of `evals/roster-policy.yml` AT
        # `$GITHUB_SHA` via the contents API (B1.1); the published branch's
        # actual head is re-read from the API and required to equal
        # `$pushed_sha` (B1.2); and `$publish_base...$pushed_sha` must
        # compare as exactly one commit ahead, none behind, touching only
        # `evals/roster.yml` (B1.3) before this job will enable auto-merge.
        # B1.4's main-ref gate lives on the job itself, above.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          # Round 6: the App token, under its OWN name rather than as the
          # step's GH_TOKEN. Step-wide, it would move every call here onto
          # the App (which has no `issues` permission), and an EMPTY
          # GH_TOKEN makes `gh` fall back to GITHUB_TOKEN silently — the one
          # fallback this job must never take for create/reopen/arm. The
          # script hands it to exactly the calls that need it, as a
          # per-command GH_TOKEN (`app_gh` below).
          ROSTER_APP_TOKEN: ${{ steps.roster-app-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          ROSTER_MODE: ${{ needs.roster.outputs.roster_mode }}
          STATUS: ${{ needs.roster.outputs.status }}
          PROBE_CLEAN: ${{ needs.roster.outputs.probe_clean }}
          ISSUE_NUMBER: ${{ needs.roster.outputs.issue_number }}
          # Round 7: the rendered file (base64 of its exact bytes) and the
          # sha it was rendered against — this job publishes the commit.
          PROPOSED_ROSTER_B64: ${{ needs.roster.outputs.proposed_roster_b64 }}
          BASE_SHA: ${{ needs.roster.outputs.base_sha }}
          REJECTED: ${{ needs.roster.outputs.rejected }}
          REJECTION_REASON: ${{ needs.roster.outputs.rejection_reason }}
          RENDERED_IDENTICAL: ${{ needs.roster.outputs.rendered_identical }}
          PROBE_NOTE: ${{ needs.roster.outputs.probe_note }}
          ROSTER_SUMMARY: ${{ needs.roster.outputs.roster_summary }}
        run: |
          set -uo pipefail
          export REPO
          # >>> input-parsing (N1, round 2): every `needs.roster.outputs.*`
          # value re-validated the moment it crosses the job boundary,
          # before anything downstream reads it. Fragment-tested directly
          # (`TestN1HostileValidation`'s fragment tests) rather than only
          # through the higher-level attempt gate, since several of these
          # are now ALSO defended in depth by B1's independent checks —
          # testing the parse itself is what actually kills a mutation
          # that a downstream check would otherwise mask.
          github_sha=""
          if [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then github_sha="$GITHUB_SHA"; fi
          status=""
          case "${STATUS:-}" in same|differs) status="$STATUS" ;; esac
          probe_clean=false
          case "${PROBE_CLEAN:-}" in true) probe_clean=true ;; esac
          issue=""
          case "${ISSUE_NUMBER:-}" in ''|*[!0-9]*) : ;; *) issue="$ISSUE_NUMBER" ;; esac
          # Round 7: the sha the `roster` job rendered against. The
          # proposal's own bytes (PROPOSED_ROSTER_B64) are validated where
          # they are decoded, in publish-proposal below.
          base_sha=""
          if [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then base_sha="$BASE_SHA"; fi
          # Set ONLY by this job's own publish below, to the commit the
          # roster App's token created and pointed `roster/proposal` at —
          # never read from another job.
          pushed_sha=""
          rejected=false
          case "${REJECTED:-}" in true) rejected=true ;; esac
          # One of exactly two fixed sentences the eval job's propose step
          # can send (never arbitrary tool stderr); anything else falls
          # back to empty rather than being trusted verbatim.
          rejection_reason=""
          case "${REJECTION_REASON:-}" in
            "Rendering was rejected because the computed proposal could not be rendered safely."| \
            "Admission was rejected because the rendered proposal does not meet the committed-roster contract.")
              rejection_reason="$REJECTION_REASON" ;;
          esac
          rendered_identical=false
          case "${RENDERED_IDENTICAL:-}" in true) rendered_identical=true ;; esac
          # <<< input-parsing

          # >>> app-token (round 6): the roster App's installation token,
          # from the mint step above. Empty — the App is missing,
          # uninstalled or misconfigured, and that step failed under
          # `continue-on-error` — or anything but one plain token word,
          # and it is treated as unavailable. `app_gh` is the ONLY way this
          # script uses it: GH_TOKEN for that one command, GITHUB_TOKEN
          # emptied beside it, so a call routed here can never quietly run
          # as `github-actions[bot]` instead.
          app_token=""
          case "${ROSTER_APP_TOKEN:-}" in
            ''|*[!A-Za-z0-9_.-]*) : ;;
            *) app_token="$ROSTER_APP_TOKEN" ;;
          esac
          app_gh() {
            GH_TOKEN="$app_token" GITHUB_TOKEN="" gh "$@"
          }
          # <<< app-token
          marker='<!-- skills-evals:roster-proposal -->'

          # >>> text-allowlist (N2, round 2): `eval_note`/`probe_note` are
          # allow-listed against exactly the fixed sentences the `eval`
          # job's propose step can emit — never trusted verbatim, since
          # other text this job renders is shaped by the untrusted census
          # (ADR 0003's Consequences section). A value that does not match
          # falls back to empty rather than being printed.
          # >>> eval-note (ADR 0004, 2026-09-30): this job runs BEFORE the
          # `eval` job now, so it cannot know how the eval turned out (it
          # used to read the `eval` job's result); the sentence says what WILL
          # happen instead. `roster_only` is re-derived from the event
          # payload rather than trusted from the `roster` job, matching how
          # that job's OWN same/frozen-same bodies decide it. The eval's
          # outcome, and which roster it actually ran on and why, are in the
          # run's summary (the `roster-wait` and `eval` jobs).
          roster_only=false
          if [ -f "${GITHUB_EVENT_PATH:-}" ] && jq -e '(.inputs.roster_only // false) | . == true or . == "true"' "$GITHUB_EVENT_PATH" > /dev/null 2>&1; then
            roster_only=true
          fi
          if [ "$roster_only" = true ]; then
            eval_note="This was a \`roster_only\` dispatch: no eval ran, and nothing from this run is published to \`persistent/eval-results\`. Its only outputs are the \`roster/proposal\` branch and this issue; where the summary below says the eval runs on the committed roster, no eval ran at all."
          else
            eval_note="The paid eval runs after this job, in a later job of this run: on this run's merged roster if this run armed the roster pull request and it merged within the run's bounded wait (ADR 0004), and on the committed \`evals/roster.yml\` otherwise. The run summary says which roster it used and why, and whether its results were published to \`persistent/eval-results\`."
          fi
          # <<< eval-note
          probe_note="${PROBE_NOTE:-}"
          probe_note_ok=true
          if [ -n "$probe_note" ]; then
          probe_note_ok=$(printf '%s' "$probe_note" | python3 -c '
          import re
          import sys
          FAILED = (r"\*\*The vendor-default probe failed for (\d+) (family|families) this run\.\*\* "
                     r"Their seats were held and none retired except models gone from the Models API; "
                     r"a family of theirs gained a seat only if it held none the Models API still lists\. "
                     r"The summary below names each family and its error class\. Nothing is carried over: "
                     r"the next run'"'"'s probe decides afresh\.")
          MISMATCH = (r"\*\*A vendor default did not match this run'"'"'s catalogue for (\d+) (family|families) "
                       r"this run\.\*\* Their seats were held and none retired except models gone from the "
                       r"Models API; a family of theirs gained a seat only if it held none the Models API "
                       r"still lists\. The summary below names each family and its mismatch class\. Nothing "
                       r"is carried over: the next run'"'"'s probe decides afresh\.")
          def agrees(m):
              n, word = m.group(1), m.group(2)
              return (word == "family") == (n == "1")
          text = sys.stdin.read()
          parts = text.split("\n\n")
          ok = False
          if len(parts) == 1:
              for pattern in (FAILED, MISMATCH):
                  m = re.fullmatch(pattern, parts[0])
                  if m and agrees(m):
                      ok = True
          elif len(parts) == 2:
              mf = re.fullmatch(FAILED, parts[0])
              mm = re.fullmatch(MISMATCH, parts[1])
              ok = bool(mf and mm and agrees(mf) and agrees(mm))
          print("true" if ok else "false")
          ' 2>/dev/null) || probe_note_ok=false
          fi
          case "$probe_note_ok" in true) : ;; *) probe_note="" ;; esac
          # <<< text-allowlist

          roster_summary="${ROSTER_SUMMARY:-}"
          # N2: the census-shaped summary's "Nothing changes until a human
          # merges it" sentence is only true under `roster_mode: proposal`
          # — swapped for an accurate one wherever this job builds the
          # AUTO pull request's own body (the tracking issue keeps the
          # unmodified summary; its own surrounding text already says
          # whether a human or the automation is expected to act). ADR 0004:
          # the replacement says the eval that follows runs on this proposal
          # when it merges within the run's bounded wait.
          auto_summary=$(printf '%s' "$roster_summary" | sed \
            "s/Nothing changes until a human merges it; the eval runs on the committed roster, as it always does\\./This proposal merges automatically once \`test\` passes on it (\`roster_mode: auto\`); if it merges within the run's bounded wait, this run's eval runs on it (ADR 0004), and otherwise on the committed roster./")

          # >>> policy-read (B1.1, round 2; N9, round 3 on #209): the
          # auto/proposal decision comes ONLY from the committed policy,
          # read fresh here — never from `$ROSTER_MODE` (the `roster` job's
          # own output, logged below but never trusted for the decision
          # itself, since a compromised `roster` job could forge it). Read
          # TWICE — at the trusted, fixed `$GITHUB_SHA` AND at whatever
          # `main` currently is — because `$GITHUB_SHA` is fixed at
          # dispatch time: a policy edit that landed on `main` AFTER this
          # run's trigger commit but BEFORE `roster-pr` runs (setting
          # `roster_mode: proposal`, say, to pull the emergency brake)
          # would never be seen at `$GITHUB_SHA` alone. `auto` requires
          # BOTH reads to say `auto`; either one saying anything else
          # (including unreadable) falls back to `proposal`.
          read_policy_mode() {
            local ref="$1" content b64
            content=""
            if [ -n "$ref" ]; then
              b64=$(gh api "repos/$REPO/contents/evals/roster-policy.yml?ref=$ref" \
                    --jq .content 2>/dev/null) || b64=""
              if [ -n "$b64" ]; then
                content=$(printf '%s' "$b64" | base64 -d 2>/dev/null) || content=""
              fi
            fi
            printf '%s' "$content" | python3 -c '
          import sys
          import yaml
          try:
              doc = yaml.safe_load(sys.stdin.read())
          except Exception:
              doc = None
          value = doc.get("roster_mode") if isinstance(doc, dict) else None
          print(value if isinstance(value, str) else "")
          ' 2>/dev/null
          }
          eval_roster_mode=""
          case "${ROSTER_MODE:-}" in auto) eval_roster_mode="auto" ;; esac
          policy_mode_sha=$(read_policy_mode "$github_sha") || policy_mode_sha=""
          echo "roster_mode (policy at \$GITHUB_SHA): raw=${policy_mode_sha:-<empty>}"
          # Short-circuit: `main` is read ONLY when `$GITHUB_SHA` alone
          # already says `auto` — the AND below can never end up `auto`
          # otherwise, so skipping it saves a call, and with no (or an
          # invalid) `$GITHUB_SHA` this makes NOTHING read at all, exactly
          # like the single-ref design before N9 (test_no_github_sha_falls_
          # back_to_proposal_without_reading_anything).
          policy_mode_main=""
          # S1 (round 4 on #209): resolve live `main` to an explicit,
          # validated sha before reading anything at it, rather than
          # trusting the contents API's own `?ref=main` resolution
          # silently — the resolved sha is echoed, so a run's log names
          # exactly which commit its "live main" read came from. Round 7:
          # the same resolved sha is the parent of the proposal commit this
          # job publishes below (resolved there if this read never ran).
          resolve_live_main() {
            local sha
            sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha 2>/dev/null) || sha=""
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then sha=""; fi
            printf '%s' "$sha"
          }
          main_sha=""
          main_resolved=false
          if [ "$policy_mode_sha" = auto ]; then
            main_sha=$(resolve_live_main) || main_sha=""
            main_resolved=true
            echo "live main resolved to: ${main_sha:-<unresolved>}"
            policy_mode_main=$(read_policy_mode "$main_sha") || policy_mode_main=""
            echo "roster_mode (policy at live main): raw=${policy_mode_main:-<empty>}"
          fi
          # N9: `auto` only if BOTH reads say `auto`. A genuinely malformed
          # value (neither auto/proposal/missing) at EITHER ref still warns
          # exactly as a single-ref read used to; a missing key or an
          # explicit `proposal` at either ref falls back to `proposal`
          # silently, same as before — this is a stricter AND on `auto`,
          # never a new way to reach `auto`.
          policy_mode=""
          case "$policy_mode_sha" in ""|auto|proposal) : ;; *) policy_mode=bad ;; esac
          case "$policy_mode_main" in ""|auto|proposal) : ;; *) policy_mode=bad ;; esac
          if [ -z "$policy_mode" ]; then
            if [ "$policy_mode_sha" = auto ] && [ "$policy_mode_main" = auto ]; then
              policy_mode=auto
            else
              policy_mode=proposal
            fi
          fi
          case "$policy_mode" in
            auto|proposal) roster_mode="$policy_mode" ;;
            *)
              echo "::warning::roster_mode is not auto or proposal; using proposal"
              roster_mode="proposal"
              ;;
          esac
          echo "roster_mode (policy at \$GITHUB_SHA): $roster_mode"
          if [ -n "$eval_roster_mode" ]; then
            echo "roster_mode (eval job's own output, informational only): $eval_roster_mode"
          fi
          # <<< policy-read

          # F1 (blocker): never match a fork's same-named branch. S4
          # (round 2): the lookup itself is now server-side —
          # `?head=<owner>:roster/proposal` filters by branch name at
          # GitHub, and the `--jq` filter re-asserts the SAME repo by full
          # name from `env.REPO` (never a client-side boolean GitHub
          # computed) before anything is taken off the list; a non-digit
          # (or empty) answer is treated exactly like "no open PR", never
          # interpolated further.
          find_roster_pr() {
            local raw
            # N15 (round 3 on #209): the server-side `head=` filter above is
            # not trusted alone — re-asserted client-side by BOTH the same
            # repo (F1) and the exact branch name, so a same-repo PR merely
            # opened from some OTHER branch can never be matched here.
            if ! raw=$(gh api "repos/$REPO/pulls?state=open&base=main&head=${REPO%%/*}:roster/proposal" \
                        --jq '[.[] | select(.head.repo.full_name == env.REPO and .head.ref == "roster/proposal")] | .[0].number // empty' \
                        2>/dev/null); then
              return 1
            fi
            case "$raw" in
              ''|*[!0-9]*) printf '' ;;
              *) printf '%s' "$raw" ;;
            esac
          }

          # >>> publish-verify (B1.2 + B1.3, round 2): re-derive, from the
          # API alone, that `$pushed_sha` really is `roster/proposal`'s
          # current head and really is exactly one commit ahead of
          # `$publish_base`, changing only `evals/roster.yml`. Round 7: both
          # are this job's own — the commit its publish created and the live
          # `main` it was parented on — so this now catches anything that
          # moved the ref or shaped the commit between that write and here.
          verify_publish() {
            local actual_head compare_json ok
            actual_head=$(gh api "repos/$REPO/git/ref/heads/roster/proposal" \
                          --jq .object.sha 2>/dev/null) || actual_head=""
            if ! [[ "$actual_head" =~ ^[0-9a-f]{40}$ ]]; then actual_head=""; fi
            if [ -z "$actual_head" ] || [ "$actual_head" != "$pushed_sha" ]; then
              printf 'head'
              return 1
            fi
            # Round 7: against the parent this job itself published on
            # (`$publish_base`, live `main` resolved and validated above),
            # not `$GITHUB_SHA` — the commit is built on live `main` now.
            compare_json=$(gh api "repos/$REPO/compare/$publish_base...$pushed_sha" 2>/dev/null) \
              || compare_json=""
            # Should-fix 1 (round 3 on #209): the single commit's own
            # message and author must equal exactly what the publish below
            # commits with (round 7: this job's own git-data commit, no
            # longer the `roster` job's) — never accepted as free-form text
            # otherwise. Defence in depth, so a closing keyword or an
            # `@mention` cannot ride into a commit this job then merges
            # automatically.
            ok=$(printf '%s' "$compare_json" | python3 -c '
          import json
          import os
          import sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = None
          good = False
          if isinstance(d, dict):
              files = d.get("files") or []
              names = [f.get("filename") for f in files if isinstance(f, dict)]
              statuses = [f.get("status") for f in files if isinstance(f, dict)]
              commits = d.get("commits") or []
              commit_ok = False
              if len(commits) == 1 and isinstance(commits[0], dict):
                  commit = commits[0].get("commit") or {}
                  message = commit.get("message")
                  author = commit.get("author") or {}
                  expected = "roster: proposed model roster (run %s)" % os.environ.get("RUN_ID", "")
                  commit_ok = (message == expected
                               and author.get("email") == "skills-evals@users.noreply.github.com")
              good = (d.get("status") == "ahead" and d.get("ahead_by") == 1
                      and d.get("behind_by") == 0 and names == ["evals/roster.yml"]
                      and statuses == ["modified"] and commit_ok)
          print("true" if good else "false")
          ' 2>/dev/null) || ok="false"
            if [ "$ok" != true ]; then
              printf 'compare'
              return 1
            fi
            return 0
          }
          # <<< publish-verify

          # F4: track whether a disable actually succeeded — the tracking
          # issue must never claim auto-merge is off when this call failed.
          disable_auto() {
            local n="$1"
            if gh pr merge "$n" --repo "$REPO" --disable-auto; then
              return 0
            fi
            echo "::warning::could not disable auto-merge for the roster pull request"
            return 1
          }

          write_issue() {
            local title="$1" body_file="$2"
            if [ -n "$issue" ]; then
              if gh issue edit "$issue" --repo "$REPO" \
                --title "$title" --body-file "$body_file"; then
                echo "updated the proposal issue #$issue"
              else
                echo "::warning::could not update the roster tracking issue"
              fi
            else
              gh issue create --repo "$REPO" \
                --title "$title" --body-file "$body_file" \
                || echo "::warning::could not create the roster tracking issue"
            fi
          }

          if [ "$status" = same ]; then
            # S3 (round 2): a stale automatic PR is closed on "same"
            # regardless of `roster_mode` — the committed roster no longer
            # differs either way, so a PR this automation opened earlier
            # (under either mode, since `roster_mode: proposal` can follow
            # an earlier `auto` run) no longer has anything to merge. No
            # issue write here either way: the `eval` job's propose step
            # already finished the tracking issue's text for every "same"
            # case (it never depends on the PR).
            if same_pr=$(find_roster_pr); then
              if [ -n "$same_pr" ]; then
                if gh pr close "$same_pr" --repo "$REPO" \
                  --comment "This run proposes no change to the model roster; this pull request no longer differs from \`main\`. Closing."; then
                  echo "closed the stale roster pull request #$same_pr"
                else
                  echo "::warning::could not close the roster pull request"
                fi
              fi
            else
              echo "::warning::could not find the roster pull request"
            fi
            exit 0
          fi

          if [ "$status" != differs ] || [ "$rendered_identical" = true ]; then
            # F3: unknown/empty status (no roster computed, issue listing
            # failed, an ambiguous tracker, an unrecognised proposal
            # status, or the propose step failed before writing any
            # output at all) and a "differs" that rendered byte-identically
            # to the committed file (nothing to merge) get NO issue write
            # either way — today's behavior for all of these — but an open
            # PR from an EARLIER run must not be left carrying a stale
            # auto-merge. S5 (round 2): when a stale auto-merge really was
            # turned off, the tracking issue (if one is open) is corrected
            # with one fixed line, so it never keeps saying "merging
            # automatically" for a run that published nothing verifiable.
            if pr_number=$(find_roster_pr); then
              if [ -n "$pr_number" ]; then
                if disable_auto "$pr_number" && [ -n "$issue" ]; then
                  body="$RUNNER_TEMP/proposal-body.md"
                  {
                    printf '%s\n\n' "$marker"
                    echo "Automatic merge of PR #$pr_number was turned off: this run did not publish a proposal it could verify."
                  } > "$body"
                  if gh issue edit "$issue" --repo "$REPO" \
                    --title "Model roster: automatic merge turned off" --body-file "$body"; then
                    echo "updated the proposal issue #$issue"
                  else
                    echo "::warning::could not update the roster tracking issue"
                  fi
                fi
              fi
            else
              echo "::warning::could not find the roster pull request"
            fi
            exit 0
          fi

          # >>> publish-proposal (round 7, ADR 0003 "the App publishes the
          # proposal branch"): the `roster` job rendered and admitted the
          # proposal but no longer pushes it; this job publishes it, with
          # the roster App's token ONLY, as one commit on `roster/proposal`
          # through the git-data REST API (no checkout): blob -> tree (live
          # `main`'s tree plus `evals/roster.yml`, mode 100644) -> commit
          # (parent: live `main`; the exact author and message
          # `verify_publish` checks) -> the ref, force-updated if it exists,
          # created if not. Every mode, `proposal` included: once a ruleset
          # confines `roster/proposal` to the App, nothing else can update
          # it. A rejected proposal publishes nothing, as before.
          #
          # The payload crosses a job boundary, so it is re-validated here
          # before anything is written: canonical base64 no longer than the
          # cap allows, decoding to 1..$max_roster_bytes bytes of UTF-8 with
          # no NUL that parses as a YAML mapping.
          max_roster_bytes=32768
          proposal_file="$RUNNER_TEMP/proposed-roster.yml"
          rm -f "$proposal_file"
          proposal_ok=false
          publish_fail=""
          publish_base=""
          proposed_b64="${PROPOSED_ROSTER_B64:-}"
          if [ "$rejected" != true ] && [ -n "$proposed_b64" ] \
             && [ "${#proposed_b64}" -le $(( (max_roster_bytes + 2) / 3 * 4 )) ] \
             && [[ "$proposed_b64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] \
             && printf '%s' "$proposed_b64" | base64 -d > "$proposal_file" 2>/dev/null \
             && python3 - "$proposal_file" "$max_roster_bytes" > /dev/null 2>&1 <<'PY'
          import sys

          import yaml

          path, cap = sys.argv[1], int(sys.argv[2])
          with open(path, "rb") as handle:
              data = handle.read()
          if not 0 < len(data) <= cap or b"\0" in data:
              raise SystemExit(1)
          doc = yaml.safe_load(data.decode("utf-8", errors="strict"))
          if not isinstance(doc, dict):
              raise SystemExit(1)
          PY
          then
            proposal_ok=true
          fi
          if [ "$proposal_ok" != true ]; then rm -f "$proposal_file"; fi
          # The one value this job ever writes into a commit message:
          # digits only, or nothing is published.
          run_id=""
          case "${RUN_ID:-}" in ''|*[!0-9]*) : ;; *) run_id="$RUN_ID" ;; esac

          # The blob sha of `evals/roster.yml` at a ref, validated; empty
          # when the file or the ref cannot be read.
          roster_blob_at() {
            local sha
            sha=$(gh api "repos/$REPO/contents/evals/roster.yml?ref=$1" --jq .sha 2>/dev/null) || sha=""
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then sha=""; fi
            printf '%s' "$sha"
          }
          # One App write through the git-data API; prints the created
          # object's sha, validated, or fails.
          app_write() {
            local url="$1" method="$2" input="$3" sha
            sha=$(app_gh api "$url" -X "$method" --input "$input" --jq "${4:-.sha}" 2>/dev/null) || return 1
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s' "$sha"
          }
          publish_proposal() {
            local main_tree blob tree commit existing req="$RUNNER_TEMP/roster-git-request.json"
            main_tree=$(gh api "repos/$REPO/git/commits/$publish_base" --jq .tree.sha 2>/dev/null) || main_tree=""
            [[ "$main_tree" =~ ^[0-9a-f]{40}$ ]] || return 1
            jq -n --arg content "$(base64 -w0 < "$proposal_file")" \
              '{content: $content, encoding: "base64"}' > "$req" || return 1
            blob=$(app_write "repos/$REPO/git/blobs" POST "$req") || return 1
            jq -n --arg base "$main_tree" --arg blob "$blob" \
              '{base_tree: $base, tree: [{path: "evals/roster.yml", mode: "100644", type: "blob", sha: $blob}]}' \
              > "$req" || return 1
            tree=$(app_write "repos/$REPO/git/trees" POST "$req") || return 1
            jq -n --arg tree "$tree" --arg parent "$publish_base" \
              --arg message "roster: proposed model roster (run $run_id)" \
              '{message: $message, tree: $tree, parents: [$parent],
                author: {name: "skills-evals real-eval bot",
                         email: "skills-evals@users.noreply.github.com"}}' \
              > "$req" || return 1
            commit=$(app_write "repos/$REPO/git/commits" POST "$req") || return 1
            existing=$(gh api "repos/$REPO/git/ref/heads/roster/proposal" --jq .object.sha 2>/dev/null) || existing=""
            if [[ "$existing" =~ ^[0-9a-f]{40}$ ]]; then
              jq -n --arg sha "$commit" '{sha: $sha, force: true}' > "$req" || return 1
              app_write "repos/$REPO/git/refs/heads/roster/proposal" PATCH "$req" .object.sha > /dev/null || return 1
            else
              jq -n --arg sha "$commit" '{ref: "refs/heads/roster/proposal", sha: $sha}' > "$req" || return 1
              app_write "repos/$REPO/git/refs" POST "$req" .object.sha > /dev/null || return 1
            fi
            printf '%s' "$commit"
          }

          if [ "$rejected" = true ]; then
            : # a rejected proposal is never published; see its branch below
          elif [ "$proposal_ok" != true ] || [ -z "$base_sha" ] || [ -z "$run_id" ]; then
            publish_fail=payload
            echo "::warning::the roster proposal handed on by the roster job did not validate; it was not published"
          elif [ -z "$app_token" ]; then
            publish_fail=app
            echo "::warning::the roster App token was unavailable; the roster proposal was not published, and no roster pull request was opened or armed"
          else
            if [ "$main_resolved" != true ]; then
              main_sha=$(resolve_live_main) || main_sha=""
              echo "live main resolved to: ${main_sha:-<unresolved>}"
            fi
            if [ -z "$main_sha" ]; then
              publish_fail=api
              echo "::warning::could not resolve live main; the roster proposal was not published"
            else
              # Rendered against a stale base: if `main` changed
              # `evals/roster.yml` since, publishing this file on live
              # `main` could silently revert that change, so nothing is
              # published and the next run re-proposes. Anything else that
              # moved on `main` is kept: the commit's parent is live `main`.
              if [ "$base_sha" != "$main_sha" ]; then
                base_blob=$(roster_blob_at "$base_sha")
                main_blob=$(roster_blob_at "$main_sha")
                if [ -z "$base_blob" ] || [ "$base_blob" != "$main_blob" ]; then
                  publish_fail=moved
                  echo "::notice::main changed evals/roster.yml after this run rendered its proposal; it was not published"
                fi
              fi
              if [ -z "$publish_fail" ]; then
                publish_base="$main_sha"
                if created=$(publish_proposal); then
                  pushed_sha="$created"
                  echo "published the roster proposal as $pushed_sha on roster/proposal (parent $publish_base)"
                else
                  publish_fail=api
                  echo "::warning::could not publish the roster proposal to roster/proposal"
                fi
              fi
            fi
          fi
          app_missing=false
          if [ "$publish_fail" = app ]; then app_missing=true; fi
          # <<< publish-proposal

          # status == differs, admitted, not byte-identical: the only case
          # that can enable auto-merge, and the only case whose tracking-
          # issue text this job constructs.
          #
          # >>> attempt-candidate (N1, round 2): split out from the
          # `verify_publish` call itself so it can be fragment-tested on
          # its own (`TestN1HostileValidation`'s M12/M17 tests) — B1's
          # head/compare checks inside `verify_publish` would otherwise
          # independently reject an empty `$pushed_sha` or a rejected
          # proposal anyway, masking a dropped check HERE from a test that
          # only observes the combined `attempt` outcome.
          candidate=false
          if [ "$rejected" != true ] && [ "$roster_mode" = auto ] \
             && [ "$probe_clean" = true ] && [ -n "$pushed_sha" ] && [ -n "$github_sha" ]; then
            candidate=true
          fi
          # <<< attempt-candidate
          attempt=false
          verify_fail=""
          if [ "$candidate" = true ]; then
            if verify_fail=$(verify_publish); then
              # Round 6: a verified proposal is opened and armed by the
              # roster App or not at all — never with GITHUB_TOKEN, whose
              # PR's `pull_request` run GitHub holds for approval. Round 7:
              # only the App publishes, so a `$pushed_sha` implies the
              # token; checked again here regardless.
              if [ -n "$app_token" ]; then
                attempt=true
              fi
            fi
          fi
          verify_reason_text=""
          case "$verify_fail" in
            head) verify_reason_text="the pushed branch's head does not match this run's proposal" ;;
            compare) verify_reason_text="the pushed commit did not verify as a single \`evals/roster.yml\` change ahead of this run's checkout" ;;
          esac

          pr_number=""
          pr_failed=""
          disable_ok=""
          reopen_failed=""

          if [ "$attempt" = true ]; then
            pr_body="$RUNNER_TEMP/pr-body.md"
            {
              echo "The weekly run computes a model roster that differs from the committed \`evals/roster.yml\`."
              echo
              [ -z "$probe_note" ] || printf '%s\n\n' "$probe_note"
              echo "$eval_note"
              echo
              echo "[Compare \`main...roster/proposal\`]($SERVER_URL/$REPO/compare/main...roster/proposal)"
              echo
              printf '%s\n' "$auto_summary"
              echo
              echo "Merged automatically once \`test\` passes (\`roster_mode: auto\` in \`evals/roster-policy.yml\`; set it to \`proposal\` to require approval)."
              # Review nit 2: only a run that has an eval to follow waits.
              if [ "$roster_only" != true ]; then
                echo
                echo "The run that armed it waits a bounded time for the merge before its eval; if the merge does not land in time, that run turns auto-merge off again and confirms it is off before its eval starts (or runs no eval at all), and the next run re-arms it."
              fi
            } > "$pr_body"

            if pr_number=$(find_roster_pr); then
              if [ -n "$pr_number" ]; then
                if ! app_gh pr edit "$pr_number" --repo "$REPO" \
                  --title "roster: automatic update (run $RUN_ID)" --body-file "$pr_body"; then
                  pr_failed=1
                  echo "::warning::could not update the roster pull request"
                fi
                # Round 6: closing and reopening it AS THE APP fires a
                # `reopened` `pull_request` event (ci.yml's bare
                # `pull_request:` trigger includes it) whose run needs no
                # approval. Round 7: the App's own ref update above is an
                # App push, so it fires `synchronize` too; the cycle is
                # kept because closing also clears any auto-merge an
                # earlier run left armed, and a second `test` run on the
                # same head cancels nothing (ci.yml declares no
                # `concurrency` group). No
                # `--comment` on either call: one more App write that can
                # fail between the close and the reopen, and a failure
                # there would leave the PR closed.
                if [ -z "$pr_failed" ]; then
                  if ! app_gh pr close "$pr_number" --repo "$REPO"; then
                    pr_failed=1
                    echo "::warning::could not close the roster pull request to re-run its checks"
                  elif ! app_gh pr reopen "$pr_number" --repo "$REPO"; then
                    pr_failed=1
                    reopen_failed=1
                    echo "::warning::could not reopen the roster pull request"
                  fi
                fi
              else
                pr_url=$(app_gh pr create --repo "$REPO" --base main --head roster/proposal \
                  --title "roster: automatic update (run $RUN_ID)" --body-file "$pr_body") \
                  || pr_url=""
                pr_number=$(printf '%s' "$pr_url" | grep -oE '[0-9]+$' || true)
                case "$pr_number" in
                  ''|*[!0-9]*)
                    pr_number=""
                    pr_failed=1
                    echo "::warning::could not create the roster pull request"
                    ;;
                esac
              fi
            else
              pr_number=""
              pr_failed=1
              echo "::warning::could not find the roster pull request"
            fi

            if [ -z "$pr_failed" ]; then
              # N1: idempotent — a PR this job is EDITING (not creating
              # fresh) may already carry auto-merge from an earlier run;
              # disabling it first means the enable call below is never a
              # no-op on a PR already in that state. Genuinely silent, not
              # just unwrapped: a BRAND NEW pr create has no auto-merge to
              # disable, and `--disable-auto` on one can itself answer with
              # an error (GraphQL "Auto merge is not enabled") — that is an
              # expected, harmless outcome here, never the "something a
              # human should see" failure `disable_auto` warns about
              # elsewhere in this job.
              app_gh pr merge "$pr_number" --repo "$REPO" --disable-auto >/dev/null 2>&1 || true
              if ! app_gh pr merge "$pr_number" --repo "$REPO" --auto --merge \
                   --match-head-commit "$pushed_sha"; then
                pr_failed=1
                echo "::warning::could not enable auto-merge for the roster pull request"
              fi
            fi
            if [ -n "$pr_failed" ] && [ -n "$pr_number" ]; then
              # The attempt above did not finish with auto-merge enabled on
              # this run's head but DID learn a PR number: that PR must not
              # be left carrying a stale auto-merge from an earlier run (or
              # from an earlier half of this same attempt). This disable is
              # GITHUB_TOKEN's (`disable_auto`), not the App's, so it still
              # works when the App call is what failed. A PR left CLOSED by
              # a failed reopen carries no auto-merge at all.
              if [ -n "$reopen_failed" ]; then
                disable_ok=1
              elif disable_auto "$pr_number"; then
                disable_ok=1
              fi
            fi
          else
            if pr_number=$(find_roster_pr); then
              if [ -n "$pr_number" ]; then
                if disable_auto "$pr_number"; then disable_ok=1; fi
              fi
            else
              pr_number=""
              pr_failed=1
              echo "::warning::could not find the roster pull request"
            fi
          fi

          body="$RUNNER_TEMP/proposal-body.md"
          if [ "$attempt" = true ] && [ -z "$pr_failed" ] && [ -n "$pr_number" ]; then
            # >>> armed-outputs (ADR 0004): auto-merge is ENABLED on this
            # run's own published commit — the only point that tells
            # `roster-wait` there is a merge to wait for. Three values this
            # job already validated: a fixed literal, digits (from the
            # create URL or the owner-filtered lookup), and the 40-hex sha
            # the App's own ref write returned. Never emitted anywhere else,
            # so every other path leaves them empty ("nothing armed").
            {
              printf 'armed=true\n'
              printf 'pr_number=%s\n' "$pr_number"
              printf 'pushed_sha=%s\n' "$pushed_sha"
            } >> "${GITHUB_OUTPUT:-/dev/null}"
            # <<< armed-outputs
            {
              printf '%s\n\n' "$marker"
              echo "The weekly run computed a roster difference and opened pull request #$pr_number from \`roster/proposal\`, which merges automatically once its \`test\` check passes (\`roster_mode: auto\` in \`evals/roster-policy.yml\`; set it to \`proposal\` to require approval)."
              echo
              if [ "$roster_only" = true ]; then
                echo "This was a \`roster_only\` dispatch, so no eval follows and nothing waits for the merge; the pull request merges on its own once \`test\` passes."
              else
                echo "This run waits a bounded time for that merge before its eval (ADR 0004). If it merges in time, the eval runs on the merged roster; if not, auto-merge is turned off again and re-read to confirm it is off before the eval starts, the eval runs on the committed \`evals/roster.yml\`, and the next run re-arms the pull request. If that cannot be confirmed, neither the eval nor \`publish\` runs. The run summary says which happened."
              fi
              echo
              [ -z "$probe_note" ] || printf '%s\n\n' "$probe_note"
              echo "$eval_note"
              echo
              echo "[Pull request #$pr_number]($SERVER_URL/$REPO/pull/$pr_number)"
              echo
              printf '%s\n' "$roster_summary"
            } > "$body"
            write_issue "Model roster: a change is merging automatically" "$body"
            exit 0
          fi

          if [ "$rejected" = true ]; then
            # F4: the "turned off" sentence is conditioned on $disable_ok,
            # never printed because the call was merely attempted.
            {
              printf '%s\n\n' "$marker"
              echo "The weekly run computed a roster difference, but it was rejected before proposal publication."
              echo
              echo "**Needs review before publication.** No proposal branch or compare link was updated."
              if [ "$roster_mode" = auto ]; then
                echo "\`roster_mode: auto\` is set, but no pull request was opened: a rejected proposal never reaches the automatic-merge step."
              fi
              if [ -n "$pr_number" ]; then
                if [ "$disable_ok" = 1 ]; then
                  echo "Pull request #$pr_number from an earlier run is still open; its automatic merge has been turned off because this run's proposal was rejected before publication."
                else
                  echo "Pull request #$pr_number from an earlier run is still open; its automatic merge could NOT be turned off — disable it by hand on PR #$pr_number."
                fi
              fi
              echo
              [ -z "$probe_note" ] || printf '%s\n\n' "$probe_note"
              echo "$eval_note"
              echo
              echo "$rejection_reason"
              echo
              printf '%s\n' "$roster_summary"
            } > "$body"
            write_issue "Model roster: proposal needs review" "$body"
            exit 0
          fi

          # `roster_mode: proposal`, or `auto` with a probe that was not
          # clean, or a publication that could not be verified (B1), or an
          # attempt that started but failed partway.
          why=""
          if [ "$roster_mode" = auto ]; then
            if [ "$probe_clean" != true ]; then
              why="this run's vendor-default probe was not clean"
            elif [ -n "$verify_reason_text" ]; then
              why="this run's proposal needs review: $verify_reason_text"
            elif [ "$app_missing" = true ]; then
              why="the roster App token was unavailable"
            elif [ "$publish_fail" = moved ]; then
              why="\`main\` changed \`evals/roster.yml\` after this run rendered its proposal"
            else
              why="this run's automatic-merge attempt did not complete"
            fi
          fi
          if [ -n "$pr_number" ]; then
            # F4: WHY auto-merge is not on stays in the sentence either
            # way — only whether the disable call itself succeeded changes.
            off_reason="${why:-\`roster_mode\` is \`proposal\`}"
            if [ "$disable_ok" = 1 ]; then
              turned_off="its automatic merge has been turned off because ${off_reason}."
            else
              turned_off="its automatic merge could NOT be turned off because ${off_reason} — disable it by hand on PR #$pr_number."
            fi
            if [ -n "$reopen_failed" ]; then
              pr_line="Pull request #$pr_number was closed so \`test\` could run on its new head, and could not be reopened — reopen it from \`roster/proposal\`; a human must merge it after CI."
            elif [ "$app_missing" = true ]; then
              # Round 7: no App token, no publish — the open PR still
              # holds an EARLIER run's proposal.
              pr_line="The roster App token was unavailable, so this run's proposal was not published and PR #$pr_number still holds an earlier proposal — review before merging; this run's rendered file is below. ${turned_off^}"
            elif [ "$publish_fail" = moved ]; then
              pr_line="\`main\` changed \`evals/roster.yml\` after this run rendered its proposal, so it was not published and PR #$pr_number still holds an earlier proposal — review before merging; the next run re-proposes. ${turned_off^}"
            elif [ -z "$pushed_sha" ]; then
              # Should-fix 5 (round 3 on #209): this run's own push never
              # succeeded (or emitted nothing) — any open PR here is from
              # an EARLIER run's proposal, never this run's, so it must
              # never be told to "merge it after CI" as if this run's
              # content were on it.
              pr_line="This run's proposal was not pushed; PR #$pr_number still holds an earlier proposal — review before merging. ${turned_off^}"
            elif [ -n "$verify_reason_text" ]; then
              # Should-fix 6: independent verification (B1) rejected the
              # pushed branch itself — never "merge it after CI" about
              # content that failed that check; name the specific reason.
              pr_line="Pull request #$pr_number is open from \`roster/proposal\`; inspect before merging — $verify_reason_text. ${turned_off^}"
            elif [ -n "$why" ]; then
              pr_line="Pull request #$pr_number is open from \`roster/proposal\`; a human must merge it after CI. ${turned_off^}"
            else
              pr_line="Pull request #$pr_number is open from \`roster/proposal\`; merge it after CI if the reasons below hold up. ${turned_off^}"
            fi
          else
            if [ "$app_missing" = true ]; then
              pr_line="The roster App token was unavailable, so this run's proposal could not be published to \`roster/proposal\` and no pull request was opened or armed. The rendered \`evals/roster.yml\` is below: a human can apply it in a pull request, or the next run publishes it."
            elif [ "$publish_fail" = moved ]; then
              pr_line="\`main\` changed \`evals/roster.yml\` after this run rendered its proposal, so the proposal was not published; the next run re-proposes against the new \`main\`."
            elif [ -z "$pushed_sha" ]; then
              pr_line="This run's proposal was not pushed; open a pull request from \`roster/proposal\` once a future run's push succeeds."
            elif [ -n "$verify_reason_text" ]; then
              pr_line="\`roster_mode: auto\` is set, but this run's proposal needs review — $verify_reason_text — so the automatic merge was skipped; inspect before merging."
            elif [ -n "$why" ]; then
              pr_line="\`roster_mode: auto\` is set, but $why, so the automatic merge was skipped this run — a human must open or merge the pull request from \`roster/proposal\`."
            else
              pr_line="Open a pull request from \`roster/proposal\` and merge it after CI if the reasons below hold up."
            fi
          fi
          {
            printf '%s\n\n' "$marker"
            echo "The weekly run computes a model roster that differs from the committed \`evals/roster.yml\`."
            echo
            echo "**Nothing has changed yet.** The harness runs on the committed file (ADR 0001); this is a proposal."
            echo "$pr_line"
            echo
            [ -z "$probe_note" ] || printf '%s\n\n' "$probe_note"
            echo "$eval_note"
            echo
            echo "[Compare \`main...roster/proposal\`]($SERVER_URL/$REPO/compare/main...roster/proposal)"
            echo
            printf '%s\n' "$roster_summary"
            # Round 7: with no App token nothing was published, so the
            # rendered file itself goes into the issue, fenced longer than
            # any backtick run it contains, for a human to apply by hand.
            if [ "$app_missing" = true ] && [ -s "$proposal_file" ]; then
              fence=$(python3 -c '
          import re
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              text = handle.read()
          runs = [len(m) for m in re.findall(r"`+", text)]
          print("`" * max(3, max(runs, default=0) + 1))
          ' "$proposal_file" 2>/dev/null) || fence=""
              if [ -n "$fence" ]; then
                echo
                echo "The rendered \`evals/roster.yml\` this run could not publish:"
                echo
                echo "${fence}yaml"
                cat "$proposal_file"
                # A file without a final newline must not glue the fence on.
                [ -z "$(tail -c 1 "$proposal_file")" ] || echo
                echo "$fence"
              fi
            fi
          } > "$body"
          write_issue "Model roster: a change is proposed" "$body"

  # ADR 0004 (the owner's decision of 2026-09-30: "have the roster update occur
  # immediately before evals run"). Runs after `roster-pr` and before
  # `eval`: when `roster-pr` armed this run's roster pull request, this job
  # waits — bounded — for it to merge, verifies the merge, and hands the
  # `eval` job the merge commit so the eval runs on the roster this run just
  # merged. Every other outcome hands on "committed", and the eval runs on
  # the committed `evals/roster.yml` exactly as it did before ADR 0004.
  #
  # Least privilege: `contents: read` and `pull-requests: write`, nothing
  # else, and no App token (TestRosterAppTokenIsConfined). Every read —
  # the pull request, its files, the merged file, `main`'s ref, a compare —
  # is GITHUB_TOKEN's; its only writes are `gh pr merge --disable-auto`
  # calls — the wait step's one after a timeout, and the sweep step's. No
  # checkout, no repository code, no CLI, no agent.
  #
  # Invariant 3 (nothing armed while the agent runs), FAIL CLOSED: the
  # second step runs `if: always()` — after a wait that merged, failed,
  # timed out (its own `timeout-minutes`) or was cancelled — turns off
  # auto-merge on any open `roster/proposal` pull request (same
  # owner-filtered lookup `disarm` uses), re-reads it, and emits
  # `cleared=true` only when that re-read shows it off (or no roster PR is
  # open, as after a merge). `eval` and `publish` run only on
  # `cleared == 'true'`.
  #
  # Invariant 2 (no write-credential job running once a PR is armed): this
  # job holds only `pull-requests: write` and runs no code that could move
  # `roster/proposal`, and `publish` (`contents: write`) runs only after
  # `eval`, with the same `cleared` gate.
  #
  # Main-only, like `roster-pr` and `disarm`; skipped on a `roster_only`
  # dispatch (no eval runs, so there is nothing to wait for — an armed PR
  # then merges on its own, as before ADR 0004).
  roster-wait:
    needs: [roster, roster-pr]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.roster_only }}
    runs-on: ubuntu-latest
    # Above the wait step's own timeout, which is above the poll cap (30
    # min by default), so the script — not a kill — normally ends the wait,
    # and the disarm step always has room to run after it.
    timeout-minutes: 45
    permissions:
      pull-requests: write
      contents: read
    # Consumed by the `eval` job's "Use the roster this run merged, or the
    # committed one" step, which re-validates each at its own boundary.
    outputs:
      roster_source: ${{ steps.wait.outputs.roster_source }}
      roster_reason: ${{ steps.wait.outputs.roster_reason }}
      merge_sha: ${{ steps.wait.outputs.merge_sha }}
      pr_number: ${{ steps.wait.outputs.pr_number }}
      # S1: `true` ONLY when the sweep step confirmed, by re-reading, that
      # no roster pull request is left armed. The `eval` and `publish`
      # gates require it.
      cleared: ${{ steps.sweep.outputs.cleared }}
    steps:
      # The poll and sweep scripts are stdlib-only Python; pinned to the
      # same 3.12 as the other jobs rather than the runner's system Python.
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      # Polls the armed pull request (the polls themselves are reads) every
      # ROSTER_WAIT_INTERVAL_SECONDS (default 30) for at most
      # ROSTER_WAIT_MAX_POLLS polls (default 60: a 30-minute cap, with
      # margin over the ~7-12 minutes the PR's required `test` takes). The
      # workflow sets neither; they exist so the tests can run this script
      # with no sleeping. There is no early exit on a failed `test`: reading
      # check runs would need `checks: read`, which this job does not get,
      # so a PR whose `test` fails simply does not merge and the wait ends
      # at the cap. After the cap it makes this step's one write — `gh pr
      # merge --disable-auto` — and reads the PR once more (S2).
      #
      # A poll that cannot be read is retried within the cap. A terminal
      # state ends the wait at once: closed without merging, auto-merge
      # turned off, its head moved off the commit this run armed, or a
      # number that is not this repository's `roster/proposal` pull request
      # onto `main`. A MERGE is used only once it verifies (ADR 0004 §5):
      # the merged head is the commit this run armed; the PR's files are
      # exactly `evals/roster.yml`, modified; `evals/roster.yml` at the
      # merge commit equals, byte for byte, the proposal the `roster` job
      # rendered this run; and the merge commit is on live `main`. Any
      # failed or unreadable check is "committed", loudly.
      #
      # Every output is a fixed literal, digits or 40-hex. Nothing here
      # interpolates a GitHub Actions expression into the shell; every
      # value arrives through `env:` and is re-validated at this boundary.
      - name: Wait for the armed roster pull request to merge
        id: wait
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARMED: ${{ needs.roster-pr.outputs.armed }}
          PR_NUMBER: ${{ needs.roster-pr.outputs.pr_number }}
          PUSHED_SHA: ${{ needs.roster-pr.outputs.pushed_sha }}
          PROPOSED_ROSTER_B64: ${{ needs.roster.outputs.proposed_roster_b64 }}
        run: |
          set -uo pipefail
          : "${GITHUB_OUTPUT:=/dev/null}"
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"
          interval=30
          polls=60
          case "${ROSTER_WAIT_INTERVAL_SECONDS:-}" in ''|*[!0-9]*) : ;; *) interval="$ROSTER_WAIT_INTERVAL_SECONDS" ;; esac
          case "${ROSTER_WAIT_MAX_POLLS:-}" in ''|*[!0-9]*|0) : ;; *) polls="$ROSTER_WAIT_MAX_POLLS" ;; esac
          echo "roster wait: up to $polls polls, every $interval s"
          source=committed
          reason=""
          merge_sha=""
          pr=""
          reason_text() {
            case "$1" in
              merged) printf 'Roster pull request #%s merged (merge commit `%s`) and verified: it touched exactly `evals/roster.yml`, merged onto `main`, and carries the roster this run proposed, byte for byte. The eval runs on it.' "$pr" "$merge_sha" ;;
              not-armed) printf 'No roster pull request was armed this run (`roster_mode: proposal`, a dirty probe, a rejected, unchanged or unpublished proposal, a missing App token, or an arm that did not complete; the tracking issue says which), so nothing was waited for.' ;;
              invalid-input) printf 'The values the roster jobs handed on did not validate, so nothing was waited for.' ;;
              timeout) printf 'The armed roster pull request did not merge within this run'"'"'s bounded wait. Its auto-merge was asked to turn off; the next step re-reads it and says whether that is confirmed. The next run re-arms it.' ;;
              closed) printf 'The armed roster pull request was closed without merging.' ;;
              auto-merge-off) printf 'The roster pull request'"'"'s auto-merge was turned off before it merged.' ;;
              head-moved) printf 'The roster pull request'"'"'s head is not the commit this run armed.' ;;
              identity) printf 'The pull request handed on is not this repository'"'"'s `roster/proposal` pull request onto `main`.' ;;
              verify-failed) printf 'The merge did not verify (it must touch exactly `evals/roster.yml`, carry the roster this run proposed byte for byte, and be on `main`), so the eval does not use it.' ;;
              *) printf 'The wait ended for an unrecognized reason.' ;;
            esac
          }
          finish() {
            printf 'roster_source=%s\n' "$source" >> "$GITHUB_OUTPUT"
            printf 'roster_reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
            [ -z "$merge_sha" ] || printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"
            [ -z "$pr" ] || printf 'pr_number=%s\n' "$pr" >> "$GITHUB_OUTPUT"
            text="$(reason_text "$reason")"
            echo "roster wait: $reason"
            {
              echo "### Roster wait"
              echo
              if [ "$source" = merged ]; then
                echo "$text"
              else
                echo "The eval runs on the committed \`evals/roster.yml\`. $text"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # >>> wait-inputs: re-validated at this job boundary.
          armed=false
          case "${ARMED:-}" in true) armed=true ;; esac
          if [ "$armed" != true ]; then
            reason=not-armed
            finish
          fi
          case "${PR_NUMBER:-}" in ''|*[!0-9]*) : ;; *) pr="$PR_NUMBER" ;; esac
          pushed=""
          if [[ "${PUSHED_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then pushed="$PUSHED_SHA"; fi
          # The proposal's exact bytes, with `roster-pr`'s own payload
          # checks: canonical base64 no longer than the cap allows,
          # decoding to 1..32768 bytes.
          max_roster_bytes=32768
          proposal_file="$RUNNER_TEMP/roster-wait-proposal.yml"
          rm -f "$proposal_file"
          proposed_b64="${PROPOSED_ROSTER_B64:-}"
          proposal_ok=false
          if [ -n "$proposed_b64" ] \
             && [ "${#proposed_b64}" -le $(( (max_roster_bytes + 2) / 3 * 4 )) ] \
             && [[ "$proposed_b64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] \
             && printf '%s' "$proposed_b64" | base64 -d > "$proposal_file" 2>/dev/null; then
            size=$(wc -c < "$proposal_file" | tr -d '[:space:]') || size=0
            case "$size" in ''|*[!0-9]*) size=0 ;; esac
            if [ "$size" -gt 0 ] && [ "$size" -le "$max_roster_bytes" ]; then proposal_ok=true; fi
          fi
          if [ -z "$pr" ] || [ -z "$pushed" ] || [ "$proposal_ok" != true ]; then
            pr=""
            reason=invalid-input
            echo "::warning::the armed roster pull request's details did not validate; the eval runs on the committed roster"
            finish
          fi
          # <<< wait-inputs

          # >>> wait-poll
          state_file="$RUNNER_TEMP/roster-wait-pr.json"
          # One read of the armed PR, classified into a fixed word (or
          # `merged <sha>`); an unreadable answer is `unreadable`.
          read_state() {
            local result
            if ! gh api "repos/$REPO/pulls/$pr" > "$state_file" 2>/dev/null; then
              printf 'unreadable'
              return 0
            fi
            result=$(python3 - "$state_file" "$REPO" "$pushed" <<'PY'
          import json
          import re
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  d = json.load(handle)
          except Exception:
              d = None
          if not isinstance(d, dict):
              print("unreadable")
              raise SystemExit
          head = d.get("head") if isinstance(d.get("head"), dict) else {}
          base = d.get("base") if isinstance(d.get("base"), dict) else {}
          repo = head.get("repo") if isinstance(head.get("repo"), dict) else {}
          sha = d.get("merge_commit_sha")
          if (head.get("ref") != "roster/proposal" or repo.get("full_name") != sys.argv[2]
                  or base.get("ref") != "main"):
              print("identity")
          elif head.get("sha") != sys.argv[3]:
              print("head-moved")
          elif d.get("merged") is True:
              if isinstance(sha, str) and re.fullmatch(r"[0-9a-f]{40}", sha):
                  print("merged " + sha)
              else:
                  print("unreadable")
          elif d.get("state") == "closed":
              print("closed")
          elif d.get("state") != "open":
              print("unreadable")
          elif d.get("auto_merge") is None:
              print("auto-merge-off")
          else:
              print("pending")
          PY
            ) || result=unreadable
            printf '%s' "$result"
          }
          outcome=""
          i=0
          while [ "$i" -lt "$polls" ]; do
            i=$((i + 1))
            outcome=$(read_state)
            case "$outcome" in
              pending|unreadable) : ;;
              *) break ;;
            esac
            if [ "$i" -lt "$polls" ]; then sleep "$interval"; fi
          done
          # <<< wait-poll

          # >>> wait-timeout (S2): the cap ran out with the PR still open
          # (or unreadable). Ask GitHub to turn its auto-merge off, then
          # read it ONCE more: GitHub may have merged it between the last
          # poll and the disable, and a merge that verifies is still used.
          # Whether auto-merge really is off is the NEXT step's to confirm
          # (it re-reads the PR); this step never claims it.
          case "$outcome" in
            "merged "*|identity|head-moved|closed|auto-merge-off) : ;;
            *)
              if ! gh pr merge "$pr" --repo "$REPO" --disable-auto >/dev/null 2>&1; then
                echo "::warning::could not disable auto-merge for the roster pull request after the wait; the next step re-checks it"
              fi
              outcome=$(read_state)
              case "$outcome" in
                "merged "*) echo "the roster pull request merged after the last poll" ;;
                *) outcome=timeout ;;
              esac
              ;;
          esac
          # <<< wait-timeout

          case "$outcome" in
            "merged "*) merge_sha="${outcome#merged }" ;;
            identity|head-moved|closed|auto-merge-off)
              reason="$outcome"
              echo "::warning::the armed roster pull request did not merge ($outcome); the eval runs on the committed roster"
              finish
              ;;
            *)
              reason=timeout
              echo "::warning::the armed roster pull request did not merge within the wait; the eval runs on the committed roster"
              finish
              ;;
          esac

          # >>> wait-verify: a merge is used only once every check passes.
          verify_merge() {
            local files content main_sha status
            files=$(gh api "repos/$REPO/pulls/$pr/files?per_page=100" 2>/dev/null) || return 1
            printf '%s' "$files" | python3 -c '
          import json
          import sys
          try:
              rows = json.load(sys.stdin)
          except Exception:
              raise SystemExit(1)
          ok = (isinstance(rows, list) and len(rows) == 1 and isinstance(rows[0], dict)
                and rows[0].get("filename") == "evals/roster.yml"
                and rows[0].get("status") == "modified")
          raise SystemExit(0 if ok else 1)
          ' 2>/dev/null || return 1
            content=$(gh api "repos/$REPO/contents/evals/roster.yml?ref=$merge_sha" --jq .content 2>/dev/null) || return 1
            printf '%s' "$content" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/roster-wait-merged.yml" 2>/dev/null || return 1
            cmp -s "$RUNNER_TEMP/roster-wait-merged.yml" "$proposal_file" || return 1
            main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha 2>/dev/null) || return 1
            [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            status=$(gh api "repos/$REPO/compare/$merge_sha...$main_sha" --jq .status 2>/dev/null) || return 1
            case "$status" in identical|ahead) return 0 ;; esac
            return 1
          }
          if verify_merge; then
            source=merged
            reason=merged
            echo "roster pull request #$pr merged as $merge_sha and verified"
          else
            merge_sha=""
            reason=verify-failed
            echo "::warning::the roster pull request merged but the merge did not verify; the eval runs on the committed roster"
          fi
          # <<< wait-verify
          finish

      # Invariant 3, FAIL CLOSED (S1, round 2 R2-S1 and nit 2): runs
      # whatever the wait step did — merged, failed, timed out or
      # cancelled. It checks TWO sources of "which PR could be armed": any
      # open `roster/proposal` pull request found by the SAME validated,
      # owner-filtered lookup as `disarm` (server-side `head=`/`base=main`
      # filters, re-asserted client-side by the exact repo full name and
      # branch name, digits-only on the number), AND the number `roster-pr`
      # reports it armed (`needs.roster-pr.outputs.pr_number`, digits only)
      # — which still finds an armed PR whose base was moved off `main`, out
      # of the lookup's reach. For each it reads the PR, turns auto-merge off
      # if it is on (never calling `--disable-auto` on one already off), and
      # READS IT AGAIN. Only when every one reads clear (auto-merge off, or
      # the PR no longer open) — or there is none — does it emit
      # `cleared=true`, exit 0. Every other outcome (a failed lookup, read
      # or disable, or a disable GitHub answered OK that did not take) emits
      # `cleared=false`, a fixed `::warning::` and a summary line, and then
      # EXITS 1: this job fails, so a week with no eval is a red run. The
      # `eval` and `publish` gates read `cleared` from the failed job all the
      # same (their `if:` uses `!cancelled()`, so they are evaluated, and
      # `'false' != 'true'` keeps both skipped). A job that never got here
      # leaves `cleared` empty, with the same result.
      - name: Disarm the roster pull request unless it merged
        id: sweep
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARMED_PR_NUMBER: ${{ needs.roster-pr.outputs.pr_number }}
        run: |
          set -uo pipefail
          : "${GITHUB_OUTPUT:=/dev/null}"
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"
          find_roster_pr() {
            local raw
            if ! raw=$(gh api "repos/$REPO/pulls?state=open&base=main&head=${REPO%%/*}:roster/proposal" \
                        --jq '[.[] | select(.head.repo.full_name == env.REPO and .head.ref == "roster/proposal")] | .[0].number // empty' \
                        2>/dev/null); then
              return 1
            fi
            case "$raw" in
              ''|*[!0-9]*) printf '' ;;
              *) printf '%s' "$raw" ;;
            esac
          }
          # `clear` when the PR is no longer open or carries no auto-merge;
          # `armed` when it does; fails when it cannot be read.
          pr_armed_state() {
            local word
            word=$(gh api "repos/$REPO/pulls/$1" \
                     --jq 'if (.state != "open") or (.auto_merge == null) then "clear" else "armed" end' \
                     2>/dev/null) || return 1
            case "$word" in clear|armed) printf '%s' "$word" ;; *) return 1 ;; esac
          }
          confirmed() {
            printf 'cleared=true\n' >> "$GITHUB_OUTPUT"
            echo "$1"
            {
              echo "### Roster pull request"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          unconfirmed() {
            printf 'cleared=false\n' >> "$GITHUB_OUTPUT"
            echo "::warning::could not confirm that no roster pull request is left armed; the eval and publish jobs will not run this time"
            {
              echo "### Roster pull request"
              echo
              echo "**The eval and publish jobs do not run this time:** $1 Nothing may be armed while the eval's agent runs (ADR 0004). Turn off auto-merge on the roster pull request by hand if it is still on; the next run tries again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          # One PR: clear already, or disarmed and confirmed by a re-read.
          # On failure, `why` says what could not be confirmed.
          why=""
          check_one() {
            local n="$1" state
            state=$(pr_armed_state "$n") || { why="pull request #$n could not be read."; return 1; }
            [ "$state" = clear ] && { echo "pull request #$n is not armed"; return 0; }
            if ! gh pr merge "$n" --repo "$REPO" --disable-auto; then
              echo "::warning::could not disable auto-merge for the roster pull request"
              why="turning off auto-merge on pull request #$n failed."
              return 1
            fi
            state=$(pr_armed_state "$n") || { why="pull request #$n could not be re-read after its auto-merge was turned off."; return 1; }
            [ "$state" = clear ] && { echo "disarmed pull request #$n before the eval job's agent runs, confirmed by re-reading it"; return 0; }
            why="pull request #$n still shows auto-merge on after it was turned off."
            return 1
          }
          if ! found=$(find_roster_pr); then
            echo "::warning::could not find the roster pull request to disarm"
            unconfirmed "the open roster pull request could not be looked up."
          fi
          armed_pr=""
          case "${ARMED_PR_NUMBER:-}" in ''|*[!0-9]*) : ;; *) armed_pr="$ARMED_PR_NUMBER" ;; esac
          numbers="$found"
          if [ -n "$armed_pr" ] && [ "$armed_pr" != "$found" ]; then
            numbers="${numbers:+$numbers }$armed_pr"
          fi
          if [ -z "$numbers" ]; then
            confirmed "No roster pull request is left armed: there is no open roster pull request, and this run armed none."
          fi
          for n in $numbers; do
            check_one "$n" || unconfirmed "$why"
          done
          confirmed "No roster pull request is left armed: checked #${numbers// /, #}, each read back with auto-merge off (or no longer open)."
