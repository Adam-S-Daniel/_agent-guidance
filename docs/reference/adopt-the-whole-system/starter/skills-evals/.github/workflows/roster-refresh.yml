name: roster-refresh
# Weekly: rebuild evals/roster.yml from evals/roster-source.yml (guide 9.1)
# and open a pull request only when roster.yml would change. The kit reads
# the owner-edited source file and makes no network call for model data; the
# reference setup refreshes that file from usage data.
#
# The pull request comes from the roster-writer App (environment
# roster-writer: variable ROSTER_WRITER_CLIENT_ID, secret ROSTER_WRITER_PEM),
# so this repo's required checks run on it; a pull request opened with
# GITHUB_TOKEN would get none. Optional: without the App it reports the change
# and opens nothing.
on:
  schedule:
    - cron: '7 19 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roster-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: roster-writer      # App key lives here; default branch only
    steps:
      - uses: actions/checkout@<sha-of-the-v-tag-you-chose>
        with:
          persist-credentials: false
      - uses: actions/setup-python@<sha-of-the-v-tag-you-chose>
        with:
          python-version: "3.12"
      - name: Install the one dependency
        run: python3 -m pip install --quiet 'pyyaml==6.0.3'
      - name: Rebuild roster.yml (no credential here)
        id: build
        env:
          HAS_APP: ${{ vars.ROSTER_WRITER_CLIENT_ID != '' && secrets.ROSTER_WRITER_PEM != '' }}
        run: |
          set -euo pipefail
          python3 scripts/refresh_roster.py --write > refresh.json
          changed=$(jq -er .changed refresh.json)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "app=$HAS_APP" >> "$GITHUB_OUTPUT"
          echo "roster changed: $changed"
          if [ "$changed" = true ] && [ "$HAS_APP" != true ]; then
            echo "::warning::roster.yml would change, but the roster-writer App is not set up: nothing opened"
          fi
      - uses: actions/create-github-app-token@<sha-of-the-v-tag-you-chose>
        id: app
        if: steps.build.outputs.changed == 'true' && steps.build.outputs.app == 'true'
        with:
          client-id: ${{ vars.ROSTER_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.ROSTER_WRITER_PEM }}
          repositories: ${{ github.event.repository.name }}
      - name: Open the roster pull request
        if: steps.build.outputs.changed == 'true' && steps.build.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("roster-refresh/"))] | length')
          if [ "$open" != 0 ]; then echo "a roster pull request is already open"; exit 0; fi
          branch="roster-refresh/$(date -u +%Y%m%d)"
          git checkout --quiet -b "$branch"
          git add evals/roster.yml
          git -c user.name="roster-writer[bot]" -c user.email="roster-writer@users.noreply.github.com" \
            commit --quiet -m "Refresh the eval roster from roster-source.yml"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push --quiet "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          gh label create agent-authored --repo "$GITHUB_REPOSITORY" --force >/dev/null
          jq -r '"Seat \(.arms | join(", ")); judge \(.judge). Built from evals/roster-source.yml by roster-refresh.yml."' \
            refresh.json > body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --label agent-authored \
            --title "Refresh the eval roster" --body-file body.md
